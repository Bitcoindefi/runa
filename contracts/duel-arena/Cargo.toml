[package]
name = "duel-arena"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "=26.1.1"

[dev-dependencies]
soroban-sdk = { version = "=26.1.1", features = ["testutils"] }
stellar-tokens = "=0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
strip = true
panic = "abort"
codegen-units = 1