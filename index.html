              `La ranura ${saved.slot} de esta pagina tiene a ${mine.name}. Reemplazarla con la copia de la terminal?`
            )
          )
          if (!sure) return
        }
        try {
          const response = await fetch('saves/slot-' + saved.slot + '.json', { cache: 'no-store' })
          if (!response.ok) throw httpError('la partida', response)
          juego.importSave(saved.slot, await response.text())
          play({ load: saved.slot })
        } catch (error) {
          say(L('Could not copy that save: ', 'No pude copiar esa partida: ') + error.message)
        }
      }

      function settingsPage(box, back) {
        const done = sheet(box, L('Settings', 'Opciones'), back)
        const again = () => {
          settingsPage(box, back)
        }
        line(box, L('Language', 'Idioma'))
        choice(
          box,
          [
            ['en', 'English'],
            ['es', 'Español']
          ],
          settings.lang,
          (value) => {
            settings.lang = value
            applySettings('lang')
            again()
          }
        )
        line(box, L('Movement (Shift does the other one)', 'Movimiento (Shift hace el otro)'))
        choice(
          box,
          [
            [true, L('Run, Shift sprints', 'Correr, Shift esprinta')],
            [false, L('Walk, Shift runs', 'Caminar, Shift corre')]
          ],
          settings.run,
          (value) => {
            settings.run = value
            applySettings('run')
            again()
          }
        )
        line(box, L('Camera', 'Camara'))
        choice(
          box,
          [
            ['far', L('Far', 'Lejos')],
            ['near', L('Near', 'Cerca')]
          ],
          settings.camera,
          (value) => {
            settings.camera = value
            applySettings('camera')
            again()
          }
        )
        line(box, L('Shadows', 'Sombras'))
        choice(
          box,
          [
            [true, L('On', 'Si')],
            [false, L('Off (faster)', 'No (mas rapido)')]
          ],
          settings.shadows,
          (value) => {
            settings.shadows = value
            applySettings('shadows')
            again()
          }
        )
        done()
      }

      function applySettings(what) {
        keepSettings()
        if (what === 'lang') {
          document.documentElement.lang = settings.lang
          if (session) session.language(settings.lang)
          relabel()
          refreshPlayHud(true)
          if (screen === 'menu') {
            document.getElementById('tagline').textContent = L(
              'An ASCII RPG with a 3D world made with Tripo.',
              'Un RPG en ASCII con un mundo 3D hecho con Tripo.'
            )
          }
          if (screen === 'tour') tourTexts()
        }
        if (what === 'camera' && world) {
          camera.position.copy(controls.target).add(cameraOffset())
        }
        if (what === 'shadows') {
          renderer.shadowMap.enabled = settings.shadows
          scene.traverse((object) => {
            const list = object.material ? [object.material].flat() : []
            for (const material of list) material.needsUpdate = true
          })
        }
        if (what === 'run') refreshPlayHud(true)
      }

      function controlsPage(box, back) {
        const done = sheet(box, L('Controls', 'Controles'), back)
        const list = document.createElement('dl')
        const rows = [
          ['WASD', L('move (arrows too)', 'moverse (tambien las flechas)')],
          ['Shift', settings.run ? L('sprint', 'esprintar') : L('run', 'correr')],
          ['E', L('talk, use, enter', 'hablar, usar, entrar')],
          ['I', L('inventory and gear', 'inventario y equipo')],
          ['F', L('attack the Colossus', 'atacar al Coloso')],
          ['T', L('back to town', 'volver a la ciudad')],
          ['V', L('wallet and PvP', 'wallet y PvP')],
          ['R', L('reload your combat strategy', 'recargar tu estrategia de combate')],
          ['?', L("the game's own help", 'la ayuda del juego')],
          ['Tab', L('show the text screen', 'ver la pantalla de texto')],
          ['Esc', L('menu, or back', 'menu, o volver')]
        ]
        for (const [key, what] of rows) {
          const dt = document.createElement('dt')
          dt.textContent = key
          const dd = document.createElement('dd')
          dd.textContent = what
          list.append(dt, dd)
        }
        box.append(list)
        line(
          box,
          L(
            'On a phone: the pad moves you and the buttons on the left do the rest.',
            'En el celular: la cruceta te mueve y los botones de la izquierda hacen el resto.'
          )
        )
        done()
      }

      // --- Jugar: el juego de verdad, en la pagina ---------------------------

      let session = null
      let live = null
      let peek = false
      let paused = false
      let termShown = false
      let termDirty = false
      let termCols = 0
      let termRows = 0
      let shownGear = ''
      let firstGear = true
      let hudKey = ''
      const logLines = []

      // El juego empaquetado (scripts/build-juego.js). Pesa: se pide al arrancar
      // la pagina, mientras el menu ya se ve, y se reintenta como los mapas.
      async function loadGame() {
        // Un import() que fallo queda guardado como fallido para esa URL: cada
        // reintento pide otra.
        for (let i = 0; i < 4 && !juego; i++) {
          try {
            juego = (await import('./juego.js' + (i ? '?retry=' + i : ''))).default
          } catch (error) {
            console.warn('sin el juego todavia', error)
            await new Promise((resolve) => setTimeout(resolve, 700 * (i + 1)))
          }
        }
        if (juego) window.runaJuego = juego
        else
          say(
            L(
              'Could not load the game. Reload the page to try again.',
              'No pude cargar el juego. Recarga la pagina para probar de nuevo.'
            )
          )
        if (screen === 'menu' && menuPage.hidden) mainMenu()
        return juego
      }

      // Lo que muestra el registro: las ultimas lineas, traducidas al mostrarse.
      function pushLog(text) {
        logLines.push({ text, at: performance.now() })
        if (logLines.length > 4) logLines.shift()
        drawLog()
      }
      function drawLog() {
        logBox.replaceChildren(
          ...logLines.map((entry, i) => {
            const li = document.createElement('li')
            li.textContent = tr(entry.text)
            if (i < logLines.length - 2) li.className = 'old'
            return li
          })
        )
      }

      function play(how) {
        if (!juego) return
        leaveScreen()
        screen = 'play'
        playBox.hidden = false
        actions.hidden = !touchPad
        pad.hidden = !touchPad
        logLines.length = 0
        drawLog()
        firstGear = true
        shownGear = ''
        hudKey = ''
        live = null
        peek = false
        paused = false
        session = juego.start({
          language: settings.lang,
          cols: termCols || 120,
          rows: termRows || 36,
          onFrame: () => {
            termDirty = true
          },
          onSay: pushLog,
          onExit: () => {
            if (screen === 'play' && session && !session.running()) showMenu()
          }
        })
        window.runaGame = session
        if (how.load && !session.load(how.load)) {
          const message = session.runa.menuMessage
          stopPlay()
          showMenu()
          say(tr(message) || L('That save could not be loaded.', 'No se pudo cargar esa partida.'))
          return
        }
        if (how.begin) session.begin(how.begin)
        setupActions()
        fitTerm()
      }

      function stopPlay() {
        if (!session) return
        const ending = session
        session = null
        live = null
        ending.quit()
      }

      async function quitToTitle() {
        const ending = session
        session = null
        if (ending) await ending.quit()
        showMenu()
      }

      // Cada cuadro: lo que dice el juego llega a la vista 3D, a la ficha y a la
      // pantalla de texto; y los pasos sostenidos se convierten en teclas.
      function playFrame(dt, time) {
        if (!session) return
        live = session.state()
        const st = live
        if (st.world) enterWorld(st.world)
        else if (!st.title) {
          if (world) exitWorld()
          setScene(st.scene)
        }
        dressFrom(st)
        bossMarks(st.boss, time)
        const text = st.title || st.naming || !st.world || !!st.overlay || st.combat
        setTerm(text || peek)
        playBox.hidden = termShown
        refreshPlayHud()
        stepGame(dt, st)
        if (termShown && termDirty) drawTerm()
      }

      function dressFrom(st) {
        const key = JSON.stringify(st.equipped)
        if (key === shownGear) return
        shownGear = key
        for (const slot of SLOTS) {
          const entry = st.equipped[slot]
          const id = entry ? entry.id : null
          if (worn[slot] === id && !firstGear) continue
          worn[slot] = id
          wear(slot, entry, !firstGear)
        }
        firstGear = false
      }

      function bar(kind, value, most, text) {
        const share = most > 0 ? Math.max(0, Math.min(1, value / most)) : 0
        return `<div class="bar ${kind}"><i style="width:${(share * 100).toFixed(1)}%"></i><span>${text}</span></div>`
      }
      const esc = (text) =>
        String(text).replace(
          /[&<>"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]
        )

      function placeOf(st) {
        if (st.world && world && world.data && world.map === st.world.map)
          return tr(world.data.name)
        const names = {
          field: L('The meadow', 'La pradera'),
          dungeon: L('The crypt', 'La cripta'),
          'barbarian-camp': L('A barbarian camp', 'Un campamento barbaro'),
          boss: L('Volcanic ruins', 'Ruinas volcanicas')
        }
        if (st.field) return names[st.field] || st.field
        const map = juego && st.location.mapId ? juego.MAPS[st.location.mapId] : null
        return map ? tr(map.name) : ''
      }

      // La ficha se rearma solo si cambio algo de lo que muestra.
      function refreshPlayHud(force = false) {
        if (screen !== 'play' || !live) return
        const st = live
        const key = [
          st.name,
          st.level,
          st.hp,
          st.maxhp,
          st.xp,
          st.xpneed,
          st.gold,
          st.potions,
          placeOf(st),
          shownGear,
          st.boss ? [st.boss.hp, st.boss.phase, st.boss.defeated].join() : '',
          st.near ? st.near.kind + (st.near.name || '') : '',
          st.field,
          settings.lang,
          gaitName()
        ].join('|')
        if (key === hudKey && !force) return
        hudKey = key
        const wornText = SLOTS.map((slot) => st.equipped[slot])
          .filter(Boolean)
          .map((entry) => `<b>${esc(itemName(entry))}</b>`)
          .join(', ')
        statsBox.innerHTML =
          `<div class="who">${esc(st.name)} &middot; ${L('Lv', 'Nv')} ${st.level}</div>` +
          `<div class="where">${esc(placeOf(st))}</div>` +
          bar('hp', st.hp, st.maxhp, `${L('HP', 'Vida')} ${st.hp}/${st.maxhp}`) +
          bar('xp', st.xp, st.xpneed, `${L('XP', 'Exp')} ${st.xp}/${st.xpneed || '-'}`) +
          `<div class="purse">${L('Gold', 'Oro')} ${st.gold} &middot; ${L('Potions', 'Pociones')} ${st.potions}</div>` +
          (wornText ? `<div class="worn">${wornText}</div>` : '')
        const boss = st.boss
        bossBox.hidden = !boss || boss.defeated
        if (boss && !boss.defeated) {
          bossBox.innerHTML =
            `${L('The Runic Colossus', 'El Coloso runico')}` +
            bar('', boss.hp, boss.maxhp, `${boss.hp}/${boss.maxhp}`)
        }
        const mode = gaitName()
        const names = {
          walk: L('Walking', 'Caminando'),
          run: L('Running', 'Corriendo'),
          sprint: L('Sprinting', 'Esprintando')
        }
        gaitBox.innerHTML = `<b>${names[mode]}</b> &middot; Shift: ${
          settings.run ? L('sprint', 'esprintar') : L('run', 'correr')
        }`
        let hint = ''
        if (st.near && st.near.kind === 'npc')
          hint = L('E · talk to ', 'E · hablar con ') + tr(st.near.name)
        else if (st.near && st.near.kind === 'ranking') hint = L('E · leaderboard', 'E · ranking')
        else if (st.boss && !st.boss.defeated)
          hint = L('F · strike the Colossus', 'F · golpear al Coloso')
        hintBox.textContent = hint
        drawLog()
        const gaitButton = actions.querySelector('[data-act="gait"]')
        if (gaitButton) {
          gaitButton.textContent = settings.run ? L('Run', 'Corre') : L('Walk', 'Camina')
          gaitButton.setAttribute('aria-pressed', String(settings.run))
        }
      }

      // --- La pantalla de texto ---------------------------------------------

      const FG = { 30: 'k', 31: 'r', 32: 'g', 33: 'y', 34: 'b', 35: 'm', 36: 'c', 37: 'w' }
      // El juego pinta con SGR: colores 30-37, 90-97 y atributos. Nada mas.
      function sgrToHtml(view) {
        let html = ''
        let state = { fg: null, bold: false, faint: false, reverse: false, underline: false }
        const pattern = /\x1b\[([0-9;]*)m/g
        let last = 0
        const flush = (text) => {
          if (!text) return
          const kinds = []
          if (state.fg) kinds.push('f' + state.fg)
          if (state.bold) kinds.push('b')
          if (state.faint) kinds.push('d')
          if (state.reverse) kinds.push('v')
          if (state.underline) kinds.push('u')
          html += kinds.length ? `<span class="${kinds.join(' ')}">${esc(text)}</span>` : esc(text)
        }
        let match
        while ((match = pattern.exec(view))) {
          flush(view.slice(last, match.index))
          last = pattern.lastIndex
          const codes = match[1] === '' ? [0] : match[1].split(';').map(Number)
          for (let i = 0; i < codes.length; i++) {
            const c = codes[i]
            if (c === 0)
              state = { fg: null, bold: false, faint: false, reverse: false, underline: false }
            else if (c === 1) state.bold = true
            else if (c === 2) state.faint = true
            else if (c === 22) state.bold = state.faint = false
            else if (c === 4) state.underline = true
            else if (c === 24) state.underline = false
            else if (c === 7) state.reverse = true
            else if (c === 27) state.reverse = false
            else if (c === 39) state.fg = null
            else if (FG[c]) state.fg = FG[c]
            else if (c >= 90 && c <= 97) state.fg = 'h' + FG[c - 60]
            else if (c === 38 && codes[i + 1] === 5) i += 2
            else if (c === 38 && codes[i + 1] === 2) i += 4
          }
        }
        // Lo que no es SGR (mover el cursor) no deberia llegar; si llega, afuera.
        flush(view.slice(last).replace(/\x1b\[[0-9;?]*[A-Za-z]/g, ''))
        return html
      }

      function drawTerm() {
        termDirty = false
        if (session) term.innerHTML = sgrToHtml(session.frame())
      }

      function setTerm(on) {
        if (on === termShown) return
        termShown = on
        term.hidden = !on
        if (on) {
          // Lo que estaba sostenido no sigue caminando detras de la pantalla.
          mover.held.clear()
          fitTerm()
          termDirty = true
        }
      }

      // La letra mas grande con la que entran 64 columnas y 18 filas (lo minimo
      // que dibuja el juego bien), y el juego se acomoda a lo que entra.
      let cell = null
      function measureCell() {
        const probe = document.createElement('span')
        probe.style.cssText = 'position:absolute;visibility:hidden;font-size:100px;line-height:1.2'
        probe.textContent = 'M'.repeat(20)
        term.append(probe)
        const box = probe.getBoundingClientRect()
        probe.remove()
        return box.width ? { w: box.width / 20 / 100, h: box.height / 100 } : null
      }
      function fitTerm() {
        if (term.hidden || !session) return
        if (!cell) cell = measureCell()
        if (!cell) return
        const width = term.clientWidth - 24
        const height = term.clientHeight - 20
        let px = 15
        while (px > 8 && (width / (cell.w * px) < 64 || height / (cell.h * px) < 18)) px--
        term.style.fontSize = px + 'px'
        const cols = Math.max(64, Math.floor(width / (cell.w * px)))
        const rows = Math.max(16, Math.floor(height / (cell.h * px)))
        if (cols === termCols && rows === termRows) return
        termCols = cols
        termRows = rows
        session.resize(cols, rows)
      }
      window.addEventListener('resize', () => fitTerm())

      // --- Moverse ----------------------------------------------------------

      // Cada paso es una tecla para el juego, al ritmo del paso elegido: una celda
      // mide 0,5 m de ancho y 1 m de alto, asi que al correr van unas 14 columnas
      // o 7 filas por segundo. En diagonal van dos columnas por fila, que en el
      // mapa es en serio a 45 grados. Una tecla que no movio al heroe (una pared,
      // un NPC) no se repite enseguida, para no llenar el registro.
      const mover = {
        held: new Set(),
        fingers: new Map(),
        wait: 0,
        phase: 0,
        last: null,
        blocked: null,
        until: 0
      }
      const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }
      const MOVES = {
        ArrowUp: 'up',
        w: 'up',
        ArrowDown: 'down',
        s: 'down',
        ArrowLeft: 'left',
        a: 'left',
        ArrowRight: 'right',
        d: 'right'
      }
      function heading(held, fingers) {
        let dx = 0
        let dy = 0
        for (const dir of [...held, ...fingers.values()]) {
          if (!DIRS[dir]) continue
          dx += DIRS[dir][0]
          dy += DIRS[dir][1]
        }
        return [Math.sign(dx), Math.sign(dy)]
      }
      const cellOf = (st) =>
        st && st.location
          ? st.location.x + ',' + st.location.y + ',' + (st.location.mapId || st.field)
          : ''
      function exploring(st) {
        return !!st && !st.title && !st.naming && !st.overlay && !paused
      }

      function stepGame(dt, st) {
        if (mover.last) {
          if (cellOf(st) === mover.last.from) {
            mover.blocked = mover.last.key
            mover.until = performance.now() + 450
          }
          mover.last = null
        }
        if (!exploring(st) || (peek && !st.combat && st.world)) {
          mover.wait = 0
          return
        }
        const [dx, dy] = heading(mover.held, mover.fingers)
        if (!dx && !dy) {
          mover.wait = 0
          mover.phase = 0
          return
        }
        mover.wait -= dt
        if (mover.wait > 0) return
        if (mover.wait < -0.1) mover.wait = 0
        const horizontal = dx < 0 ? 'left' : 'right'
        const vertical = dy < 0 ? 'up' : 'down'
        const now = performance.now()
        const stuck = (key) => key === mover.blocked && now < mover.until
        let key =
          dx && dy ? (mover.phase++ % 3 === 2 ? vertical : horizontal) : dx ? horizontal : vertical
        // En diagonal contra una pared, se desliza por el eje que queda libre.
        if (stuck(key) && dx && dy) key = key === vertical ? horizontal : vertical
        if (stuck(key)) {
          mover.wait = 0.05
          return
        }
        mover.last = { key, from: cellOf(st) }
        session.press(key)
        const meters = key === 'up' || key === 'down' ? CZ : CX
        mover.wait += meters / pace().speed
        // En combate cada paso contra el monstruo es un golpe: uno cada 0,3 s.
        if (st.combat) mover.wait = Math.max(mover.wait, 0.3)
      }

      // --- Teclas ------------------------------------------------------------

      function playKey(event, down) {
        if (!session) return
        if (event.key === 'Shift') {
          shiftHeld = down
          return
        }
        if (paused) {
          if (down && event.key === 'Escape') closePause()
          return
        }
        const st = live || session.state()
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key
        const dir = MOVES[key]
        const roaming = exploring(st)
        if (dir && roaming) {
          event.preventDefault()
          if (down) mover.held.add(dir)
          else mover.held.delete(dir)
          return
        }
        if (!down) return
        if (dir) {
          // En una pantalla del juego (tienda, inventario) las flechas mueven el
          // cursor: una tecla por pulsacion, con la repeticion del teclado.
          event.preventDefault()
          if (st.naming && key.length === 1) session.press(event.key)
          else session.press(key.length === 1 ? key : dir)
          return
        }
        if (event.key === 'Escape') {
          event.preventDefault()
          if (peek) peek = false
          else if (roaming && !st.duel) openPause()
          else session.press('escape')
          return
        }
        if (event.key === 'Tab') {
          event.preventDefault()
          if (roaming && st.world) peek = !peek
          else session.press('tab')
          return
        }
        const named = { Enter: 'enter', ' ': 'space', Backspace: 'backspace', Delete: 'delete' }[
          event.key
        ]
        if (named) {
          event.preventDefault()
          session.press(named)
          return
        }
        if (event.key.length === 1) {
          if (event.repeat && !st.naming && !st.overlay) return
          event.preventDefault()
          session.press(event.key)
        }
      }

      // --- El menu de la partida ---------------------------------------------

      const pauseSheet = pause.querySelector('.sheet')
      function openPause() {
        paused = true
        mover.held.clear()
        mover.fingers.clear()
        pause.hidden = false
        pauseMain()
      }
      function closePause() {
        paused = false
        pause.hidden = true
      }
      function pauseMain() {
        const done = sheet(pauseSheet, L('Menu', 'Menu'), closePause)
        pauseSheet.append(
          button(L('Back to the game', 'Volver al juego'), L('Esc', 'Esc'), closePause)
        )
        pauseSheet.append(
          button(
            L('Combat strategy', 'Estrategia de combate'),
            L(
              'The script your hero follows in every fight',
              'El guion que sigue tu heroe en cada pelea'
            ),
            strategyPage
          )
        )
        pauseSheet.append(
          button(L('Settings', 'Opciones'), null, () => settingsPage(pauseSheet, pauseMain))
        )
        pauseSheet.append(
          button(L('Controls', 'Controles'), null, () => controlsPage(pauseSheet, pauseMain))
        )
        pauseSheet.append(
          button(
            L('Save and quit to title', 'Guardar y salir al titulo'),
            L('The game saves on every step', 'El juego guarda en cada paso'),
            quitToTitle
          )
        )
        pauseSheet.querySelector('button').focus()
        // Aca "volver" es seguir jugando: la hoja principal no lleva el boton.
        void done
      }

      // La estrategia es script.txt, el mismo archivo que en la terminal: el juego
      // la relee sola cuando cambia, aun en medio de una pelea.
      function strategyPage() {
        const done = sheet(pauseSheet, L('Combat strategy', 'Estrategia de combate'), pauseMain)
        line(
          pauseSheet,
          L(
            'Fights run on their own with this script. Lines with ? are conditions; the indented line under one is what to do.',
            'Las peleas corren solas con este guion. Las lineas con ? son condiciones; la de abajo, con sangria, es lo que se hace.'
          )
        )
        const area = document.createElement('textarea')
        area.spellcheck = false
        area.value = session.script.read()
        pauseSheet.append(area)
        const status = line(pauseSheet, '')
        pauseSheet.append(
          button(L('Save the strategy', 'Guardar la estrategia'), null, () => {
            session.script.write(area.value)
            status.className = ''
            status.textContent = L(
              'Saved. The game reloads it on the next tick.',
              'Guardada. El juego la relee en el proximo tick.'
            )
            setTimeout(() => {
              const errors = session ? session.script.errors() : []
              if (!errors.length) return
              status.className = 'error'
              status.textContent = errors
                .map((error) => `${L('line', 'linea')} ${error.line}: ${tr(error.message)}`)
                .join(' · ')
            }, 250)
          })
        )
        done()
        area.focus()
      }

      // --- Botones tactiles ---------------------------------------------------

      let actionsReady = false
      function setupActions() {
        if (actionsReady) return
        actionsReady = true
        const list = [
          ['e', 'E'],
          ['i', 'I'],
          ['f', 'F'],
          ['escape', 'Esc'],
          ['enter', 'OK'],
          ['gait', ''],
          ['t', 'T'],
          ['peek', 'Txt'],
          ['menu', '≡']
        ]
        for (const [act, text] of list) {
          const b = document.createElement('button')
          b.type = 'button'
          b.dataset.act = act
          b.textContent = text
          b.addEventListener('click', () => {
            b.blur()
            if (!session) return
            if (act === 'menu') return paused ? closePause() : openPause()
            if (act === 'gait') {
              settings.run = !settings.run
              applySettings('run')
              return
            }
            if (act === 'peek') {
              peek = !peek
              return
            }
            session.press(act)
          })
          actions.append(b)
        }
      }

      // --- Recorrer: el mundo 3D sin reglas ----------------------------------

      // En las ruinas se arranca a 10 m del Coloso, para que se vea apenas se llega.
      // En la ciudad, en el pasto a la derecha de Elian (160,132): se ven los dos,
      // los nombres no se pisan y ya aparece la ayuda para hablarle.
      const PLACES = [
        {
          map: 'city',
          short: ['City', 'Ciudad'],
          name: ['The city of RUNA', 'La ciudad de RUNA'],
          at: [164, 132]
        },
        {
          map: 'nox',
          short: ['NOX', 'NOX'],
          name: ['NOX, the rival kingdom', 'NOX, el reino rival'],
          at: [160, 130]
        },
        {
          map: 'castle',
          short: ['Castle', 'Castillo'],
          name: ['The castle', 'El castillo'],
          at: [56, 17]
        },
        {
          map: 'coliseum',
          short: ['Coliseum', 'Coliseo'],
          name: ['The Coliseum, for duels', 'El Coliseo, para los duelos'],
          at: [64, 26]
        },
        {
          map: 'boss',
          short: ['Colossus', 'Coloso'],
          name: [
            'Volcanic ruins: the Runic Colossus, the world boss',
            'Ruinas volcanicas: el Coloso runico, el jefe del mundo'
          ],
          at: [84, 22]
        },
        {
          map: null,
          short: ['Showcase', 'Vitrina'],
          name: [
            'Showcase: the stickman and the Tripo kingdom',
            'Vitrina: el stickman y el reino de Tripo'
          ]
        }
      ]
      // La mochila del recorrido: lo que se puede probar puesto.
      const DEMO_BAG = [
        { id: 'iron_helmet', name: 'iron rune helmet (Tripo)', slot: 'head' },
        { id: 'sword', name: 'sword', slot: 'left_hand' },
        { id: 'shield', name: 'rune shield', slot: 'right_hand' },
        { id: 'plate', name: 'plate armor', slot: 'chest' },
        { id: 'boots', name: 'leather boots', slot: 'boots' }
      ]
      const GEAR_EN = {
        left_hand: 'weapon',
        right_hand: 'shield',
        chest: 'chest',
        head: 'head',
        boots: 'boots'
      }
      const GEAR_ES = {
        left_hand: 'izq',
        right_hand: 'der',
        chest: 'pecho',
        head: 'casco',
        boots: 'botas'
      }
      // held: flechas del teclado; fingers: la flecha bajo cada dedo en la cruceta.
      const demo = {
        map: undefined,
        data: null,
        x: 0,
        y: 0,
        held: new Set(),
        fingers: new Map(),
        wait: 0,
        busy: false,
        bag: DEMO_BAG
      }
      const placeButtons = []
      window.runaDemo = () => ({
        screen,
        driver: { tour: 'demo', mirror: 'terminal', play: 'juego' }[screen] || screen,
        place: PLACES.findIndex((entry) => entry.map === demo.map),
        map: world ? world.map : null,
        x: screen === 'play' && live && live.location ? live.location.x : demo.x,
        y: screen === 'play' && live && live.location ? live.location.y : demo.y,
        helmet: worn.head || null,
        onAvatar: avatarHead.children.length,
        avatar: avatar.visible,
        gait: gaitClip,
        timeScale: gait ? Number(gait.timeScale.toFixed(2)) : 0,
        velocity: Number(velocity.toFixed(2)),
        term: termShown,
        overlay: live ? live.overlay : null
      })

      function placeName(map) {
        const place = PLACES.find((entry) => entry.map === map)
        return place ? pick(place.name) : map
      }

      function tileOf(data, x, y) {
        return data.tiles[(data.rows[y] || '')[x]]
      }

      function walkable(data, x, y) {
        if (x < 0 || y < 0 || x >= data.width || y >= data.height) return false
        const ch = (data.rows[y] || '')[x] || ' '
        if (data.kind === 'boss') {
          if ('#~|-+'.includes(ch)) return false
          // El cuerpo del Coloso: world-boss-event.js distanceToBody.
          const boss = data.boss
          return !boss || Math.abs(x - boss.x) > 11 || y < boss.y - 8 || y > boss.y
        }
        const tile = data.tiles[ch]
        if (!tile || tile.solid) return false
        if (!data.npcCells)
          data.npcCells = new Set((data.npcs || []).map((npc) => npc.x + ',' + npc.y))
        return !data.npcCells.has(x + ',' + y)
      }

      // La celda libre mas cercana, por si el punto de partida cae en una pared.
      // Al llegar por un porton se evitan puertas y portones, para no rebotar.
      function nearestWalkable(data, x, y, avoidDoors = false) {
        const ok = (cx, cy) => {
          if (!walkable(data, cx, cy)) return false
          const tile = tileOf(data, cx, cy)
          return !avoidDoors || !(tile && tile.enter)
        }
        const seen = new Set([x + ',' + y])
        const queue = [[x, y]]
        for (let i = 0; i < queue.length; i++) {
          const [cx, cy] = queue[i]
          if (ok(cx, cy)) return [cx, cy]
          for (const [dx, dy] of Object.values(DIRS)) {
            const nx = cx + dx
            const ny = cy + dy
            if (nx < 0 || ny < 0 || nx >= data.width || ny >= data.height) continue
            if (seen.has(nx + ',' + ny)) continue
            seen.add(nx + ',' + ny)
            queue.push([nx, ny])
          }
        }
        return [x, y]
      }

      async function goMap(map, at) {
        const place = PLACES.find((entry) => entry.map === map) || PLACES[0]
        demo.map = map
        demo.held.clear()
        placeButtons.forEach((b) =>
          b.setAttribute('aria-pressed', String(b.dataset.map === String(map)))
        )
        // En la vitrina no se camina: la cruceta se esconde.
        pad.hidden = !touchPad || !map
        talkBox.hidden = true
        if (!map) {
          demo.data = null
          exitWorld()
          setScene('reino')
          mode.textContent = pick(place.name)
          return
        }
        let data
        try {
          data = await mapData(map)
        } catch (error) {
          mode.textContent = L('could not load ', 'no pude cargar ') + pick(place.short)
          console.warn(error)
          return
        }
        if (demo.map !== map || screen !== 'tour') return
        const [x, y] = nearestWalkable(data, ...(at || place.at), true)
        Object.assign(demo, { data, x, y })
        await enterWorld({ map, x, y })
        hint()
      }

      // Un paso de celda por vez, como en la terminal, al paso elegido; si la
      // diagonal choca, se desliza por el eje que queda libre. Como la terminal
      // mueve un eje por vez, la diagonal solo pasa si una de las dos celdas de al
      // lado esta libre: asi no se cuela entre dos paredes.
      function stepDemo(dt) {
        if (demo.busy || !world || !demo.data || world.map !== demo.map) return
        const [dx, dy] = heading(demo.held, demo.fingers)
        if (!dx && !dy) {
          demo.wait = 0
          return
        }
        demo.wait -= dt
        if (demo.wait > 0) return
        if (demo.wait < -0.1) demo.wait = 0
        const tries =
          dx && dy
            ? [
                [dx, dy],
                [dx, 0],
                [0, dy]
              ]
            : [[dx, dy]]
        const free = (sx, sy) => walkable(demo.data, demo.x + sx, demo.y + sy)
        for (const [sx, sy] of tries) {
          if (!free(sx, sy)) continue
          if (sx && sy && !free(sx, 0) && !free(0, sy)) continue
          demo.x += sx
          demo.y += sy
          heroTarget.copy(world.built.toWorld(demo.x, demo.y))
          demo.wait += Math.hypot(sx * CX, sy * CZ) / pace().speed
          arrive()
          return
        }
        demo.wait = 0.05
      }

      // Pisar un porton lleva al otro mapa; pisar una puerta avisa que adentro se
      // juega con "Jugar".
      function arrive() {
        const tile = tileOf(demo.data, demo.x, demo.y)
        const enter = tile && tile.enter
        if (enter && enter.kind === 'travel') travel(enter)
        else if (enter) {
          say(
            tr(tile.name) +
              L(
                ': the inside is played with Play in the menu',
                ': adentro se juega con Jugar, en el menu'
              )
          )
        }
        hint()
      }

      // Se llega al lado del porton que vuelve al mapa de donde se viene, como en la
      // terminal. Los caminos a la pradera o a la cripta no tienen mapa 3D.
      async function travel(enter) {
        if (!PLACES.some((place) => place.map === enter.to)) {
          say(
            L(
              'That road leaves the 3D maps: follow it in a real game.',
              'Ese camino sale de los mapas 3D: seguilo en una partida.'
            )
          )
          return
        }
        demo.busy = true
        try {
          const data = await mapData(enter.to)
          let gate = null
          for (let y = 0; y < data.height && !gate; y++) {
            const row = data.rows[y] || ''
            for (let x = 0; x < row.length; x++) {
              const tile = data.tiles[row[x]]
              if (tile && tile.enter && tile.enter.to === demo.map) {
                gate = [x, y]
                break
              }
            }
          }
          await goMap(enter.to, gate || undefined)
        } catch (error) {
          say(L('could not travel: ', 'no pude viajar: ') + error.message)
        } finally {
          demo.busy = false
        }
      }

      // El NPC mas cercano, a menos de 2,4 m.
      function nearbyNpc() {
        if (!demo.data || !demo.data.npcs) return null
        let best = null
        let bestDistance = 2.4
        for (const npc of demo.data.npcs) {
          const distance = Math.hypot((npc.x - demo.x) * CX, (npc.y - demo.y) * CZ)
          if (distance <= bestDistance) {
            best = npc
            bestDistance = distance
          }
        }
        return best
      }

      function hint() {
        if (!demo.map || screen !== 'tour') return
        const npc = nearbyNpc()
        mode.textContent =
          placeName(demo.map) + (npc ? L(' · E: talk to ', ' · E: hablar con ') + tr(npc.name) : '')
      }

      let talkTimer = 0
      function talk() {
        const npc = nearbyNpc()
        if (!npc) {
          say(L('Nobody close enough to talk to.', 'No hay nadie cerca para hablar.'))
          return
        }
        const speaker = document.createElement('strong')
        speaker.textContent = tr(npc.name) + (npc.role ? ', ' + tr(npc.role) : '')
        const words = document.createElement('p')
        words.textContent = npc.line ? '"' + tr(npc.line) + '"' : '...'
        talkBox.replaceChildren(speaker, words)
        if (npc.action === 'shop' || npc.action === 'tavern') {
          const note = document.createElement('small')
          note.textContent = L(
            'Trading happens in a real game: Play, in the menu.',
            'Para comprar hace falta una partida: Jugar, en el menu.'
          )
          talkBox.append(note)
        }
        talkBox.hidden = false
        clearTimeout(talkTimer)
        talkTimer = setTimeout(() => {
          talkBox.hidden = true
        }, 8000)
      }

      function showTourGear() {
        gear.replaceChildren()
        for (const slot of SLOTS) {
          const id = worn[slot]
          const item = id && demo.bag.find((entry) => entry.id === id)
          const dt = document.createElement('dt')
          dt.textContent = (settings.lang === 'es' ? GEAR_ES : GEAR_EN)[slot]
          const dd = document.createElement('dd')
          dd.textContent = id ? (item ? item.name : id) : '-'
          gear.append(dt, dd)
        }
      }

      // Equipar desde la mochila del recorrido cambia lo que se ve, nada mas.
      function equip(item) {
        const off = worn[item.slot] === item.id
        worn[item.slot] = off ? null : item.id
        wear(item.slot, off ? null : item, !off)
        if (off) say(L('took off ', 'te sacaste ') + item.name)
        showTourGear()
      }

      function openBag(show = bagBox.hidden) {
        bagBox.hidden = !show
        if (!show) return
        const title = document.createElement('strong')
        title.textContent = L(
          'Bag: click to equip or take off',
          'Mochila: clic para equipar o sacar'
        )
        bagBox.replaceChildren(title)
        for (const item of demo.bag) {
          const b = document.createElement('button')
          b.textContent = (worn[item.slot] === item.id ? '[x] ' : '[ ] ') + item.name
          b.addEventListener('click', () => {
            b.blur()
            equip(item)
            openBag(true)
          })
          bagBox.append(b)
        }
      }

      function tourKey(event, down) {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key
        if (key === 'Shift') {
          shiftHeld = down
          return
        }
        const dir = MOVES[key]
        if (dir) {
          event.preventDefault()
          if (down) demo.held.add(dir)
          else demo.held.delete(dir)
          return
        }
        if (!down || event.repeat) return
        if (key >= '1' && key <= String(PLACES.length)) goMap(PLACES[Number(key) - 1].map)
        else if (key === 'e') talk()
        else if (key === 'i') openBag()
        else if (key === 'h') equip(DEMO_BAG[0])
        else if (key === 'Escape') {
          if (!bagBox.hidden || !talkBox.hidden) {
            bagBox.hidden = true
            talkBox.hidden = true
          } else showMenu()
        }
      }

      function tourTexts() {
        document.querySelector('#hud h1').textContent = '[ RUNA x TRIPO ]'
        who.textContent = L(
          'The 3D world without rules. The hero, the helmet, the Colossus and the kingdom are Tripo models; Higgsfield rigged and animated the hero.',
          'El mundo 3D sin reglas. El heroe, el yelmo, el Coloso y el reino son modelos de Tripo; Higgsfield le puso esqueleto y animo al heroe.'
        )
        keysLine.textContent = touchPad
          ? L(
              'Pad: run. Tap a place. E: talk. I: bag.',
              'Cruceta: correr. Toca un lugar. E: hablar. I: mochila.'
            )
          : L(
              'WASD: run (Shift sprints). E: talk. I: bag. H: Tripo helmet. 1-6: place. Esc: menu.',
              'WASD: correr (Shift esprinta). E: hablar. I: mochila. H: yelmo de Tripo. 1-6: lugar. Esc: menu.'
            )
        placeButtons.forEach((b, i) => {
          b.textContent = i + 1 + ' ' + pick(PLACES[i].short)
        })
        const extra = document.querySelectorAll('#places [data-extra]')
        if (extra[0]) extra[0].textContent = L('E talk', 'E hablar')
        if (extra[1]) extra[1].textContent = L('I bag', 'I mochila')
        if (extra[2]) extra[2].textContent = L('Menu', 'Menu')
        showTourGear()
      }

      // Botones de lugar y de accion. Se arman una sola vez.
      let tourReady = false
      function setupTour() {
        if (tourReady) return
        tourReady = true
        const nav = document.getElementById('places')
        // Despues de un clic el boton suelta el foco: si no, Espacio o Enter lo
        // vuelven a apretar.
        const tap = (b, action) =>
          b.addEventListener('click', () => {
            b.blur()
            action()
          })
        PLACES.forEach((place) => {
          const b = document.createElement('button')
          b.dataset.map = String(place.map)
          tap(b, () => goMap(place.map))
          nav.append(b)
          placeButtons.push(b)
        })
        for (const action of [talk, () => openBag(), showMenu]) {
          const b = document.createElement('button')
          b.dataset.extra = '1'
          tap(b, action)
          nav.append(b)
        }
      }

      function startTour() {
        leaveScreen()
        screen = 'tour'
        hud.hidden = false
        setupTour()
        document.getElementById('places').hidden = false
        links.hidden = !DEMO
        // El recorrido arranca con lo que llevaba la partida, o sin nada.
        for (const slot of SLOTS) {
          worn[slot] = null
          wear(slot, null, false)
        }
        tourTexts()
        goMap('city')
      }

      // --- Seguir la terminal (solo en el visor local) ------------------------

      let mirrorTimer = 0
      let mirrorFirst = true
      let mirrorGear = ''
      function startMirror() {
        leaveScreen()
        screen = 'mirror'
        hud.hidden = false
        mirrorFirst = true
        mirrorGear = ''
        document.querySelector('#hud h1').textContent = '[ RUNA ]'
        who.textContent = L(
          'following the terminal game...',
          'siguiendo al juego de la terminal...'
        )
        keysLine.textContent = L(
          'WASD or arrows: walk. E: talk. I: inventory. The keys go to the terminal. Esc twice: menu.',
          'WASD o flechas: caminar. E: hablar. I: inventario. Las teclas van a la terminal. Esc dos veces: menu.'
        )
        clearInterval(mirrorTimer)
        mirrorTimer = setInterval(pollMirror, 200)
        pollMirror()
      }

      async function pollMirror() {
        if (screen !== 'mirror') {
          clearInterval(mirrorTimer)
          return
        }
        let state
        try {
          state = await (await fetch('state.json', { cache: 'no-store' })).json()
        } catch {
          who.textContent = L('the viewer is not answering', 'el visor no responde')
          return
        }
        if (screen !== 'mirror') return
        if (!state.listening) {
          terminalOpen = false
          showMenu()
          say(L('The terminal game closed.', 'El juego de la terminal se cerro.'))
          return
        }
        if (state.empty) {
          who.textContent = state.busy
            ? L('reading the save...', 'leyendo la partida...')
            : L(
                'no saves yet: start a game in the terminal',
                'no hay partidas: entra a una en la terminal'
              )
          return
        }
        who.textContent =
          state.name + ', ' + L('level ', 'nivel ') + state.level + ', ' + (tr(state.place) || '')
        const gearKey = JSON.stringify(state.equipped)
        if (gearKey !== mirrorGear) {
          mirrorGear = gearKey
          gear.replaceChildren()
          for (const slot of SLOTS) {
            const dt = document.createElement('dt')
            dt.textContent = (settings.lang === 'es' ? GEAR_ES : GEAR_EN)[slot]
            const dd = document.createElement('dd')
            dd.textContent = itemName(state.equipped[slot])
            gear.append(dt, dd)
          }
        }
        for (const slot of SLOTS) {
          const id = state.equipped[slot] ? state.equipped[slot].id : null
          if (worn[slot] === id && !mirrorFirst) continue
          worn[slot] = id
          wear(slot, state.equipped[slot], !mirrorFirst)
        }
        if (state.world) enterWorld(state.world)
        else {
          exitWorld()
          setScene(state.scene)
          mode.textContent =
            L('showcase: ', 'vitrina: ') +
            (tr(state.place) || L('this zone', 'esta zona')) +
            L(' has no 3D map yet', ' todavia no tiene mapa 3D')
        }
        mirrorFirst = false
      }

      // Las teclas van a la terminal en fila, en el orden en que se apretaron.
      const TERMINAL_KEYS = {
        ArrowUp: 'up',
        ArrowDown: 'down',
        ArrowLeft: 'left',
        ArrowRight: 'right',
        Enter: 'enter',
        Escape: 'escape',
        Backspace: 'backspace',
        Tab: 'tab',
        ' ': 'space'
      }
      let keyChain = Promise.resolve()
      let lastEscape = 0
      function mirrorKey(event) {
        const key = TERMINAL_KEYS[event.key] || (event.key.length === 1 ? event.key : null)
        if (!key) return
        event.preventDefault()
        if (key === 'escape') {
          // Dos Esc seguidos vuelven al menu; uno solo va al juego.
          if (performance.now() - lastEscape < 400) {
            showMenu()
            return
          }
          lastEscape = performance.now()
        }
        if (key === 'q' || key === 'Q') {
          keysLine.textContent = L(
            'Q closes the game: quit from the terminal.',
            'Q cierra el juego: para salir usa la terminal.'
          )
          return
        }
        keyChain = keyChain.then(async () => {
          try {
            const response = await fetch('key', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-Runa': '1' },
              body: JSON.stringify({ key })
            })
            if (response.status === 409) {
              keysLine.textContent = L(
                'The game is not reading keys: start it with npm.cmd start -- --teclas',
                'El juego no esta leyendo teclas: abrilo con npm.cmd start -- --teclas'
              )
            }
          } catch {
            keysLine.textContent = L('the viewer is not answering', 'el visor no responde')
          }
        })
      }

      // Si la terminal se abre o se cierra mientras se esta en el menu, el menu lo
      // muestra; las partidas de la terminal se ofrecen para copiar.
      async function checkTerminal() {
        if (DEMO || screen === 'mirror') return
        try {
          const state = await (await fetch('state.json', { cache: 'no-store' })).json()
          const open = !!state.listening
          let saves = terminalSaves
          try {
            const response = await fetch('saves.json', { cache: 'no-store' })
            if (response.ok) saves = await response.json()
          } catch {
            // Sin la lista, quedan las de antes.
          }
          const changed =
            open !== terminalOpen || JSON.stringify(saves) !== JSON.stringify(terminalSaves)
          terminalOpen = open
          terminalSaves = saves
          if (changed && screen === 'menu' && menuPage.hidden) mainMenu()
        } catch {
          // El visor no contesta: se vuelve a probar en un rato.
        }
      }

      // --- Teclado, cruceta y arranque -----------------------------------------

      function menuKey(event) {
        const inPage = !menuPage.hidden
        if (event.key === 'Escape' && inPage) {
          event.preventDefault()
          mainMenu()
          return
        }
        if (event.target.closest && event.target.closest('input, textarea')) return
        const list = [...(inPage ? menuPage : menuMain).querySelectorAll('button:not([disabled])')]
        const at = list.indexOf(document.activeElement)
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key
        if (key === 'ArrowDown' || key === 's') {
          event.preventDefault()
          list[(at + 1) % list.length].focus()
        } else if (key === 'ArrowUp' || key === 'w') {
          event.preventDefault()
          list[(at - 1 + list.length) % list.length].focus()
        }
      }

      window.addEventListener('keydown', (event) => {
        if (event.ctrlKey || event.metaKey || event.altKey) return
        const typing = event.target.closest && event.target.closest('input, textarea')
        if (screen === 'menu') return menuKey(event)
        if (typing) {
          if (event.key === 'Escape' && screen === 'play') closePause()
          return
        }
        if (screen === 'play') playKey(event, true)
        else if (screen === 'tour') tourKey(event, true)
        else if (screen === 'mirror') mirrorKey(event)
      })
      window.addEventListener('keyup', (event) => {
        if (screen === 'play') playKey(event, false)
        else if (screen === 'tour') tourKey(event, false)
      })
      window.addEventListener('blur', () => {
        demo.held.clear()
        demo.fingers.clear()
        mover.held.clear()
        mover.fingers.clear()
        shiftHeld = false
      })
      window.addEventListener('pagehide', () => {
        try {
          if (session) session.runa.saveCurrent()
        } catch {
          // Se guardo en el ultimo paso igual.
        }
      })

      // La cruceta manda la flecha que el dedo tiene debajo, asi se puede deslizar
      // de una a otra sin levantarlo. En una pantalla del juego (una tienda) cada
      // toque es una tecla, y sostenido se repite.
      const under = (event) => {
        const target = document.elementFromPoint(event.clientX, event.clientY)
        const b = target && target.closest('#pad button')
        return b ? b.dataset.dir : null
      }
      let padRepeat = 0
      const fingersNow = () => (screen === 'play' ? mover.fingers : demo.fingers)
      pad.addEventListener('pointerdown', (event) => {
        event.preventDefault()
        const dir = under(event)
        if (screen === 'play' && session && !exploring(live)) {
          if (!dir) return
          session.press(dir)
          clearInterval(padRepeat)
          padRepeat = setInterval(() => session && session.press(dir), 140)
          return
        }
        fingersNow().set(event.pointerId, dir)
      })
      pad.addEventListener('pointermove', (event) => {
        const fingers = fingersNow()
        if (fingers.has(event.pointerId)) fingers.set(event.pointerId, under(event))
      })
      const lift = (event) => {
        clearInterval(padRepeat)
        fingersNow().delete(event.pointerId)
      }
      pad.addEventListener('pointerup', lift)
      pad.addEventListener('pointercancel', lift)
      pad.addEventListener('contextmenu', (event) => event.preventDefault())

      window.runaPage = () => ({
        screen,
        juego: !!juego,
        live,
        term: termShown,
        cols: termCols,
        rows: termRows,
        gait: gaitClip,
        timeScale: gait ? gait.timeScale : 0,
        speed: pace().speed,
        map: world ? world.map : null
      })

      // La lista de modelos se reintenta antes de arrancar: sin ella no aparece
      // ningun modelo de Tripo. El juego baja mientras tanto.
      const gameReady = loadGame()
      for (let i = 0; !(await refreshModels()) && i < 4; i++) {
        await new Promise((resolve) => setTimeout(resolve, 600 * (i + 1)))
      }
      document.documentElement.lang = settings.lang
      if (!DEMO) await checkTerminal()
      // Con la terminal abierta, la pagina la sigue como antes; si no, el menu.
      if (terminalOpen) startMirror()
      else showMenu()
      await gameReady
      if (!DEMO) setInterval(checkTerminal, 1500)
    </script>
  </body>
</html>
