<!doctype html>
<html lang="en" data-demo="1">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runa x Tripo</title>
    <meta name="description" content="Play Runa in your browser: the ASCII RPG with a 3D world. The hero, the helmet, the Colossus and the kingdom are 3D models generated with Tripo." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Runa x Tripo" />
    <meta property="og:description" content="Play Runa in your browser: the ASCII RPG with a 3D world. The hero, the helmet, the Colossus and the kingdom are 3D models generated with Tripo." />
    <link rel="icon" href="data:," />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.min.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0c;
        --fg: #d8d8d0;
        --dim: #7a7a72;
        --accent: #e0c060;
        --line: #3a3a36;
        --panel: rgba(11, 11, 12, 0.84);
        --hp: #c8483a;
        --xp: #5f9fd0;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.5 ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      [hidden] {
        display: none !important;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      /* El recorrido libre y el modo que sigue a la terminal. */
      #hud {
        position: fixed;
        inset: 16px 16px auto 16px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        pointer-events: none;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0.1em;
        color: var(--accent);
      }
      #who {
        color: var(--dim);
      }
      #mode {
        color: var(--accent);
      }
      #keys {
        color: var(--dim);
      }
      #gear {
        display: grid;
        grid-template-columns: auto auto;
        gap: 0 12px;
        margin: 0;
        text-align: right;
      }
      #gear dt {
        color: var(--dim);
      }
      #gear dd {
        margin: 0;
        text-align: left;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100vw - 32px);
        text-align: center;
        color: var(--accent);
        font-size: 16px;
        letter-spacing: 0.05em;
        opacity: 0;
        transition: opacity 0.4s;
        pointer-events: none;
        z-index: 5;
      }
      #toast.show {
        opacity: 1;
      }
      #hud > div:first-child {
        max-width: min(640px, 70vw);
      }
      #places {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
        pointer-events: auto;
      }
      #places button,
      #pad button,
      #actions button {
        color: var(--fg);
        background: rgba(11, 11, 12, 0.72);
        border: 1px solid var(--line);
        padding: 4px 8px;
        cursor: pointer;
      }
      #places button[aria-pressed='true'] {
        color: var(--accent);
        border-color: var(--accent);
      }
      #links {
        position: fixed;
        left: 16px;
        bottom: 12px;
        display: flex;
        gap: 16px;
      }
      #links a,
      .credits a {
        color: var(--accent);
      }
      #pad {
        position: fixed;
        right: 16px;
        bottom: 16px;
        display: grid;
        grid-template-columns: repeat(3, 52px);
        grid-template-rows: repeat(3, 52px);
        gap: 4px;
        touch-action: none;
        z-index: 3;
      }
      #pad button {
        font-size: 20px;
        padding: 0;
      }
      #talk {
        position: fixed;
        left: 50%;
        bottom: 72px;
        transform: translateX(-50%);
        width: min(560px, calc(100vw - 32px));
        background: rgba(11, 11, 12, 0.88);
        border: 1px solid var(--accent);
        padding: 10px 14px;
      }
      #talk strong {
        color: var(--accent);
      }
      #talk p {
        margin: 6px 0 0;
      }
      #talk small,
      #bag small {
        display: block;
        margin-top: 6px;
        color: var(--dim);
      }
      #bag {
        position: fixed;
        right: 16px;
        top: 150px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: min(320px, calc(100vw - 32px));
        background: rgba(11, 11, 12, 0.88);
        border: 1px solid var(--line);
        padding: 10px;
      }
      #bag strong {
        color: var(--accent);
      }
      #bag button {
        text-align: left;
        background: transparent;
        border: 1px solid var(--line);
        padding: 6px 8px;
        cursor: pointer;
      }
      #pad,
      #pad button,
      #actions button {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      /* Menu de titulo: a la izquierda, con el Coloso girando detras. */
      #menu {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: minmax(0, 440px);
        align-content: center;
        padding: 24px clamp(16px, 6vw, 80px);
        background: linear-gradient(
          90deg,
          rgba(8, 8, 9, 0.9) 0%,
          rgba(8, 8, 9, 0.6) 40%,
          rgba(8, 8, 9, 0) 72%
        );
        overflow-y: auto;
      }
      .logo {
        margin: 0;
        font-size: clamp(46px, 9vw, 78px);
        line-height: 1.05;
        letter-spacing: 0.3em;
        color: var(--accent);
        text-shadow: 0 0 28px rgba(224, 192, 96, 0.35);
      }
      .tag {
        margin: 6px 0 26px;
        color: var(--dim);
      }
      .choices,
      .sheet {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .choices button,
      .sheet button,
      .sheet a.button {
        text-align: left;
        background: rgba(11, 11, 12, 0.74);
        border: 1px solid var(--line);
        padding: 9px 14px;
        min-height: 44px;
        cursor: pointer;
        text-decoration: none;
        box-sizing: border-box;
      }
      .choices button:hover,
      .choices button:focus-visible,
      .sheet button:hover,
      .sheet button:focus-visible,
      .sheet a.button:hover,
      .sheet a.button:focus-visible {
        border-color: var(--accent);
        color: var(--accent);
        outline: none;
      }
      .choices button small,
      .sheet button small {
        display: block;
        color: var(--dim);
        font-size: 12px;
      }
      .choices button[disabled],
      .sheet button[disabled] {
        opacity: 0.45;
        cursor: default;
        border-color: var(--line);
        color: var(--fg);
      }
      .sheet h2 {
        margin: 0 0 4px;
        font-size: 15px;
        letter-spacing: 0.08em;
        color: var(--accent);
      }
      .sheet p {
        margin: 0;
        color: var(--dim);
      }
      .sheet label {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .sheet input[type='text'],
      .sheet textarea {
        background: #111;
        border: 1px solid var(--line);
        padding: 8px 10px;
      }
      .sheet input[type='text']:focus,
      .sheet textarea:focus {
        border-color: var(--accent);
        outline: none;
      }
      .sheet textarea {
        min-height: 200px;
        resize: vertical;
        white-space: pre;
        font-size: 13px;
      }
      .pick {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .pick button {
        flex: 1 1 140px;
      }
      .pick button[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .sheet .error {
        color: #e07a6a;
      }
      .sheet dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 14px;
        margin: 0;
      }
      .sheet dt {
        color: var(--accent);
      }
      .sheet dd {
        margin: 0;
      }
      .credits {
        margin: 26px 0 0;
        color: var(--dim);
        font-size: 12px;
      }

      /* Jugando: la ficha, el registro del juego y lo que hace la tecla E. */
      #play {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #stats {
        position: absolute;
        left: 16px;
        top: 16px;
        width: min(290px, calc(100vw - 32px));
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 10px 12px;
        box-sizing: border-box;
      }
      #stats .who {
        color: var(--accent);
      }
      #stats .where {
        color: var(--dim);
        font-size: 12px;
        margin-bottom: 4px;
      }
      .bar {
        position: relative;
        height: 14px;
        margin-top: 4px;
        background: #1a1a1c;
        border: 1px solid var(--line);
      }
      .bar i {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--hp);
        transition: width 0.25s;
      }
      .bar.xp i {
        background: var(--xp);
      }
      .bar span {
        position: relative;
        display: block;
        padding-left: 6px;
        font-size: 11px;
        line-height: 14px;
      }
      #stats .purse,
      #stats .worn {
        margin-top: 6px;
        font-size: 12px;
        color: var(--dim);
      }
      #stats .worn b {
        font-weight: normal;
        color: var(--fg);
      }
      #bossbar {
        position: absolute;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        width: min(520px, calc(100vw - 340px));
        text-align: center;
        color: #ffb070;
        text-shadow: 0 1px 3px #000;
      }
      #bossbar .bar i {
        background: #ff6a20;
      }
      #gait {
        position: absolute;
        right: 16px;
        top: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 4px 10px;
        font-size: 12px;
        color: var(--dim);
      }
      #gait b {
        color: var(--accent);
        font-weight: normal;
      }
      #log {
        position: absolute;
        left: 16px;
        bottom: 16px;
        margin: 0;
        padding: 0;
        list-style: none;
        width: min(640px, calc(100vw - 32px));
      }
      #log li {
        width: fit-content;
        max-width: 100%;
        margin-top: 4px;
        padding: 3px 8px;
        background: var(--panel);
        animation: arrive 0.25s ease-out;
      }
      #log li.old {
        opacity: 0.55;
      }
      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      #hint {
        position: absolute;
        left: 50%;
        bottom: 150px;
        transform: translateX(-50%);
        padding: 4px 12px;
        color: var(--accent);
        background: var(--panel);
        border: 1px solid var(--accent);
        white-space: nowrap;
      }
      #hint:empty {
        display: none;
      }
      #actions {
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: grid;
        grid-template-columns: repeat(3, 56px);
        gap: 6px;
        pointer-events: auto;
        z-index: 3;
      }
      #actions button {
        height: 48px;
        padding: 0;
        font-size: 13px;
      }
      #actions button[aria-pressed='true'] {
        color: var(--accent);
        border-color: var(--accent);
      }

      /* La pantalla de texto del juego, cuando el mapa 3D no alcanza. */
      #term {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(1240px, calc(100vw - 24px));
        height: min(820px, calc(100vh - 24px));
        box-sizing: border-box;
        margin: 0;
        padding: 10px 12px;
        overflow: hidden;
        white-space: pre;
        font-size: 14px;
        line-height: 1.2;
        background: rgba(8, 8, 9, 0.97);
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
        z-index: 2;
      }
      #term .b {
        font-weight: 700;
      }
      #term .d {
        opacity: 0.6;
      }
      #term .u {
        text-decoration: underline;
      }
      #term .v {
        background: var(--fg);
        color: var(--bg);
      }
      #term .fk {
        color: #4a4a46;
      }
      #term .fr {
        color: #e07a6a;
      }
      #term .fg {
        color: #7fd36f;
      }
      #term .fy {
        color: #e8c860;
      }
      #term .fb {
        color: #7a9be0;
      }
      #term .fm {
        color: #d97fd9;
      }
      #term .fc {
        color: #6fd3e0;
      }
      #term .fw {
        color: #f0f0e8;
      }
      #term .fhk {
        color: #8a8a82;
      }
      #term .fhr {
        color: #ff9a8a;
      }
      #term .fhg {
        color: #a8f098;
      }
      #term .fhy {
        color: #fff08a;
      }
      #term .fhb {
        color: #a8c0ff;
      }
      #term .fhm {
        color: #ffa8ff;
      }
      #term .fhc {
        color: #a0f0ff;
      }
      #term .fhw {
        color: #ffffff;
      }

      /* El menu dentro de la partida. */
      #pause {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(5, 5, 6, 0.6);
        z-index: 4;
      }
      #pause .sheet {
        width: min(460px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 18px;
        background: rgba(11, 11, 12, 0.95);
        border: 1px solid var(--line);
      }

      /* En pantallas tactiles: el texto con fondo y corto, los lugares en una
         fila que se desliza, y la cruceta y los botones a mano. */
      @media (pointer: coarse) {
        #hud > div:first-child,
        #gear {
          background: rgba(11, 11, 12, 0.6);
          padding: 6px 8px;
        }
        #who {
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }
        #places {
          flex-wrap: nowrap;
          overflow-x: auto;
        }
        #places button {
          min-height: 44px;
          white-space: nowrap;
        }
        #links {
          flex-direction: column;
          gap: 8px;
          max-width: calc(100vw - 216px);
        }
        #links a {
          padding: 6px 0;
        }
        #toast,
        #talk {
          bottom: 200px;
        }
        #bag {
          top: auto;
          bottom: 200px;
        }
        #log {
          bottom: 190px;
        }
        /* La ayuda de la tecla E arriba, debajo de la ficha: abajo esta el
           registro. El paso se ve en el boton Run. */
        #hint {
          top: 196px;
          bottom: auto;
        }
        #gait {
          display: none;
        }
        #term {
          height: calc(100vh - 196px);
          top: 8px;
          transform: translateX(-50%);
        }
      }
      @media (pointer: fine) {
        #actions {
          display: none;
        }
      }
      @media (max-width: 640px) {
        /* En pantallas angostas la barra del Coloso va debajo de la ficha. */
        #bossbar {
          top: 150px;
          width: calc(100vw - 32px);
        }
        #gait {
          top: auto;
          bottom: 248px;
        }
        #hint {
          top: 196px;
          bottom: auto;
        }
        #stats {
          width: min(240px, calc(100vw - 32px));
          padding: 6px 8px;
        }
        #stats .worn {
          display: none;
        }
      }
      /* Celular acostado: sin los textos largos, para no tapar al heroe. */
      @media (max-height: 500px) {
        #who,
        #keys,
        #stats .worn,
        #stats .purse {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header id="hud" hidden>
      <div>
        <h1>[ RUNA ]</h1>
        <div id="who">loading the 3D world...</div>
        <div id="mode"></div>
        <div id="keys"></div>
        <nav id="places" hidden></nav>
      </div>
      <dl id="gear"></dl>
    </header>
    <div id="toast"></div>
    <div id="talk" hidden></div>
    <aside id="bag" hidden></aside>
    <footer id="links" hidden>
      <a href="models.html">The Tripo models</a>
      <a href="https://github.com/Bitcoindefi/runa">Source and the terminal game</a>
    </footer>

    <section id="menu" hidden>
      <div>
        <h1 class="logo">RUNA</h1>
        <p class="tag" id="tagline">An ASCII RPG with a 3D world made with Tripo.</p>
      </div>
      <nav id="menu-main" class="choices"></nav>
      <div id="menu-page" class="sheet" hidden></div>
      <p class="credits" id="credits"></p>
    </section>

    <div id="play" hidden>
      <div id="stats"></div>
      <div id="bossbar" hidden></div>
      <div id="gait"></div>
      <ol id="log"></ol>
      <div id="hint"></div>
    </div>
    <div id="actions" hidden></div>
    <pre id="term" hidden></pre>
    <div id="pause" hidden><div class="sheet"></div></div>

    <div id="pad" hidden>
      <span></span>
      <button data-dir="up" aria-label="up">&#9650;</button>
      <span></span>
      <button data-dir="left" aria-label="left">&#9664;</button>
      <span></span>
      <button data-dir="right" aria-label="right">&#9654;</button>
      <span></span>
      <button data-dir="down" aria-label="down">&#9660;</button>
      <span></span>
    </div>
    <script type="module">
      import * as THREE from 'three'
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
      import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js'
      import { buildWorld, CX, CZ } from './mundo.js'

      // Runa en 2.5D. Desde el menu de titulo se elige como estar en el mundo:
      //  - Jugar: el juego de la terminal corre entero en esta pagina (juego.js es
      //    lib/ empaquetado con scripts/build-juego.js). La pagina le manda teclas,
      //    dibuja en 3D lo que el juego dice y muestra su pantalla de texto cuando
      //    el mapa 3D no alcanza: inventario, tiendas, la pradera, el combate.
      //  - Recorrer: el mundo 3D sin reglas, para mirar los modelos de Tripo.
      //  - Seguir la terminal: con el juego abierto con --teclas (solo en el visor
      //    local), la pagina lo sigue y le manda teclas.

      const SLOTS = ['left_hand', 'right_hand', 'chest', 'head', 'boots']
      // Items con modelo de Tripo. Un GLB llamado como el id del item
      // (assets/tripo/spear.glb) se usa solo; aca van los alias y sus ajustes.
      const SKINS = {
        // Tripo entrega los modelos mirando hacia +x; el heroe mira hacia +z.
        iron_helmet: { file: 'yelmo.glb', size: 0.46, yaw: -Math.PI / 2, lift: 0.03 }
      }
      const HERO_FIT = { grow: 1.15, lift: 0.03, back: 0 }
      // Fondos por zona, con modelos de Tripo que ya existen. El del titulo es el
      // Coloso grande detras del heroe, como el menu de la terminal.
      const SCENERY = {
        titulo: { file: 'coloso.glb', size: 6.4, at: [0.4, 0, -5.2], yaw: 0.2 },
        ruinas: { file: 'coloso.glb', size: 3.4, at: [-3, 0, -9], yaw: 0.32 },
        reino: { file: 'paisaje.glb', size: 2.6, at: [0, 0, -6], yaw: 0 }
      }
      const GROUND = {
        titulo: 0x1c0e08,
        reino: 0x16140f,
        pradera: 0x101a10,
        ruinas: 0x1c0e08,
        cripta: 0x0d0d13
      }

      // Opciones de quien juega, en este navegador.
      const SETTINGS = 'runa:web:settings'
      const settings = { lang: 'en', run: true, camera: 'far', shadows: true }
      try {
        Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS) || '{}'))
      } catch {
        // Sin almacenamiento: quedan las de siempre.
      }
      function keepSettings() {
        try {
          localStorage.setItem(SETTINGS, JSON.stringify(settings))
        } catch {
          // Igual se aplican mientras dure la pestana.
        }
      }
      const L = (en, es) => (settings.lang === 'es' ? es : en)
      const pick = (pair) => pair[settings.lang === 'es' ? 1 : 0]

      const who = document.getElementById('who')
      const mode = document.getElementById('mode')
      const gear = document.getElementById('gear')
      const toast = document.getElementById('toast')
      // El sitio publicado (scripts/build-web.js) no tiene visor: no hay
      // terminal que seguir ni partidas de la terminal para copiar.
      const DEMO =
        document.documentElement.dataset.demo === '1' ||
        new URLSearchParams(location.search).has('demo')
      const touchPad = matchMedia('(pointer: coarse)').matches

      // Escena. Sin WebGL no hay nada que dibujar: se avisa en vez de quedar mudo.
      let renderer
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true })
      } catch (error) {
        document.getElementById('hud').hidden = false
        who.textContent = L(
          'This 3D page needs WebGL, and this browser has it turned off.',
          'Este navegador no tiene WebGL: la pagina 3D no puede dibujar.'
        )
        throw error
      }
      // Con 1,5 alcanza para que se vea nitido y no se trabe en pantallas densas.
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5))
      renderer.shadowMap.enabled = settings.shadows
      document.body.prepend(renderer.domElement)
      // Para medir desde la consola cuanto cuesta cada cuadro.
      window.runaInfo = () => ({
        ...renderer.info.render,
        geometries: renderer.info.memory.geometries
      })

      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x0b0b0c)
      scene.fog = new THREE.Fog(0x0b0b0c, 11, 30)
      // Un cuarto neutro para que el metal y los PBR de Tripo tengan que reflejar.
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(
        new RoomEnvironment(),
        0.04
      ).texture
      scene.environmentIntensity = 0.45

      const camera = new THREE.PerspectiveCamera(
        38,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      )
      camera.position.set(0, 1.55, 4.8)
      const controls = new OrbitControls(camera, renderer.domElement)
      controls.target.set(0, 1, 0)
      controls.enableDamping = true
      controls.enablePan = false
      controls.autoRotate = true
      controls.autoRotateSpeed = 0.9
      controls.minDistance = 2.4
      controls.maxDistance = 11
      controls.maxPolarAngle = Math.PI * 0.49
      // Para probar la pagina en un navegador real.
      window.runaView = {
        camera,
        controls,
        // Ajuste en vivo de la pieza de cabeza del heroe, para calibrar `fits`.
        tune(id, values) {
          AVATAR.fits[id] = { ...HERO_FIT, ...AVATAR.fits[id], ...values }
          if (worn.head === id) return refitHead(id)
        },
        head: () => avatarHead.getWorldPosition(new THREE.Vector3()).project(camera)
      }

      const sky = new THREE.HemisphereLight(0xd8d8d0, 0x1a1408, 1.3)
      scene.add(sky)
      const sun = new THREE.DirectionalLight(0xfff1d6, 2.4)
      sun.position.set(3, 6, 4)
      sun.castShadow = true
      sun.shadow.mapSize.set(1024, 1024)
      scene.add(sun)
      const ember = new THREE.PointLight(0xe0c060, 5, 9)
      ember.position.set(-2, 2.2, -1.5)
      scene.add(ember)

      const groundMat = new THREE.MeshStandardMaterial({ color: GROUND.reino, roughness: 1 })
      const ground = new THREE.Mesh(new THREE.CircleGeometry(9, 64), groundMat)
      ground.rotation.x = -Math.PI / 2
      ground.receiveShadow = true
      scene.add(ground)
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0xe0c060,
        transparent: true,
        opacity: 0.5
      })
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.62, 0.66, 64), ringMat)
      ring.rotation.x = -Math.PI / 2
      ring.position.y = 0.003
      scene.add(ring)

      // Materiales
      const chalk = new THREE.MeshStandardMaterial({ color: 0xd8d8d0, roughness: 0.65 })
      const metal = (color = 0xb8bec8) =>
        new THREE.MeshStandardMaterial({ color, metalness: 0.85, roughness: 0.3 })
      const wood = () => new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.8 })
      const hide = () => new THREE.MeshStandardMaterial({ color: 0x7a4a26, roughness: 0.9 })
      const rune = () =>
        new THREE.MeshStandardMaterial({
          color: 0xe0c060,
          emissive: 0xe0a030,
          emissiveIntensity: 0.7
        })

      function part(geometry, material, x = 0, y = 0, z = 0) {
        const mesh = new THREE.Mesh(geometry, material)
        mesh.position.set(x, y, z)
        mesh.castShadow = true
        return mesh
      }

      // Un hueso que cuelga hacia abajo desde su pivote.
      function bone(length, radius, skin = chalk) {
        const pivot = new THREE.Group()
        pivot.add(part(new THREE.CapsuleGeometry(radius, length, 6, 12), skin, 0, -length / 2))
        const end = new THREE.Group()
        end.position.y = -length - radius
        pivot.add(end)
        return { pivot, end }
      }

      // El stickman: +y arriba y la cara hacia +z. Su izquierda queda en +x.
      function stickman(skin = chalk) {
        const root = new THREE.Group()
        const hips = new THREE.Group()
        hips.position.y = 0.95
        root.add(hips)
        const torso = part(new THREE.CapsuleGeometry(0.15, 0.4, 8, 16), skin, 0, 0.32)
        hips.add(torso)
        const head = part(new THREE.SphereGeometry(0.16, 24, 16), skin, 0, 0.86)
        hips.add(head)
        const headSocket = new THREE.Group()
        headSocket.position.y = 0.86
        hips.add(headSocket)

        const arms = {}
        for (const [slot, side] of [
          ['left_hand', 1],
          ['right_hand', -1]
        ]) {
          const upper = bone(0.27, 0.05, skin)
          upper.pivot.position.set(0.23 * side, 0.56, 0)
          upper.pivot.rotation.z = 0.18 * side
          hips.add(upper.pivot)
          const lower = bone(0.25, 0.045, skin)
          // El antebrazo apunta hacia adelante, como en guardia.
          lower.pivot.rotation.x = -1.15
          upper.end.add(lower.pivot)
          lower.end.add(part(new THREE.SphereGeometry(0.055, 16, 12), skin))
          // El enchufe deshace la pose del brazo: lo que se cuelga ahi queda con
          // +y hacia arriba y +z hacia adelante.
          const socket = new THREE.Group()
          socket.rotation.set(1.15, 0, -0.18 * side)
          lower.end.add(socket)
          arms[slot] = { shoulder: upper.pivot, socket }
        }

        const feet = []
        const legs = []
        for (const side of [1, -1]) {
          const thigh = bone(0.4, 0.06, skin)
          thigh.pivot.position.set(0.1 * side, 0.02, 0)
          hips.add(thigh.pivot)
          legs.push(thigh.pivot)
          const shin = bone(0.38, 0.05, skin)
          thigh.end.add(shin.pivot)
          // El tobillo queda a 8 cm del suelo: el pie baja 5 para apoyarse.
          const foot = new THREE.Group()
          foot.position.y = -0.05
          shin.end.add(foot)
          foot.add(part(new THREE.BoxGeometry(0.1, 0.06, 0.18), skin, 0, 0, 0.04))
          feet.push(foot)
        }
        return { root, hips, torso, headSocket, arms, feet, legs }
      }

      // Los NPC del mapa sin dibujo propio: una figura del color que usa la terminal.
      const TERMINAL = {
        cyan: 0x6fd3e0,
        green: 0x7fd36f,
        yellow: 0xe8d36f,
        magenta: 0xd97fd9,
        red: 0xe07a6a,
        blue: 0x7a9be0,
        white: 0xd8d8d0,
        gray: 0x9a9a92
      }
      // Una figura liviana: tres mallas que comparten geometria y material, sin
      // sombra. En la ciudad hay 17 NPC y tienen que costar poco.
      const NPC = {
        body: new THREE.CapsuleGeometry(0.17, 0.62, 2, 6),
        head: new THREE.SphereGeometry(0.16, 8, 6),
        legs: new THREE.BoxGeometry(0.26, 0.8, 0.12)
      }
      const npcSkins = {}
      function figure(color) {
        if (!npcSkins[color]) {
          npcSkins[color] = new THREE.MeshStandardMaterial({
            color: TERMINAL[color] || 0xbdb8aa,
            roughness: 0.7
          })
        }
        const skin = npcSkins[color]
        const body = new THREE.Group()
        const torso = new THREE.Mesh(NPC.body, skin)
        torso.position.y = 1.25
        const head = new THREE.Mesh(NPC.head, skin)
        head.position.y = 1.86
        const legs = new THREE.Mesh(NPC.legs, skin)
        legs.position.y = 0.4
        body.add(torso, head, legs)
        // Comparte geometria y material con los demas NPC: el mapa no los libera.
        body.userData.shared = true
        return body
      }

      // Armas y piezas con formas simples, en el marco del enchufe.
      function blade(length, width, guard) {
        const g = new THREE.Group()
        g.add(part(new THREE.CylinderGeometry(0.022, 0.022, 0.15, 8), hide()))
        g.add(part(new THREE.BoxGeometry(guard, 0.03, 0.05), metal(0x8a6d2c), 0, 0.09))
        g.add(part(new THREE.BoxGeometry(width, length, 0.014), metal(), 0, 0.1 + length / 2))
        g.add(
          part(
            new THREE.ConeGeometry(width * 0.72, width * 1.8, 4),
            metal(),
            0,
            0.1 + length + width * 0.9
          )
        )
        return g
      }

      function spear() {
        const g = new THREE.Group()
        g.add(part(new THREE.CylinderGeometry(0.02, 0.02, 1.9, 8), wood(), 0, 0.35))
        g.add(part(new THREE.ConeGeometry(0.05, 0.22, 6), metal(), 0, 1.41))
        g.add(part(new THREE.TorusGeometry(0.03, 0.01, 6, 16), rune(), 0, 1.28))
        return g
      }

      function hammer() {
        const g = new THREE.Group()
        g.add(part(new THREE.CylinderGeometry(0.025, 0.025, 0.8, 8), wood(), 0, 0.22))
        g.add(part(new THREE.BoxGeometry(0.32, 0.16, 0.16), metal(0x8d939b), 0, 0.66))
        g.add(part(new THREE.BoxGeometry(0.33, 0.03, 0.17), rune(), 0, 0.66))
        return g
      }

      function curve(points, radius, material) {
        const path = new THREE.CatmullRomCurve3(
          points.map(([x, y, z]) => new THREE.Vector3(x, y, z))
        )
        return part(new THREE.TubeGeometry(path, 32, radius, 6), material)
      }

      function string(a, b) {
        const geometry = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(...a),
          new THREE.Vector3(...b)
        ])
        return new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: 0xd8d8d0 }))
      }

      function longbow() {
        const g = new THREE.Group()
        // La curva abre hacia afuera (+x), para que de frente se lea como arco.
        const arc = [
          [-0.16, -0.7, 0],
          [0.02, -0.35, 0],
          [0.06, 0, 0],
          [0.02, 0.35, 0],
          [-0.16, 0.7, 0]
        ]
        g.add(curve(arc, 0.018, wood()))
        g.add(string([-0.16, -0.7, 0], [-0.16, 0.7, 0]))
        return g
      }

      function crossbow() {
        const g = new THREE.Group()
        g.add(part(new THREE.BoxGeometry(0.06, 0.07, 0.62), wood(), 0, 0.02, 0.18))
        g.add(
          curve(
            [
              [-0.32, 0.04, 0.38],
              [0, 0.04, 0.5],
              [0.32, 0.04, 0.38]
            ],
            0.016,
            metal()
          )
        )
        g.add(string([-0.32, 0.04, 0.38], [0.32, 0.04, 0.38]))
        return g
      }

      function shield() {
        const g = new THREE.Group()
        const face = part(new THREE.CylinderGeometry(0.3, 0.3, 0.04, 32), wood(), 0, 0.05, 0.07)
        face.rotation.x = Math.PI / 2
        g.add(face)
        const rim = part(new THREE.TorusGeometry(0.3, 0.02, 8, 32), metal(), 0, 0.05, 0.07)
        g.add(rim)
        g.add(part(new THREE.SphereGeometry(0.06, 16, 12), metal(), 0, 0.05, 0.1))
        g.add(part(new THREE.TorusGeometry(0.16, 0.008, 6, 32), rune(), 0, 0.05, 0.095))
        return g
      }

      function cap() {
        const g = new THREE.Group()
        g.add(
          part(
            new THREE.SphereGeometry(0.175, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2),
            hide(),
            0,
            0.01
          )
        )
        return g
      }

      function helmet() {
        const g = new THREE.Group()
        g.add(
          part(
            new THREE.SphereGeometry(0.185, 24, 12, 0, Math.PI * 2, 0, Math.PI / 1.8),
            metal(),
            0,
            0
          )
        )
        g.add(part(new THREE.BoxGeometry(0.03, 0.14, 0.03), metal(), 0, -0.03, 0.18))
        g.add(part(new THREE.SphereGeometry(0.02, 8, 8), rune(), 0, 0.09, 0.16))
        return g
      }

      const BUILD = {
        dagger: () => blade(0.26, 0.04, 0.1),
        sword: () => blade(0.72, 0.05, 0.2),
        spear,
        warhammer: hammer,
        longbow,
        crossbow,
        shield,
        leather_cap: cap,
        iron_helmet: helmet
      }

      // Lo que va sobre el cuerpo: el pecho y las botas se visten, no se cuelgan.
      const ARMOR = {
        leather: () => new THREE.MeshStandardMaterial({ color: 0x7a4a26, roughness: 0.9 }),
        chainmail: () =>
          new THREE.MeshStandardMaterial({ color: 0x8a8f96, metalness: 0.7, roughness: 0.55 }),
        plate: () => metal(0xc8ccd2)
      }

      const hero = stickman()
      scene.add(hero.root)

      // En el mundo camina el heroe de Tripo; el stickman con el equipo cambiable
      // queda para la vitrina. heroe-anim.glb es el heroe rehecho en pose A con
      // Tripo H3.1 desde Higgsfield, con el esqueleto y los clips Idle, Walk y Run
      // que le puso Higgsfield, y ya mira hacia +z. Si no esta, camina heroe.glb,
      // el original: sin esqueleto, mirando hacia +x y con un balanceo al caminar.
      // `fits` ajusta cada pieza de cabeza a ese heroe: cuanto la envuelve, cuanto
      // sube su techo sobre la coronilla y cuanto se corre hacia la nuca.
      const AVATARS = [
        {
          file: 'heroe-anim.glb',
          height: 2.1,
          yaw: 0,
          rigged: true,
          // Calibrado con runaView.tune en Chrome, como el del heroe original.
          fits: { iron_helmet: { grow: 1.5, lift: 0.24, back: 0.1 } }
        },
        {
          file: 'heroe.glb',
          height: 2.1,
          yaw: -Math.PI / 2,
          rigged: false,
          // Calibrado con runaView.tune en Chrome: asi envuelve la cabeza cuadrada
          // del heroe, la cara se ve por la abertura y no asoma la vincha.
          fits: { iron_helmet: { grow: 1.55, lift: 0.22, back: 0.12 } }
        }
      ]
      let AVATAR = AVATARS[AVATARS.length - 1]
      // Los pasos, en m/s. `pace` es la velocidad de suelo a la que el clip no
      // patina con el heroe de 2,1 m, medida en sus huesos: el pie apoyado de Walk
      // retrocede a 0,6 m/s y el de Run (Run_02) a 3,4 m/s. `most` limita cuanto
      // se acelera el clip: mas rapido parece una pelicula adelantada, asi que de
      // ahi en adelante el pie desliza un poco. Correr es lo de siempre; Shift
      // esprinta, o corre si se eligio caminar.
      const GAITS = {
        walk: { speed: 1.6, clip: 'Walk', pace: 0.6, most: 2.2 },
        run: { speed: 7, clip: 'Run', pace: 3.4, most: 1.9 },
        sprint: { speed: 9, clip: 'Run', pace: 3.4, most: 2.25 }
      }
      let shiftHeld = false
      function gaitName() {
        if (shiftHeld) return settings.run ? 'sprint' : 'run'
        return settings.run ? 'run' : 'walk'
      }
      const pace = () => GAITS[gaitName()]
      const avatar = new THREE.Group()
      avatar.visible = false
      hero.root.add(avatar)
      // Lo que va en la cabeza tambien lo lleva el heroe de Tripo.
      const avatarHead = new THREE.Group()
      avatar.add(avatarHead)
      const headSize = { width: 0.42, depth: 0.42 }
      let avatarBody = null
      let avatarLoading = null
      const avatarFailed = new Set()
      let mixer = null
      const gaits = {}
      let gait = null
      let gaitClip = ''
      function loadAvatar() {
        if (avatarBody || avatarLoading) return avatarLoading || Promise.resolve()
        const chosen = AVATARS.find(
          (entry) => models.has(entry.file) && !avatarFailed.has(entry.file)
        )
        if (!chosen) return Promise.resolve()
        avatarLoading = loadRig(chosen.file)
          .then(({ object, clips }) => {
            AVATAR = chosen
            object.rotation.y = chosen.yaw
            object.updateMatrixWorld(true)
            const box = new THREE.Box3().setFromObject(object)
            object.scale.multiplyScalar(chosen.height / box.getSize(new THREE.Vector3()).y)
            object.updateMatrixWorld(true)
            const placed = new THREE.Box3().setFromObject(object)
            const mid = placed.getCenter(new THREE.Vector3())
            object.position.x -= mid.x
            object.position.z -= mid.z
            object.position.y -= placed.min.y
            object.traverse((child) => {
              if (child.isMesh) {
                child.castShadow = true
                // El cuadro de un SkinnedMesh es el de la pose de reposo: al caminar
                // los brazos salen de ahi y el recorte lo haria desaparecer.
                if (child.isSkinnedMesh) child.frustumCulled = false
              }
            })
            avatar.add(object)
            avatarBody = object
            // La cabeza se mide en la pose de reposo, antes de animar, y el yelmo se
            // engancha al hueso Head para seguir la animacion.
            findHead(object)
            if (chosen.rigged) {
              const head = object.getObjectByName('Head')
              if (head) head.attach(avatarHead)
              mixer = new THREE.AnimationMixer(object)
              for (const name of ['Idle', 'Walk', 'Run']) {
                const clip = THREE.AnimationClip.findByName(clips, name)
                if (clip) gaits[name] = mixer.clipAction(clip)
              }
              setGait('Idle', 1)
            }
            // Lo que ya llevaba en la cabeza se vuelve a medir con su cabeza.
            if (worn.head) refitHead(worn.head)
          })
          .catch((error) => {
            console.warn('sin el heroe de Tripo', chosen.file, error)
            avatarFailed.add(chosen.file)
            avatarLoading = null
          })
        return avatarLoading
      }
      function useAvatar(on) {
        const ready = on && !!avatarBody
        avatar.visible = ready
        hero.hips.visible = !ready
      }
      // Cambia de clip con un fundido corto y acompana la velocidad sin saltos.
      // Sin Run (un heroe-anim.glb viejo) corre con Walk acelerado.
      function setGait(name, scale) {
        let clip = name
        if (!gaits[clip] && clip === 'Run') {
          clip = 'Walk'
          scale = Math.min(3, scale * 2.4)
        }
        const next = gaits[clip]
        if (!next) return
        if (next === gait) {
          next.timeScale += (scale - next.timeScale) * 0.2
          return
        }
        next.reset()
        next.timeScale = scale
        next.fadeIn(gait ? 0.18 : 0).play()
        if (gait) gait.fadeOut(0.18)
        gait = next
        gaitClip = clip
      }

      // La cabeza del heroe de Tripo se mide en la malla: la tapa es lo que queda
      // en el 8% mas alto del cuerpo (el heroe no levanta nada por encima). Con
      // esqueleto se miden los vertices ya deformados por los huesos.
      function findHead(object) {
        avatar.updateMatrixWorld(true)
        const inverse = new THREE.Matrix4().copy(avatar.matrixWorld).invert()
        const toAvatar = new THREE.Matrix4()
        const v = new THREE.Vector3()
        const each = (visit) =>
          object.traverse((child) => {
            if (!child.isMesh) return
            toAvatar.multiplyMatrices(inverse, child.matrixWorld)
            const position = child.geometry.attributes.position
            for (let i = 0; i < position.count; i++) {
              v.fromBufferAttribute(position, i)
              if (child.isSkinnedMesh) child.applyBoneTransform(i, v)
              visit(v.applyMatrix4(toAvatar))
            }
          })
        let top = -Infinity
        each((point) => {
          top = Math.max(top, point.y)
        })
        const box = new THREE.Box3()
        each((point) => {
          if (point.y > top - AVATAR.height * 0.08) box.expandByPoint(point)
        })
        if (box.isEmpty()) return
        const size = box.getSize(new THREE.Vector3())
        headSize.width = size.x
        headSize.depth = size.z
        avatarHead.position.set((box.min.x + box.max.x) / 2, top, (box.min.z + box.max.z) / 2)
        window.runaHead = () => ({ ...avatarHead.position, ...headSize })
      }

      // La pieza para la cabeza del heroe de Tripo envuelve su cabeza. Va dentro
      // de un grupo para que el pop de equipar no le pise la escala.
      async function avatarPiece(id) {
        let object = null
        try {
          object = await tripoPiece(id, 'head', 1)
        } catch (error) {
          console.warn('sin modelo de Tripo para', id, error)
        }
        if (!object && BUILD[id]) object = BUILD[id]()
        if (!object) return null
        const tune = (AVATAR.fits && AVATAR.fits[id]) || HERO_FIT
        object.updateMatrixWorld(true)
        const dims = new THREE.Box3().setFromObject(object).getSize(new THREE.Vector3())
        object.scale.multiplyScalar(
          tune.grow * Math.max(headSize.width / dims.x, headSize.depth / dims.z)
        )
        object.updateMatrixWorld(true)
        const box = new THREE.Box3().setFromObject(object)
        const center = box.getCenter(new THREE.Vector3())
        object.position.x -= center.x
        object.position.z -= center.z + tune.back
        object.position.y += tune.lift - box.max.y
        const holder = new THREE.Group()
        holder.add(object)
        return holder
      }

      // Rearma solo la pieza del heroe de Tripo. Lleva su propio turno: asi el
      // heroe que termina de cargar no le corta el aviso a un equipar en curso.
      let headTicket = 0
      async function refitHead(id) {
        const ticket = ++headTicket
        const fitted = id ? await avatarPiece(id) : null
        if (ticket !== headTicket) return null
        avatarHead.clear()
        if (fitted) avatarHead.add(fitted)
        return fitted
      }

      // Cielo de atardecer para el mundo; la vitrina y el titulo siguen en negro.
      const skyCanvas = document.createElement('canvas')
      skyCanvas.width = 2
      skyCanvas.height = 256
      const skyPaint = skyCanvas.getContext('2d')
      const skyGradient = skyPaint.createLinearGradient(0, 0, 0, 256)
      skyGradient.addColorStop(0, '#0e1626')
      skyGradient.addColorStop(0.6, '#2b3b52')
      skyGradient.addColorStop(1, '#55606c')
      skyPaint.fillStyle = skyGradient
      skyPaint.fillRect(0, 0, 2, 256)
      const skyTexture = new THREE.CanvasTexture(skyCanvas)
      skyTexture.colorSpace = THREE.SRGBColorSpace
      const night = new THREE.Color(0x0b0b0c)

      let chestLayer = null
      function dressChest(id) {
        if (chestLayer) hero.hips.remove(chestLayer)
        chestLayer = null
        if (!id) return
        const material = (ARMOR[id] || ARMOR.leather)()
        chestLayer = new THREE.Group()
        chestLayer.add(part(new THREE.CapsuleGeometry(0.168, 0.4, 8, 16), material, 0, 0.32))
        if (id === 'plate') {
          for (const side of [1, -1]) {
            chestLayer.add(
              part(new THREE.SphereGeometry(0.085, 16, 12), material, 0.21 * side, 0.6)
            )
          }
        }
        hero.hips.add(chestLayer)
        return chestLayer
      }

      let bootLayers = []
      function dressBoots(id) {
        for (const layer of bootLayers) layer.parent.remove(layer)
        bootLayers = []
        if (!id) return
        for (const foot of hero.feet) {
          const boot = part(new THREE.BoxGeometry(0.12, 0.16, 0.21), hide(), 0, 0.05, 0.04)
          foot.add(boot)
          bootLayers.push(boot)
        }
        return bootLayers
      }

      // Modelos de Tripo
      const loader = new GLTFLoader()
      const loaded = new Map()
      let models = new Map()

      // Medido en Chrome recien abierto: el primer pedido puede fallar con "Failed
      // to fetch". Cada pedido se reintenta dos veces antes de rendirse; una
      // respuesta 4xx no se reintenta, porque no va a cambiar.
      const statusOf = (error) => error.status || (error.response && error.response.status) || 0
      async function retry(task, times = 3) {
        let failure
        for (let i = 0; i < times; i++) {
          if (i) await new Promise((resolve) => setTimeout(resolve, 500 * i))
          try {
            return await task()
          } catch (error) {
            failure = error
            if (statusOf(error) >= 400 && statusOf(error) < 500) break
          }
        }
        throw failure
      }
      function httpError(what, response) {
        const error = new Error(what + ' respondio ' + response.status)
        error.status = response.status
        return error
      }

      function loadGltf(file) {
        const key = file + ':' + models.get(file)
        if (!loaded.has(key)) {
          const url = 'assets/tripo/' + encodeURIComponent(file) + '?v=' + models.get(file)
          loaded.set(
            key,
            retry(() => loader.loadAsync(url)).catch((error) => {
              loaded.delete(key)
              throw error
            })
          )
        }
        return loaded.get(key)
      }
      function loadGlb(file) {
        return loadGltf(file).then((gltf) => gltf.scene.clone(true))
      }
      // Un GLB con esqueleto se clona con SkeletonUtils: el clone comun deja la
      // malla atada a los huesos del original.
      function loadRig(file) {
        return loadGltf(file).then((gltf) => ({
          object: SkeletonUtils.clone(gltf.scene),
          clips: gltf.animations
        }))
      }

      // Lleva un GLB al tamano pedido. Las armas se paran sobre su eje mas largo y
      // se agarran a un tercio de la base; el resto queda centrado.
      function fit(object, size, slot) {
        object.updateMatrixWorld(true)
        const box = new THREE.Box3().setFromObject(object)
        const dims = box.getSize(new THREE.Vector3())
        const weapon = slot === 'left_hand'
        if (weapon && dims.x > dims.y && dims.x >= dims.z) object.rotation.z = Math.PI / 2
        if (weapon && dims.z > dims.y && dims.z > dims.x) object.rotation.x = Math.PI / 2
        object.updateMatrixWorld(true)
        const turned = new THREE.Box3().setFromObject(object)
        const longest = Math.max(...turned.getSize(new THREE.Vector3()).toArray())
        const holder = new THREE.Group()
        holder.add(object)
        object.scale.multiplyScalar(size / longest)
        object.updateMatrixWorld(true)
        const final = new THREE.Box3().setFromObject(object)
        const center = final.getCenter(new THREE.Vector3())
        object.position.sub(center)
        if (weapon) object.position.y += (final.max.y - final.min.y) * 0.2
        object.traverse((child) => {
          if (child.isMesh) child.castShadow = true
        })
        return holder
      }

      async function tripoPiece(id, slot, size) {
        const spec = SKINS[id] || { file: id + '.glb' }
        if (!models.has(spec.file)) return null
        const fitted =
          size || spec.size || { left_hand: 1, right_hand: 0.62, head: 0.46 }[slot] || 0.5
        const piece = fit(await loadGlb(spec.file), fitted, slot)
        piece.rotation.y = spec.yaw || 0
        piece.position.y += spec.lift || 0
        return piece
      }

      // Equipar
      const worn = {}
      const tokens = {}
      const pops = []

      function pop(shown) {
        for (const object of [shown].flat()) {
          if (!object) continue
          object.scale.setScalar(0.01)
          pops.push({ object, start: performance.now() })
        }
      }

      async function piece(id, slot) {
        try {
          const skinned = await tripoPiece(id, slot)
          if (skinned) return skinned
        } catch (error) {
          console.warn('sin modelo de Tripo para', id, error)
        }
        return BUILD[id] ? BUILD[id]() : part(new THREE.BoxGeometry(0.1, 0.1, 0.1), rune())
      }

      async function wear(slot, entry, announce) {
        const id = entry ? entry.id : null
        const token = (tokens[slot] = (tokens[slot] || 0) + 1)
        let shown = null
        if (slot === 'chest') shown = dressChest(id)
        else if (slot === 'boots') shown = dressBoots(id)
        else {
          const socket = slot === 'head' ? hero.headSocket : hero.arms[slot].socket
          const fitting = slot === 'head' ? refitHead(id) : null
          const next = id ? await piece(id, slot) : null
          const onAvatar = await fitting
          if (token !== tokens[slot]) return
          socket.clear()
          if (next) socket.add(next)
          shown = [next, onAvatar]
        }
        if (announce && id) {
          pop(shown)
          say(L('equipped ', 'equipaste ') + itemName(entry))
          hop = performance.now()
        }
      }

      let toastTimer = 0
      function say(text) {
        toast.textContent = text
        toast.classList.add('show')
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2600)
      }

      // Fondo por zona. Cada llamada lleva su turno: si la vitrina se deja y se
      // vuelve a abrir mientras el fondo baja, solo queda el ultimo pedido.
      let sceneName = null
      let backdrop = null
      let sceneTicket = 0
      async function setScene(name) {
        if (name === sceneName) return
        sceneName = name
        const ticket = ++sceneTicket
        groundMat.color.setHex(GROUND[name] || GROUND.reino)
        const fiery = name === 'ruinas' || name === 'titulo'
        ash.visible = fiery
        ember.color.setHex(fiery ? 0xff6a20 : 0xe0c060)
        if (backdrop) scene.remove(backdrop)
        backdrop = null
        const spec = SCENERY[name]
        if (!spec || !models.has(spec.file)) return
        try {
          const object = await loadGlb(spec.file)
          if (ticket !== sceneTicket || sceneName !== name || world) return
          if (backdrop) scene.remove(backdrop)
          object.updateMatrixWorld(true)
          const box = new THREE.Box3().setFromObject(object)
          const dims = box.getSize(new THREE.Vector3())
          object.scale.multiplyScalar(spec.size / dims.y)
          object.updateMatrixWorld(true)
          const placed = new THREE.Box3().setFromObject(object)
          const center = placed.getCenter(new THREE.Vector3())
          object.position.x -= center.x
          object.position.z -= center.z
          object.position.y -= placed.min.y
          const holder = new THREE.Group()
          holder.add(object)
          holder.position.set(...spec.at)
          holder.rotation.y = spec.yaw
          object.traverse((child) => {
            if (child.isMesh) child.castShadow = true
          })
          backdrop = holder
          scene.add(holder)
        } catch (error) {
          console.warn('sin fondo', name, error)
        }
      }

      // Ceniza de las ruinas y del titulo.
      const ASH = 600
      const ashGeo = new THREE.BufferGeometry()
      const ashPos = new Float32Array(ASH * 3)
      for (let i = 0; i < ASH; i++) {
        ashPos[i * 3] = (Math.random() - 0.5) * 10
        ashPos[i * 3 + 1] = Math.random() * 6
        ashPos[i * 3 + 2] = (Math.random() - 0.5) * 10
      }
      ashGeo.setAttribute('position', new THREE.BufferAttribute(ashPos, 3))
      const ash = new THREE.Points(
        ashGeo,
        new THREE.PointsMaterial({ color: 0xb09080, size: 0.035, transparent: true, opacity: 0.8 })
      )
      ash.visible = false
      scene.add(ash)

      // Mundo: en un mapa fijo el heroe camina por la version 3D del mapa ASCII,
      // hacia la celda del juego. En el resto queda la vitrina.
      const heroTarget = new THREE.Vector3()
      let world = null
      let worldToken = 0
      scene.add(sun.target)

      // La lente se elige por ancho: en una pantalla vertical, el mismo angulo
      // vertical deja apenas 11 grados de ancho y el Coloso queda fuera de cuadro.
      // Ahi se abre la vertical hasta que el ancho vuelva a ser el de la base.
      let lensBase = 38
      function lens() {
        if (camera.aspect >= 1) return lensBase
        const half = Math.tan(THREE.MathUtils.degToRad(lensBase / 2)) / camera.aspect
        return Math.min(75, THREE.MathUtils.radToDeg(2 * Math.atan(half)))
      }

      function showcase(on) {
        ground.visible = on
        ring.visible = on
        scene.background = on ? night : skyTexture
        scene.fog.color.setHex(on ? 0x0b0b0c : 0x3a4656)
        useAvatar(!on)
        if (backdrop) backdrop.visible = on
        controls.autoRotate = on
        controls.autoRotateSpeed = 0.9
        // En el mapa, vista 2.5D: lente cerrada y desde lejos, casi isometrica.
        lensBase = on ? 38 : 24
        camera.fov = lens()
        controls.minDistance = on ? 2.4 : 14
        controls.maxDistance = on ? 11 : 110
        scene.fog.near = on ? 11 : 60
        scene.fog.far = on ? 30 : 150
        const reach = on ? 6 : 24
        Object.assign(sun.shadow.camera, { left: -reach, right: reach, top: reach, bottom: -reach })
        sun.shadow.camera.far = on ? 30 : 80
        sun.shadow.camera.updateProjectionMatrix()
        camera.far = on ? 100 : 220
        camera.updateProjectionMatrix()
      }

      function leaveWorld() {
        if (!world) return
        scene.remove(world.built.group)
        world.built.dispose()
        world = null
        if (marks) marks.visible = false
      }

      // Los mapas no cambian mientras la pagina corre: cada uno se pide una vez.
      const maps = new Map()
      function mapData(id) {
        if (!maps.has(id)) {
          const request = retry(() =>
            fetch('world/' + id + '.json', { cache: 'no-store' }).then((response) => {
              if (!response.ok) throw httpError('el mapa ' + id, response)
              return response.json()
            })
          )
          maps.set(id, request)
          request.catch(() => maps.delete(id))
        }
        return maps.get(id)
      }

      // Los carteles, las puertas y los NPC en el idioma elegido, con la tabla
      // del juego (lib/locale.js). Los letreros pintados en el mapa conservan su
      // largo, como en la terminal.
      function localized(data) {
        if (settings.lang !== 'en' || !juego) return { data, text: (name) => name }
        return {
          data: { ...data, signs: data.rows.map((row) => juego.signs('en', row)) },
          text: (name) => juego.translate('en', name)
        }
      }

      // Donde se para la camara al llegar a un mapa: al sur del heroe y arriba.
      const VIEWS = { far: [44, 32], near: [24, 18] }
      function cameraOffset() {
        const [up, back] = VIEWS[settings.camera] || VIEWS.far
        return new THREE.Vector3(0, up, back)
      }

      // La consulta llega seguido y armar la ciudad puede tardar mas: mientras un
      // mapa se arma no se vuelve a pedir, solo se anota la ultima celda.
      let loadingMap = null
      let lastAt = null
      async function enterWorld(at) {
        lastAt = at
        if (world && world.map === at.map) {
          heroTarget.copy(world.built.toWorld(at.x, at.y))
          return
        }
        if (loadingMap === at.map) return
        loadingMap = at.map
        if (screen !== 'play')
          mode.textContent = L('building the 3D map...', 'armando el mapa 3D...')
        const token = ++worldToken
        let data
        try {
          data = await mapData(at.map)
        } catch (error) {
          if (token === worldToken) loadingMap = null
          mode.textContent = L('could not load the map ', 'no pude traer el mapa ') + at.map
          console.warn(error)
          return
        }
        if (token !== worldToken) return
        loadingMap = null
        leaveWorld()
        let built
        try {
          const shown = localized(data)
          built = buildWorld(shown.data, {
            figure,
            text: shown.text,
            glb: (file) => (models.has(file) ? loadGlb(file) : Promise.resolve(null))
          })
        } catch (error) {
          mode.textContent = L('could not build the map ', 'no pude armar el mapa ') + at.map
          console.error(error)
          return
        }
        // Mientras se armaba el heroe pudo moverse: se usa la ultima celda.
        if (lastAt && lastAt.map === at.map) at = lastAt
        if (screen === 'mirror') {
          mode.textContent =
            L('3D map: ', 'mapa 3D: ') +
            data.name +
            L('. You move from the terminal game.', '. Te moves desde la terminal del juego.')
        } else if (screen === 'tour') mode.textContent = placeName(at.map)
        scene.add(built.group)
        world = { map: at.map, built, data }
        showcase(false)
        ash.visible = data.kind === 'boss'
        ember.color.setHex(data.kind === 'boss' ? 0xff6a20 : 0xe0c060)
        // La vitrina se vuelve a armar al salir del mapa.
        sceneName = null
        heroTarget.copy(built.toWorld(at.x, at.y))
        hero.root.position.copy(heroTarget)
        controls.target.copy(heroTarget).setY(1)
        // La camara arranca al sur del heroe, mirando al norte como la terminal.
        camera.position.copy(heroTarget).add(cameraOffset())
        if (screen === 'tour' && !avatarBody) {
          mode.textContent =
            placeName(at.map) +
            L(' (loading the Tripo hero...)', ' (cargando el heroe de Tripo...)')
        }
        loadAvatar().then(() => {
          useAvatar(!!world)
          if (screen === 'tour' && world) hint()
        })
      }

      function exitWorld() {
        worldToken++
        loadingMap = null
        if (!world) return
        leaveWorld()
        showcase(true)
        hero.root.position.set(0, 0, 0)
        hero.root.rotation.y = 0
        heroTarget.set(0, 0, 0)
        controls.target.set(0, 1, 0)
        camera.position.set(0, 1.55, 4.8)
        ash.position.set(0, 0, 0)
      }

      // El idioma cambio: el mapa se vuelve a armar con sus carteles nuevos.
      function relabel() {
        if (!world) return
        const at = lastAt
        leaveWorld()
        if (at) enterWorld(at)
      }

      async function refreshModels() {
        try {
          const response = await fetch('models.json', { cache: 'no-store' })
          if (!response.ok) throw httpError('models.json', response)
          const list = await response.json()
          models = new Map(list.map((model) => [model.name, model.mtime]))
          // Si la lista llego tarde, el heroe de Tripo se carga ahora y no al
          // cambiar de mapa.
          if (!avatarBody) {
            loadAvatar().then(() => {
              if (world || screen === 'menu') useAvatar(true)
            })
          }
          if (screen === 'menu' && sceneName === 'titulo') {
            sceneName = null
            setScene('titulo')
          }
          return true
        } catch (error) {
          // Sin lista no hay modelos de Tripo: quedan las formas simples.
          console.warn('sin la lista de modelos de Tripo', error)
          return false
        }
      }

      // El Coloso marca en el piso donde va a pegar (rojo, late) y lo que ya
      // quema (naranja): son las celdas que da el juego, sobre el mapa 3D.
      let marks = null
      const markMatrix = new THREE.Matrix4()
      const markRed = new THREE.Color(0xff3b1a)
      const markOrange = new THREE.Color(0xff9a20)
      function bossMarks(boss, time) {
        const cells = boss && world && world.map === 'boss' ? boss : null
        if (!cells) {
          if (marks) marks.visible = false
          return
        }
        if (!marks) {
          marks = new THREE.InstancedMesh(
            new THREE.PlaneGeometry(CX * 0.94, CZ * 0.94).rotateX(-Math.PI / 2),
            new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.6, depthWrite: false }),
            256
          )
          marks.frustumCulled = false
          marks.renderOrder = 2
          scene.add(marks)
        }
        let i = 0
        const put = (cell, color) => {
          if (i >= 256) return
          const p = world.built.toWorld(cell.x, cell.y)
          marks.setMatrixAt(i, markMatrix.makeTranslation(p.x, 0.07, p.z))
          marks.setColorAt(i++, color)
        }
        for (const cell of cells.telegraphs || []) put(cell, markRed)
        for (const cell of cells.hazards || []) put(cell, markOrange)
        marks.count = i
        marks.instanceMatrix.needsUpdate = true
        if (marks.instanceColor) marks.instanceColor.needsUpdate = true
        marks.material.opacity = 0.45 + Math.sin(time * 9) * 0.2
        marks.visible = i > 0
      }

      // Animacion
      let hop = 0
      let stride = 0
      let lastStep = 0
      let velocity = 0
      const timer = new THREE.Timer()
      const step = new THREE.Vector3()
      const follow = new THREE.Vector3()
      const wrap = (angle) => Math.atan2(Math.sin(angle), Math.cos(angle))

      // En el mundo: el heroe va hacia la celda del juego al paso elegido, mira
      // hacia donde va y la camara lo sigue sin perder el angulo que eligio quien
      // mira. El clip sale del paso: Run al correr o esprintar, Walk al caminar e
      // Idle quieto, con la velocidad del clip atada a la del heroe.
      function walk(dt) {
        const pos = hero.root.position
        step.subVectors(heroTarget, pos).setY(0)
        const dist = step.length()
        let moved = 0
        // Siguiendo a la terminal no se sabe a que paso va: se la alcanza rapido.
        const speed = screen === 'mirror' ? 12 : pace().speed
        if (dist > 6) pos.set(heroTarget.x, pos.y, heroTarget.z)
        else if (dist > 0.004) {
          moved = Math.min(dist, (speed * 1.12 + dist * 3) * dt)
          pos.addScaledVector(step.normalize(), moved)
          const yaw = Math.atan2(step.x, step.z)
          hero.root.rotation.y += wrap(yaw - hero.root.rotation.y) * Math.min(1, dt * 14)
        }
        const now = performance.now()
        const rate = moved / Math.max(dt, 1e-3)
        velocity += (rate - velocity) * Math.min(1, dt * 8)
        if (rate > 0.2) lastStep = now
        const going = now - lastStep < 170
        stride = going ? stride + dt * 11 : 0
        const swing = going ? Math.sin(stride) * 0.55 : 0
        if (mixer) {
          if (!going) setGait('Idle', 1)
          else {
            const spec = screen === 'mirror' ? (velocity > 3.5 ? GAITS.run : GAITS.walk) : pace()
            const base = screen === 'mirror' ? Math.max(velocity, 1) : spec.speed
            setGait(spec.clip, Math.min(spec.most, Math.max(0.8, base / spec.pace)))
          }
        }
        // Sin esqueleto, el heroe de Tripo se balancea.
        const sway = going && !AVATAR.rigged
        avatar.position.y = sway ? Math.abs(Math.sin(stride)) * 0.09 : 0
        avatar.rotation.z = sway ? Math.sin(stride) * 0.05 : 0
        hero.legs[0].rotation.x = swing
        hero.legs[1].rotation.x = -swing
        if (going) {
          hero.arms.left_hand.shoulder.rotation.x = -swing * 0.4
          hero.arms.right_hand.shoulder.rotation.x = swing * 0.4
        }
        follow.set(pos.x, 1, pos.z)
        camera.position.add(step.subVectors(follow, controls.target))
        controls.target.copy(follow)
        sun.position.set(pos.x + 12, 22, pos.z + 10)
        sun.target.position.set(pos.x, 0, pos.z)
        if (ash.visible) ash.position.set(pos.x, 0, pos.z)
      }

      renderer.setAnimationLoop(() => {
        timer.update()
        const t = timer.getElapsed()
        const dt = Math.min(0.1, timer.getDelta())
        const now = performance.now()
        hero.hips.position.y = 0.95 + Math.sin(t * 2) * 0.008
        hero.torso.scale.y = 1 + Math.sin(t * 2) * 0.015
        hero.arms.left_hand.shoulder.rotation.x = Math.sin(t * 1.3) * 0.05
        hero.arms.right_hand.shoulder.rotation.x = -Math.sin(t * 1.3) * 0.05
        const since = (now - hop) / 1000
        hero.root.position.y = since < 0.45 ? Math.sin((since / 0.45) * Math.PI) * 0.18 : 0
        ringMat.opacity = since < 1 ? 0.5 + (1 - since) * 0.5 : 0.5
        ring.scale.setScalar(since < 1 ? 1 + (1 - since) * 0.25 : 1)
        for (let i = pops.length - 1; i >= 0; i--) {
          const k = Math.min(1, (now - pops[i].start) / 450)
          const overshoot = 1 + Math.sin(k * Math.PI) * 0.18
          pops[i].object.scale.setScalar(Math.max(0.01, k * overshoot))
          if (k === 1) {
            pops[i].object.scale.setScalar(1)
            pops.splice(i, 1)
          }
        }
        if (ash.visible) {
          for (let i = 0; i < ASH; i++) {
            const y = i * 3 + 1
            ashPos[y] -= 0.006 + (i % 7) * 0.0008
            ashPos[i * 3] += Math.sin(t + i) * 0.0015
            if (ashPos[y] < 0) ashPos[y] = 6
          }
          ashGeo.attributes.position.needsUpdate = true
        }
        if (screen === 'tour') stepDemo(dt)
        if (screen === 'play') playFrame(dt, t)
        if (world) walk(dt)
        else if (mixer && screen === 'menu') setGait('Idle', 1)
        if (mixer && avatar.visible) mixer.update(dt)
        // El mundo puede tener movimiento propio: viento, agua, NPC.
        if (world && world.built.update) world.built.update(t)
        controls.update()
        renderer.render(scene, camera)
      })

      // En el menu de titulo la escena se corre a la derecha (una fraccion del
      // ancho) para que los botones no tapen al heroe ni al Coloso.
      let viewShift = 0
      function shiftView() {
        const { clientWidth: w, clientHeight: h } = renderer.domElement
        if (viewShift && w > h) camera.setViewOffset(w, h, -w * viewShift, 0, w, h)
        else camera.clearViewOffset()
      }

      // El CSS fija el tamano del lienzo; el buffer lo sigue cuando cambia.
      function fitView() {
        const { clientWidth, clientHeight } = renderer.domElement
        if (!clientWidth || !clientHeight) return
        renderer.setSize(clientWidth, clientHeight, false)
        camera.aspect = clientWidth / clientHeight
        camera.fov = lens()
        shiftView()
        camera.updateProjectionMatrix()
      }
      new ResizeObserver(fitView).observe(renderer.domElement)
      fitView()

      // ---------------------------------------------------------------------
      // Pantallas: menu, jugar, recorrer y seguir la terminal.

      let screen = 'boot'
      let juego = null
      const keysLine = document.getElementById('keys')
      const hud = document.getElementById('hud')
      const menu = document.getElementById('menu')
      const menuMain = document.getElementById('menu-main')
      const menuPage = document.getElementById('menu-page')
      const playBox = document.getElementById('play')
      const statsBox = document.getElementById('stats')
      const bossBox = document.getElementById('bossbar')
      const gaitBox = document.getElementById('gait')
      const logBox = document.getElementById('log')
      const hintBox = document.getElementById('hint')
      const actions = document.getElementById('actions')
      const term = document.getElementById('term')
      const pause = document.getElementById('pause')
      const pad = document.getElementById('pad')
      const talkBox = document.getElementById('talk')
      const bagBox = document.getElementById('bag')
      const links = document.getElementById('links')

      // Los nombres de items, lugares y NPC vienen del juego en castellano.
      const tr = (text) => (juego && text ? juego.translate(settings.lang, text) : text || '')
      const itemName = (entry) => (entry ? tr(entry.name) : '-')

      // Cada pantalla deja todo como lo encontro: la de la que se sale se apaga
      // entera antes de prender la otra.
      function leaveScreen() {
        if (screen === 'play') stopPlay()
        viewShift = 0
        shiftView()
        camera.updateProjectionMatrix()
        hud.hidden = true
        document.getElementById('places').hidden = true
        menu.hidden = true
        playBox.hidden = true
        actions.hidden = true
        term.hidden = true
        pause.hidden = true
        pad.hidden = true
        talkBox.hidden = true
        bagBox.hidden = true
        links.hidden = true
        demo.held.clear()
        demo.fingers.clear()
        demo.map = undefined
        mover.held.clear()
        mover.fingers.clear()
        shiftHeld = false
      }

      // Un boton de menu, con su nota abajo.
      function button(text, note, action, disabled = false) {
        const b = document.createElement('button')
        b.type = 'button'
        b.append(text)
        if (note) {
          const small = document.createElement('small')
          small.textContent = note
          b.append(small)
        }
        b.disabled = disabled
        b.addEventListener('click', () => {
          b.blur()
          action()
        })
        return b
      }

      // Una hoja del menu (de titulo o de la partida), con titulo y volver.
      function sheet(box, title, back) {
        box.replaceChildren()
        const h = document.createElement('h2')
        h.textContent = title
        box.append(h)
        return () => box.append(button(L('Back', 'Volver'), null, back))
      }

      // Un grupo de botones que elige uno.
      function choice(box, options, current, onPick) {
        const row = document.createElement('div')
        row.className = 'pick'
        for (const [value, text] of options) {
          const b = button(text, null, () => onPick(value))
          b.setAttribute('aria-pressed', String(value === current))
          row.append(b)
        }
        box.append(row)
      }

      function line(box, text, className) {
        const p = document.createElement('p')
        p.textContent = text
        if (className) p.className = className
        box.append(p)
        return p
      }

      // --- Menu de titulo ---------------------------------------------------

      let terminalOpen = false
      let terminalSaves = []

      function slotsOf() {
        try {
          return juego ? juego.slots() : []
        } catch {
          return []
        }
      }

      function slotNote(slot) {
        const realm = String(slot.realm || 'runa').toUpperCase()
        return `${slot.name}, ${L('level', 'nivel')} ${slot.level}, ${realm}, ${tr(slot.place)}`
      }

      function titleScene() {
        exitWorld()
        showcase(true)
        ring.visible = false
        setScene('titulo')
        lensBase = 34
        camera.fov = lens()
        viewShift = 0.2
        shiftView()
        camera.updateProjectionMatrix()
        controls.autoRotateSpeed = 0.35
        controls.minDistance = 4
        controls.maxDistance = 16
        controls.target.set(0, 2, -2)
        camera.position.set(4.6, 2.5, 7.6)
        hero.root.position.set(0, 0, 0)
        hero.root.rotation.y = 0.3
        loadAvatar().then(() => {
          if (screen === 'menu') useAvatar(true)
        })
        useAvatar(true)
      }

      function showMenu() {
        leaveScreen()
        screen = 'menu'
        menu.hidden = false
        document.getElementById('tagline').textContent = L(
          'An ASCII RPG with a 3D world made with Tripo.',
          'Un RPG en ASCII con un mundo 3D hecho con Tripo.'
        )
        const credits = document.getElementById('credits')
        credits.replaceChildren(
          L(
            'Tripo made the 3D models; Higgsfield rigged and animated the hero. ',
            'Tripo hizo los modelos 3D; Higgsfield le puso esqueleto y animo al heroe. '
          ),
          Object.assign(document.createElement('a'), {
            href: 'https://github.com/Bitcoindefi/runa',
            textContent: L('Source and the terminal game', 'Codigo y juego de terminal')
          })
        )
        titleScene()
        mainMenu()
      }

      function mainMenu() {
        menuPage.hidden = true
        menuMain.hidden = false
        menuMain.replaceChildren()
        const slots = slotsOf()
        const playable = slots.filter((slot) => !slot.empty && !slot.corrupt)
        const latest = playable
          .slice()
          .sort((a, b) => String(b.savedAt || '').localeCompare(String(a.savedAt || '')))[0]
        if (latest) {
          menuMain.append(
            button(L('Continue', 'Continuar'), slotNote(latest), () => play({ load: latest.slot }))
          )
        }
        menuMain.append(
          button(
            L('New game', 'Partida nueva'),
            juego
              ? L('A hero of RUNA or of NOX', 'Un heroe de RUNA o de NOX')
              : L('loading the game...', 'cargando el juego...'),
            newGamePage,
            !juego
          )
        )
        if (playable.length || terminalSaves.length) {
          menuMain.append(button(L('Load game', 'Cargar partida'), null, loadPage, !juego))
        }
        if (terminalOpen) {
          menuMain.append(
            button(
              L('Follow the terminal game', 'Seguir el juego de la terminal'),
              L('The game is open with --teclas', 'El juego esta abierto con --teclas'),
              startMirror
            )
          )
        }
        menuMain.append(
          button(
            L('Explore the 3D world', 'Recorrer el mundo 3D'),
            L('No rules: walk the Tripo kingdom', 'Sin reglas: camina el reino de Tripo'),
            startTour
          )
        )
        menuMain.append(button(L('Settings', 'Opciones'), null, () => subPage(settingsPage)))
        menuMain.append(button(L('Controls', 'Controles'), null, () => subPage(controlsPage)))
        const gallery = button(L('The Tripo models', 'Los modelos de Tripo'), null, () => {
          location.href = 'models.html'
        })
        menuMain.append(gallery)
        menuMain.querySelector('button:not([disabled])').focus()
      }

      function subPage(build) {
        menuMain.hidden = true
        menuPage.hidden = false
        build(menuPage, mainMenu)
        const first = menuPage.querySelector('input, button:not([disabled])')
        if (first) first.focus()
      }

      function newGamePage() {
        subPage((box, back) => {
          const done = sheet(box, L('New game', 'Partida nueva'), back)
          const form = document.createElement('form')
          form.className = 'sheet'
          const name = document.createElement('input')
          name.type = 'text'
          name.maxLength = 16
          name.autocomplete = 'off'
          name.spellcheck = false
          name.placeholder = L('your name', 'tu nombre')
          const label = document.createElement('label')
          label.append(L('Your name', 'Tu nombre'), name)
          form.append(label)
          let realm = 'runa'
          const realms = document.createElement('div')
          const paint = () => {
            realms.replaceChildren()
            line(realms, L('Your kingdom', 'Tu reino'))
            choice(
              realms,
              [
                ['runa', L('RUNA, the kingdom of dawn', 'RUNA, el reino del alba')],
                ['nox', L('NOX, the rival kingdom', 'NOX, el reino rival')]
              ],
              realm,
              (value) => {
                realm = value
                paint()
              }
            )
          }
          paint()
          form.append(realms)
          // Con las tres ranuras llenas se elige cual reemplazar.
          const slots = slotsOf()
          let slot = (slots.find((entry) => entry.empty) || {}).slot || null
          const full = !slot
          const replace = document.createElement('div')
          if (full) {
            slot = 1
            const paintSlots = () => {
              replace.replaceChildren()
              line(
                replace,
                L(
                  'All three slots are used: pick one to replace',
                  'Las tres ranuras estan ocupadas: elegi cual reemplazar'
                )
              )
              choice(
                replace,
                slots.map((entry) => [entry.slot, `${entry.slot}. ${entry.name || '-'}`]),
                slot,
                (value) => {
                  slot = value
                  paintSlots()
                }
              )
            }
            paintSlots()
            form.append(replace)
          }
          const error = line(form, '', 'error')
          const start = document.createElement('button')
          start.type = 'submit'
          start.textContent = L('Start', 'Empezar')
          form.append(start)
          form.addEventListener('submit', (event) => {
            event.preventDefault()
            // La terminal solo dibuja ASCII: el juego descarta el resto del nombre.
            const typed = name.value.replace(/[^\x20-\x7e]/g, '').trim()
            if (!typed) {
              error.textContent = L('Write a name to start.', 'Escribi un nombre para empezar.')
              name.focus()
              return
            }
            play({ begin: { name: typed, realm, slot } })
          })
          box.append(form)
          done()
        })
      }

      function loadPage() {
        subPage((box, back) => {
          const done = sheet(box, L('Load game', 'Cargar partida'), back)
          for (const slot of slotsOf()) {
            const text = `${L('Slot', 'Ranura')} ${slot.slot}`
            if (slot.empty) box.append(button(text, L('empty', 'vacia'), () => {}, true))
            else if (slot.corrupt)
              box.append(button(text, L('damaged save', 'guardado danado'), () => {}, true))
            else box.append(button(text, slotNote(slot), () => play({ load: slot.slot })))
          }
          if (terminalSaves.length) {
            line(
              box,
              L(
                'From the terminal game (a copy: the terminal keeps its own):',
                'Del juego de la terminal (una copia: la terminal sigue con la suya):'
              )
            )
            for (const saved of terminalSaves) {
              box.append(
                button(
                  `${L('Terminal slot', 'Ranura de la terminal')} ${saved.slot}`,
                  slotNote(saved),
                  () => importTerminal(saved)
                )
              )
            }
          }
          done()
        })
      }

      // Copia una partida de la terminal a la misma ranura de la pagina.
      async function importTerminal(saved) {
        const mine = slotsOf()[saved.slot - 1]
        if (mine && !mine.empty) {
          const sure = confirm(
            L(
              `Slot ${saved.slot} of this page has ${mine.name}. Replace it with the terminal copy?`,
