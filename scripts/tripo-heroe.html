      // --- Jugar: el juego de verdad, en la pagina ---------------------------

      let session = null
      let live = null
      let peek = false
      let paused = false
      let termShown = false
      let termDirty = false
      let termCols = 0
      let termRows = 0
      let shownGear = ''
      let firstGear = true
      let hudKey = ''
      const logLines = []

      // El juego empaquetado (scripts/build-juego.js). Pesa: se pide al arrancar
      // la pagina, mientras el menu ya se ve, y se reintenta como los mapas.
      let gameError = null
      async function loadGame() {
        // Un import() que fallo queda guardado como fallido para esa URL: cada
        // reintento pide otra. La URL va armada a mano: Safari (WebKit) ignora
        // el <base> en un import() de un script en linea y en /jugar pedia
        // /juego.js, un 404.
        for (let i = 0; i < 4 && !juego; i++) {
          try {
            const url = new URL('./juego.js' + (i ? '?retry=' + i : ''), document.baseURI)
            juego = (await import(url.href)).default
          } catch (error) {
            console.warn('sin el juego todavia', error)
            gameError = error
            await new Promise((resolve) => setTimeout(resolve, 700 * (i + 1)))
          }
        }
        if (juego) window.runaJuego = juego
        else window.runaFailure(gameError)
        if (!juego)
          say(
            L(
              'Could not load the game. Reload the page to try again.',
              'No pude cargar el juego. Recarga la pagina para probar de nuevo.'
            )
          )
        if (screen === 'menu' && menuPage.hidden) mainMenu()
        return juego
      }

      // Lo que muestra el registro: las ultimas lineas, traducidas al mostrarse.
      function pushLog(text) {
        logLines.push({ text, at: performance.now() })
        if (logLines.length > 4) logLines.shift()
        drawLog()
      }
      function drawLog() {
        logBox.replaceChildren(
          ...logLines.map((entry, i) => {
            const li = document.createElement('li')
            li.textContent = tr(entry.text)
            if (i < logLines.length - 2) li.className = 'old'
            return li
          })
        )
      }

      function play(how) {
        if (!juego) return
        leaveScreen()
        screen = 'play'
        playBox.hidden = false
        actions.hidden = !touchPad
        pad.hidden = !touchPad
        logLines.length = 0
        drawLog()
        firstGear = true
        shownGear = ''
        hudKey = ''
        live = null
        peek = false
        paused = false
        document.body.classList.remove('paused')
        session = juego.start({
          language: settings.lang,
          cols: termCols || 120,
          rows: termRows || 36,
          onFrame: () => {
            termDirty = true
          },
          onSay: pushLog,
          onExit: () => {
            if (screen === 'play' && session && !session.running()) showMenu()
          }
        })
        window.runaGame = session
        if (how.load && !session.load(how.load)) {
          const message = session.runa.menuMessage
          stopPlay()
          showMenu()
          say(tr(message) || L('That save could not be loaded.', 'No se pudo cargar esa partida.'))
          return
        }
        if (how.begin) session.begin(how.begin)
        // En linea al arrancar: lo que pidio el menu de titulo, la direccion
        // (?sala=CODIGO) o la publica. Opciones lo apaga, y con ahorro de datos
        // se espera a que el jugador lo pida.
        const saveData = !!(navigator.connection && navigator.connection.saveData)
        wantNet = wantNetNext || linkedRoom()
        wantNetAuto = false
        if (!wantNet && settings.net !== 'off' && !saveData) {
          wantNet = 'public'
          wantNetAuto = true
        }
        wantNetNext = ''
        setupActions()
        actionsKey = ''
        fitTerm()
      }

      function stopPlay() {
        for (const entry of [...peers.values()]) dropPeer(entry)
        duelView.set(0, 0, 0)
        stopLobby()
        joinTicket++
        roomJoining = ''
        wantNet = ''
        if (!session) return
        const ending = session
        session = null
        live = null
        ending.quit()
      }

      async function quitToTitle() {
        const ending = session
        session = null
        if (ending) await ending.quit()
        showMenu()
      }

      // Cada cuadro: lo que dice el juego llega a la vista 3D, a la ficha y a la
      // pantalla de texto; y los pasos sostenidos se convierten en teclas.
      function playFrame(dt, time) {
        if (!session) return
        live = session.state()
        const st = live
        // Los mapas fijos vienen del juego; la pradera, si pradera.js la dibuja.
        const at = st.world || (meadow && meadow.worldAt(st))
        if (at) enterWorld(at)
        else if (!st.title) {
          if (world) exitWorld()
          setScene(st.scene)
        }
        dressFrom(st)
        bossMarks(st.boss, time)
        fightFrame(dt, time, st)
        othersFrame(dt, st)
        tickBits(dt)
        if (wantNet && !st.title && !st.naming) {
          const want = wantNet
          wantNet = ''
          if (want === 'public') goPublic()
          else joinPrivate(want)
          // La primera vez que entra solo, avisa que es en linea y como apagarlo.
          if (wantNetAuto && !settings.netNoticed) {
            settings.netNoticed = true
            keepSettings()
            say(
              L(
                'You are online: players in your room connect to you directly and can see your IP. Turn it off in Settings.',
                'Estas en linea: los de tu sala se conectan directo con vos y ven tu IP. Lo apagas en Opciones.'
              )
            )
          }
          wantNetAuto = false
        }
        arrivals()
        if (meadow && world && at && world.map === at.map) meadow.update(time, dt, st, world)
        // La pantalla de texto del juego, salvo lo que la pagina ya muestra: el
        // inventario (inventario.js) y el combate en 3D (pradera.js).
        const panel = inventory ? inventory.sync(st, session) : false
        const combat = st.combat && !(meadow && meadow.handlesCombat(st))
        const text = st.title || st.naming || !at || (!!st.overlay && !panel) || combat
        setTerm(text || peek)
        playBox.hidden = termShown
        refreshPlayHud()
        syncActions(st)
        // Un menu que se abre o se cierra bajo el pulgar cambia el modo del stick ya.
        if (stickId !== null) stickSet(stickDir)
        showCell(st)
        stepGame(dt, st)
        if (termShown && termDirty) drawTerm()
      }

      // La celda donde esta el heroe, como la ficha de la terminal (X:163 Y:132).
      // Cambia en cada paso: se escribe aparte, sin rearmar la ficha.
      function showCell(st) {
        const spot = statsBox.querySelector('.xy')
        if (!spot || !st.location) return
        const text = `X:${st.location.x} Y:${st.location.y}`
        if (spot.textContent !== text) spot.textContent = text
      }

      function dressFrom(st) {
        const key = JSON.stringify(st.equipped)
        if (key === shownGear) return
        shownGear = key
        for (const slot of SLOTS) {
          const entry = st.equipped[slot]
          const id = entry ? entry.id : null
          if (worn[slot] === id && !firstGear) continue
          worn[slot] = id
          wear(slot, entry, !firstGear)
        }
        firstGear = false
      }

      function bar(kind, value, most, text) {
        const share = most > 0 ? Math.max(0, Math.min(1, value / most)) : 0
        return `<div class="bar ${kind}"><i style="width:${(share * 100).toFixed(1)}%"></i><span>${text}</span></div>`
      }
      const esc = (text) =>
        String(text).replace(
          /[&<>"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]
        )

      function placeOf(st) {
        if (st.world && world && world.data && world.map === st.world.map)
          return tr(world.data.name)
        const names = {
          field: L('The meadow', 'La pradera'),
          dungeon: L('The crypt', 'La cripta'),
          'barbarian-camp': L('A barbarian camp', 'Un campamento barbaro'),
          boss: L('Volcanic ruins', 'Ruinas volcanicas')
        }
        if (st.field) return names[st.field] || st.field
        const map = juego && st.location.mapId ? juego.MAPS[st.location.mapId] : null
        return map ? tr(map.name) : ''
      }

      // La mision del modo historia (st.story, del rey Aldren), en una linea:
      // a quien ir, el capitulo y su progreso, o volver a cobrar. Los textos
      // vienen del juego en castellano y se traducen como el resto.
      function questLine(story) {
        if (!story || story.status === 'done') return ''
        const head = `&#128081; ${L('Chapter', 'Capitulo')} ${story.chapter}/${story.chapters}`
        let text
        if (story.status === 'available') text = tr('el rey Aldren te espera en el castillo')
        else if (story.status === 'ready')
          text = `${tr(story.title)}: ${L('return to ', 'volve con ')}${tr(story.returnTo)}`
        else text = `${tr(story.title)}: ${tr(story.label)} ${story.progress}/${story.count}`
        const shown = text.charAt(0).toUpperCase() + text.slice(1)
        return `<div class="quest">${head} &middot; ${esc(shown)}</div>`
      }

      // La ficha se rearma solo si cambio algo de lo que muestra.
      function refreshPlayHud(force = false) {
        if (screen !== 'play' || !live) return
        const st = live
        const room = roomOf()
        const onlineLine = netLine(room)
        const onlineState = netState(room)
        const arena = st.arena
        const key = [
          st.name,
          st.level,
          st.hp,
          st.maxhp,
          st.xp,
          st.xpneed,
          st.gold,
          st.potions,
          placeOf(st),
          shownGear,
          st.boss ? [st.boss.hp, st.boss.phase, st.boss.defeated].join() : '',
          st.story ? [st.story.id, st.story.status, st.story.progress].join() : '',
          st.near ? st.near.kind + (st.near.name || '') : '',
          st.field,
          settings.lang,
          gaitName(),
          onlineLine,
          onlineState,
          arena
            ? [
                arena.rival.name,
                arena.rival.hp,
                arena.rival.maxHp,
                arena.distance,
                arena.self.reach,
                arena.self.cooldownLeft > 0
              ].join()
            : '',
          st.invite ? st.invite.direction + st.invite.name : ''
        ].join('|')
        if (key === hudKey && !force) return
        hudKey = key
        const wornText = SLOTS.map((slot) => st.equipped[slot])
          .filter(Boolean)
          .map((entry) => `<b>${esc(itemName(entry))}</b>`)
          .join(', ')
        statsBox.innerHTML =
          `<div class="who">${esc(st.name)} &middot; ${L('Lv', 'Nv')} ${st.level}</div>` +
          `<div class="where">${esc(placeOf(st))} <span class="xy"></span></div>` +
          bar('hp', st.hp, st.maxhp, `${L('HP', 'Vida')} ${st.hp}/${st.maxhp}`) +
          bar('xp', st.xp, st.xpneed, `${L('XP', 'Exp')} ${st.xp}/${st.xpneed || '-'}`) +
          `<div class="purse">${L('Gold', 'Oro')} ${st.gold} &middot; ${L('Potions', 'Pociones')} ${st.potions}</div>` +
          (wornText ? `<div class="worn">${wornText}</div>` : '') +
          questLine(st.story) +
          `<button type="button" class="online" data-state="${onlineState}">${esc(onlineLine)}</button>`
        const boss = st.boss
        bossBox.hidden = !boss || boss.defeated
        if (boss && !boss.defeated) {
          bossBox.innerHTML =
            `${L('The Runic Colossus', 'El Coloso runico')}` +
            bar('', boss.hp, boss.maxhp, `${boss.hp}/${boss.maxhp}`)
        }
        rivalBox.hidden = !arena
        if (arena) {
          rivalBox.innerHTML =
            esc(arena.rival.name) +
            bar('', arena.rival.hp, arena.rival.maxHp, `${arena.rival.hp}/${arena.rival.maxHp}`)
        }
        const mode = gaitName()
        const names = {
          walk: L('Walking', 'Caminando'),
          run: L('Running', 'Corriendo'),
          sprint: L('Sprinting', 'Esprintando')
        }
        gaitBox.innerHTML = `<b>${names[mode]}</b> &middot; Shift: ${
          settings.run ? L('sprint', 'esprintar') : L('run', 'correr')
        }`
        let hint = ''
        // En el celular el boton ya dice que hace: la ayuda no nombra iconos.
        const use = touchPad ? '' : 'E · '
        if (arena) {
          // Lo mismo que la linea COLISEO de la terminal: alcance y recarga.
          const ready =
            arena.self.cooldownLeft > 0 ? L('reloading', 'recargando') : L('ready', 'listo')
          const state = `${L('reach', 'alcance')} ${arena.distance}/${arena.self.reach} · ${ready}`
          hint = touchPad
            ? state
            : 'F ' + L('attack', 'atacar') + ' · R ' + L('surrender', 'rendirse') + ' · ' + state
        } else if (st.invite && st.invite.direction === 'out')
          hint =
            L('Waiting for ', 'Esperando a ') +
            st.invite.name +
            (touchPad ? '' : ' · N' + L(' cancels', ' cancela'))
        else if (st.near && st.near.kind === 'player')
          hint = use + L('challenge ', 'desafiar a ') + st.near.name
        else if (st.near && st.near.kind === 'npc')
          hint = use + L('talk to ', 'hablar con ') + tr(st.near.name)
        else if (st.near && st.near.kind === 'ranking') hint = use + L('leaderboard', 'ranking')
        else if (st.boss && !st.boss.defeated)
          hint = (touchPad ? '' : 'F · ') + L('strike the Colossus', 'golpear al Coloso')
        hintBox.textContent = hint
        drawLog()
      }

      // --- La pantalla de texto ---------------------------------------------

      const FG = { 30: 'k', 31: 'r', 32: 'g', 33: 'y', 34: 'b', 35: 'm', 36: 'c', 37: 'w' }
      // El juego pinta con SGR: colores 30-37, 90-97 y atributos. Nada mas.
      function sgrToHtml(view) {
        let html = ''
        let state = { fg: null, bold: false, faint: false, reverse: false, underline: false }
        const pattern = /\x1b\[([0-9;]*)m/g
        let last = 0
        const flush = (text) => {
          if (!text) return
          const kinds = []
          if (state.fg) kinds.push('f' + state.fg)
          if (state.bold) kinds.push('b')
          if (state.faint) kinds.push('d')
          if (state.reverse) kinds.push('v')
          if (state.underline) kinds.push('u')
          html += kinds.length ? `<span class="${kinds.join(' ')}">${esc(text)}</span>` : esc(text)
        }
        let match
        while ((match = pattern.exec(view))) {
          flush(view.slice(last, match.index))
          last = pattern.lastIndex
          const codes = match[1] === '' ? [0] : match[1].split(';').map(Number)
          for (let i = 0; i < codes.length; i++) {
            const c = codes[i]
            if (c === 0)
              state = { fg: null, bold: false, faint: false, reverse: false, underline: false }
            else if (c === 1) state.bold = true
            else if (c === 2) state.faint = true
            else if (c === 22) state.bold = state.faint = false
            else if (c === 4) state.underline = true
            else if (c === 24) state.underline = false
            else if (c === 7) state.reverse = true
            else if (c === 27) state.reverse = false
            else if (c === 39) state.fg = null
            else if (FG[c]) state.fg = FG[c]
            else if (c >= 90 && c <= 97) state.fg = 'h' + FG[c - 60]
            else if (c === 38 && codes[i + 1] === 5) i += 2
            else if (c === 38 && codes[i + 1] === 2) i += 4
          }
        }
        // Lo que no es SGR (mover el cursor) no deberia llegar; si llega, afuera.
        flush(view.slice(last).replace(/\x1b\[[0-9;?]*[A-Za-z]/g, ''))
        return html
      }

      function drawTerm() {
        termDirty = false
        if (session) term.innerHTML = sgrToHtml(session.frame())
      }

      function setTerm(on) {
        if (on === termShown) return
        termShown = on
        term.hidden = !on
        if (on) {
          // Lo que estaba sostenido no sigue caminando detras de la pantalla.
          mover.held.clear()
          fitTerm()
          termDirty = true
        }
      }

      // La letra mas grande con la que entran 64 columnas y 18 filas (lo minimo
      // que dibuja el juego bien), y el juego se acomoda a lo que entra.
      let cell = null
      function measureCell() {
        const probe = document.createElement('span')
        probe.style.cssText = 'position:absolute;visibility:hidden;font-size:100px;line-height:1.2'
        probe.textContent = 'M'.repeat(20)
        term.append(probe)
        const box = probe.getBoundingClientRect()
        probe.remove()
        return box.width ? { w: box.width / 20 / 100, h: box.height / 100 } : null
      }
      function fitTerm() {
        if (term.hidden || !session) return
        if (!cell) cell = measureCell()
        if (!cell) return
        const width = term.clientWidth - 24
        const height = term.clientHeight - 20
        let px = 15
        while (px > 8 && (width / (cell.w * px) < 64 || height / (cell.h * px) < 18)) px--
        term.style.fontSize = px + 'px'
        const cols = Math.max(64, Math.floor(width / (cell.w * px)))
        const rows = Math.max(16, Math.floor(height / (cell.h * px)))
        if (cols === termCols && rows === termRows) return
        termCols = cols
        termRows = rows
        session.resize(cols, rows)
      }
      window.addEventListener('resize', () => fitTerm())

      // --- Moverse ----------------------------------------------------------

      // Cada paso es una tecla para el juego, al ritmo del paso elegido: una celda
      // mide 0,5 m de ancho y 1 m de alto, asi que al correr van unas 14 columnas
      // o 7 filas por segundo. Hay 8 direcciones: en diagonal un paso mueve los
      // dos ejes juntos y el siguiente solo el horizontal, dos columnas por fila,
      // que en el mapa es en serio a 45 grados, a la misma velocidad que derecho.
      // Un eje que no se movio (una pared, un NPC) queda frenado un rato: se
      // desliza por el otro y no se repite la tecla, para no llenar el registro.
      const mover = {
        held: new Set(),
        fingers: new Map(),
        wait: 0,
        phase: 0,
        last: null,
        blockedX: 0,
        blockedY: 0
      }
      // Las cuatro flechas del teclado y, en la cruceta, tambien las diagonales.
      const DIRS = {
        up: [0, -1],
        down: [0, 1],
        left: [-1, 0],
        right: [1, 0],
        'up-left': [-1, -1],
        'up-right': [1, -1],
        'down-left': [-1, 1],
        'down-right': [1, 1]
      }
      const MOVES = {
        ArrowUp: 'up',
        w: 'up',
        ArrowDown: 'down',
        s: 'down',
        ArrowLeft: 'left',
        a: 'left',
        ArrowRight: 'right',
        d: 'right'
      }
      function heading(held, fingers) {
        // En tercera persona el joystick usa el angulo del pulgar, no su sector:
        // se redondea una sola vez, ya girado con la camara.
        if (
          !held.size &&
          stickAngle !== null &&
          stickId !== null &&
          fingers.has(stickId) &&
          settings.camera === 'third' &&
          world
        ) {
          // Angulo de pantalla: 0 a la derecha, y hacia abajo; arriba es -PI/2.
          rawForward = Math.abs(wrap(stickAngle + Math.PI / 2)) < Math.PI / 8
          return turnToCamera(Math.cos(stickAngle), Math.sin(stickAngle), true)
        }
        let dx = 0
        let dy = 0
        for (const dir of [...held, ...fingers.values()]) {
          if (!DIRS[dir]) continue
          dx += DIRS[dir][0]
          dy += DIRS[dir][1]
        }
        const sx = Math.sign(dx)
        const sy = Math.sign(dy)
        rawForward = sx === 0 && sy < 0
        return turnToCamera(sx, sy, false)
      }
      // Adelante (W, la flecha o el joystick hacia arriba) es hacia donde mira la
      // camara: la direccion se gira con ella y vuelve a una de las 8 del juego.
      // Con la camara mirando al norte (la vista 2.5D de siempre) no cambia nada.
      // sticky: el sector anterior se queda cerca de su borde (el joystick).
      function turnToCamera(dx, dy, sticky) {
        if (!dx && !dy) {
          steerYaw = null
          lastSector = null
          return [0, 0]
        }
        // Solo en tercera persona y con un mapa 3D: en la cripta, los campamentos
        // o la pantalla de texto la camara de fondo gira sola y torceria las flechas.
        if (settings.camera !== 'third' || !world) {
          steerYaw = null
          return [Math.sign(dx), Math.sign(dy)]
        }
        const yaw = Math.atan2(
          controls.target.x - camera.position.x,
          camera.position.z - controls.target.z
        )
        const wx = dx * Math.cos(yaw) - dy * Math.sin(yaw)
        const wy = dx * Math.sin(yaw) + dy * Math.cos(yaw)
        const angle = Math.atan2(wy, wx)
        let sector = (Math.round(angle / (Math.PI / 4)) * Math.PI) / 4
        if (
          sticky &&
          lastSector !== null &&
          Math.abs(wrap(angle - lastSector)) < Math.PI / 8 + 0.14
        )
          sector = lastSector
        lastSector = sticky ? sector : null
        const out = [Math.round(Math.cos(sector)), Math.round(Math.sin(sector))]
        steerYaw = rawForward ? Math.atan2(out[0], out[1]) : null
        return out
      }
      const placeOfCell = (st) => (st.location ? st.location.mapId || st.field : '')
      function exploring(st) {
        return !!st && !st.title && !st.naming && !st.overlay && !paused
      }

      // El paso que toca: [sx, sy] y cuantos metros avanza sobre la recta de la
      // direccion (para que la diagonal vaya a la misma velocidad que derecho).
      function nextStep(dx, dy, state) {
        const now = performance.now()
        const freeX = dx && now >= (state.blockedX || 0)
        const freeY = dy && now >= (state.blockedY || 0)
        if (dx && dy && freeX && freeY) {
          const both = state.phase++ % 2 === 0
          const sx = dx
          const sy = both ? dy : 0
          return [sx, sy, (CX + (both ? CZ : 0)) * Math.SQRT1_2]
        }
        const sx = freeX ? dx : 0
        const sy = freeY ? dy : 0
        return [sx, sy, Math.abs(sx) * CX + Math.abs(sy) * CZ]
      }

      // Las puertas y salidas del juego miden una celda (0,5 m) aunque el porton
      // 3D se vea ancho, y los caminos que llegan son de tres. Si el paso empuja
      // contra algo que no se cruza y a una o dos celdas al costado hay una puerta
      // o un paso libre hacia adelante, el heroe se corre hacia ese lado: entrar
      // no exige apuntar a la celda justa. Las reglas no cambian: solo se elige
      // que tecla mandar.
      function cellRules() {
        const runa = session && session.runa
        if (!runa) return null
        const f = runa.field
        if (f && f.player) {
          const exits = [f.gate, f.noxGate, f.dungeonEntrance, f.worldBossPortal].filter(Boolean)
          const inside = (x, y) => x >= 0 && y >= 0 && x < f.width && y < f.height
          return {
            x: f.player.x,
            y: f.player.y,
            open: (x, y) =>
              inside(x, y) && !f.settlementStructureAt(x, y) && !(f.boss && f.boss.occupies(x, y)),
            door: (x, y) => !!f.settlementAt(x, y) || exits.some((e) => e.x === x && e.y === y)
          }
        }
        const w = runa.walker
        if (!w || typeof w.peek !== 'function') return null
        return {
          x: w.x,
          y: w.y,
          open: (x, y) => !w.peek(x - w.x, y - w.y).solid,
          door: (x, y) => !!w.peek(x - w.x, y - w.y).enter
        }
      }
      function nudge(dx, dy) {
        if (!dx === !dy) return null
        const c = cellRules()
        if (!c || c.open(c.x + dx, c.y + dy)) return null
        // Una puerta a una o dos celdas al costado (o justo delante de esa celda)
        // gana; si no hay puerta, solo se corrige una celda para doblar una esquina.
        let best = null
        for (const k of [1, 2]) {
          for (const side of [-1, 1]) {
            const ox = dy ? side : 0
            const oy = dx ? side : 0
            let clear = true
            for (let i = 1; i < k; i++) if (!c.open(c.x + ox * i, c.y + oy * i)) clear = false
            if (!clear) continue
            const nx = c.x + ox * k
            const ny = c.y + oy * k
            let rank = null
            if (c.door(nx, ny)) rank = 0
            else if (c.open(nx, ny) && c.door(nx + dx, ny + dy)) rank = 0
            else if (k === 1 && c.open(nx, ny) && c.open(nx + dx, ny + dy)) rank = 1
            if (rank === null) continue
            if (!best || rank < best.rank || (rank === best.rank && k < best.k))
              best = { rank, k, ox, oy }
          }
        }
        return best ? [best.ox, best.oy] : null
      }

      function stepGame(dt, st) {
        // Que eje no se movio con el ultimo paso: una pared o un NPC.
        if (mover.last) {
          const now = performance.now()
          const loc = st.location
          // En un duelo en linea el paso vuelve despues, ordenado por el host: que
          // la celda no haya cambiado todavia no es una pared.
          if (loc && placeOfCell(st) === mover.last.place && !st.duel) {
            if (mover.last.sx && loc.x === mover.last.x) mover.blockedX = now + 450
            if (mover.last.sy && loc.y === mover.last.y) mover.blockedY = now + 450
          }
          mover.last = null
        }
        if (!exploring(st) || (peek && !st.combat && st.world)) {
          mover.wait = 0
          return
        }
        const [dx, dy] = heading(mover.held, mover.fingers)
        if (!dx && !dy) {
          mover.wait = 0
          mover.phase = 0
          return
        }
        mover.wait -= dt
        if (mover.wait > 0) return
        if (mover.wait < -0.1) mover.wait = 0
        // Contra un muro con una puerta cerca: el paso va de costado, hacia ella.
        const side = st.combat || st.duel ? null : nudge(dx, dy)
        if (side) mover.nudgedUntil = performance.now() + 400
        const [sx, sy, meters] = side
          ? [side[0], side[1], Math.abs(side[0]) * CX + Math.abs(side[1]) * CZ]
          : nextStep(dx, dy, mover)
        if (!sx && !sy) {
          mover.wait = 0.05
          return
        }
        const loc = st.location || {}
        // En combate cada tecla hacia el monstruo es un golpe: va una sola.
        const vertical = sy && !(st.combat && sx)
        mover.last = { sx, sy: vertical ? sy : 0, x: loc.x, y: loc.y, place: placeOfCell(st) }
        if (vertical) session.press(sy < 0 ? 'up' : 'down')
        if (sx) session.press(sx < 0 ? 'left' : 'right')
        mover.wait += meters / pace().speed
        // En combate cada paso contra el monstruo es un golpe: uno cada 0,3 s.
        if (st.combat) mover.wait = Math.max(mover.wait, 0.3)
      }

      // --- Teclas ------------------------------------------------------------

      // El tajo del heroe contra el Coloso: el mismo con F, espacio o el boton.
      function strikeFx(st) {
        if (world && world.map === 'boss' && st && st.boss) swingSword()
      }

      function playKey(event, down) {
        if (!session) return
        if (event.key === 'Shift') {
          shiftHeld = down
          return
        }
        if (paused) {
          if (down && event.key === 'Escape') closePause()
          return
        }
        const st = live || session.state()
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key
        const dir = MOVES[key]
        const roaming = exploring(st)
        if (dir && roaming) {
          event.preventDefault()
          if (down) mover.held.add(dir)
          else mover.held.delete(dir)
          return
        }
        if (!down) return
        if (dir) {
          // En una pantalla del juego (tienda, inventario) las flechas mueven el
          // cursor: una tecla por pulsacion, con la repeticion del teclado.
          event.preventDefault()
          if (st.naming && key.length === 1) session.press(event.key)
          else session.press(key.length === 1 ? key : dir)
          return
        }
        if (event.key === 'Escape') {
          event.preventDefault()
          if (peek) peek = false
          // En un duelo tambien abre el menu: rendirse es R, no un Esc al pasar.
          else if (roaming) openPause()
          else session.press('escape')
          return
        }
        // O abre la hoja En linea: la sala, quien mas esta, invitar a un amigo.
        if (key === 'o' && roaming && !event.repeat) {
          event.preventDefault()
          openPause()
          roomPage()
          return
        }
        if (event.key === 'Tab') {
          event.preventDefault()
          if (roaming && st.world) peek = !peek
          else session.press('tab')
          return
        }
        // En la arena del Coloso, F o espacio tambien hacen el tajo del heroe.
        if (key === 'f' || event.key === ' ') strikeFx(st)
        const named = { Enter: 'enter', ' ': 'space', Backspace: 'backspace', Delete: 'delete' }[
          event.key
        ]
        if (named) {
          event.preventDefault()
          session.press(named)
          return
        }
        if (event.key.length === 1) {
          if (event.repeat && !st.naming && !st.overlay) return
          event.preventDefault()
          session.press(event.key)
        }
      }

      // --- El Coliseo en linea ------------------------------------------------
      // Se juega en linea por defecto: al empezar, la partida entra sola a la
      // sala publica (Opciones lo apaga). Una sala privada es un codigo corto
      // para jugar con amigos. Los de la misma sala se ven en la ciudad, se
      // desafian con E y pelean en el Coliseo (juego.js online, sobre WebRTC).

      const roomCodeOf = (value) =>
        String(value || '')
          .toUpperCase()
          .replace(/[^A-Z0-9]/g, '')
          .slice(0, 8)
      // PUBLIC, RUNA y RUNA1, RUNA2... son de la sala publica, no privados.
      const publicLike = (value) => /^(PUBLIC|RUNA|RUNA[1-9]\d?)$/.test(roomCodeOf(value))
      // Lo que pide la direccion: ?sala=public, ?online=1 o ?sala=RUNA3 llevan a
      // la publica ('public'); otro codigo, a esa sala privada.
      function linkedRoom() {
        const params = new URLSearchParams(location.search)
        if (params.get('online') === '1') return 'public'
        const code = roomCodeOf(params.get('room') || params.get('sala'))
        if (!code) return ''
        return publicLike(code) ? 'public' : code
      }
      // Lo que la partida pide al arrancar, y lo que pidio el menu de titulo.
      let wantNet = ''
      // Si wantNet salio de Opciones (entrar solo) y no de un pedido del jugador.
      let wantNetAuto = false
      let wantNetNext = ''
      let roomJoining = ''
      let joinTicket = 0
      // El primer RTCPeerConnection congela la pagina: se paga una sola vez.
      let rtcWarm = false
      const roomOf = () => (session && session.room ? session.room() : null)
      const publicCap = () => (juego && juego.lobby ? juego.lobby.PUBLIC_CAP : 8)

      // --- La sala publica ----------------------------------------------------
      // Sin servidor: se entra a RUNA1, se espera a los que ya estan y, si sobra
      // gente, el recien llegado de id mas alto se muda a la siguiente. Todos
      // calculan lo mismo (juego.lobby.shardVerdict), asi las salas se acomodan.
      // Entrar a mano no cambia Opciones (settings.net): eso solo lo elige ahi.
      let lobby = null
      function goPublic(n = 1) {
        if (!session || !juego || !juego.lobby) return
        stopLobby()
        lobby = { n, since: 0, decided: false, timer: setInterval(lobbyTick, 1000) }
        joinRoom(juego.lobby.publicCode(n), { fresh: true })
      }
      function lobbyTick() {
        if (!lobby || !session) return stopLobby()
        const room = roomOf()
        if (!lobby.since || roomJoining || !room || !room.id) return
        const api = juego.lobby
        const age = performance.now() - lobby.since
        if (age < api.DISCOVER_MS) return
        // Con un desafio o un duelo abierto no se muda nadie: se queda y listo.
        const busy = !!(live && (live.duel || live.invite))
        const verdict = busy
          ? 'stay'
          : api.shardVerdict({ selfId: room.id, fresh: room.fresh, others: room.players })
        if (verdict === 'leave' && lobby.n < api.PUBLIC_SHARDS) return goPublic(lobby.n + 1)
        if (!lobby.decided) {
          lobby.decided = true
          refreshPlayHud(true)
        }
        if (busy || age >= api.SETTLE_MS) {
          session.settle()
          stopLobby()
        }
      }
      function stopLobby() {
        if (lobby) clearInterval(lobby.timer)
        lobby = null
      }

      // Ya en la sala publica (o buscandola): no se vuelve a recorrer.
      function inPublic() {
        const room = roomOf()
        return !!(lobby || (room && room.id && room.public) || publicLike(roomJoining))
      }
      // Con un desafio o un duelo abierto, cambiar de sala lo pierde.
      const duelBusy = () => !!(live && (live.duel || live.invite))

      // Una sala privada: un codigo de la publica lleva a la publica; vacio, nada.
      function joinPrivate(value) {
        const code = roomCodeOf(value)
        if (!code) return
        if (publicLike(code)) return inPublic() ? undefined : goPublic()
        const room = roomOf()
        if (roomJoining === code || (room && room.id && !room.error && room.code === code)) return
        stopLobby()
        settings.room = code
        keepSettings()
        joinRoom(code)
      }

      // Un codigo privado al azar, sin letras que se confundan al dictarlo.
      function randomCode() {
        const abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'
        let code = ''
        while (!code || publicLike(code)) {
          code = ''
          for (let i = 0; i < 4; i++) code += abc[Math.floor(Math.random() * abc.length)]
        }
        return code
      }

      // Invitar a un amigo: el link a una sala privada (la de ahora, o una nueva).
      // share y el portapapeles piden el toque del jugador: van antes de entrar,
      // y se cambia de sala recien cuando el link salio (compartido, copiado o
      // mostrado). Fuera de http (Steam, runa://game) el link es el del sitio.
      const SITE = 'https://playruna.vercel.app/jugar'
      function inviteFriend() {
        const room = roomOf()
        const mine = room && room.id && !room.public ? room.code : ''
        if (!mine && duelBusy()) return
        const code = mine || randomCode()
        const base = /^https?:$/.test(location.protocol)
          ? location.origin + location.pathname
          : SITE
        const url = base + '?sala=' + code
        const enter = () => {
          if (!mine) joinPrivate(code)
          if (pausePage === 'room') roomPage()
        }
        const copied = () => {
          say(L('Link copied: send it to a friend', 'Link copiado: mandaselo a un amigo'))
          enter()
        }
        const shown = () => {
          say(L('Send this link: ', 'Manda este link: ') + url)
          enter()
        }
        const copy = () => {
          if (navigator.clipboard) navigator.clipboard.writeText(url).then(copied, shown)
          else shown()
        }
        try {
          if (navigator.share)
            navigator.share({ url }).then(enter, (error) => {
              // Cancelar la hoja de compartir no cambia nada.
              if (!error || error.name !== 'AbortError') copy()
            })
          else copy()
        } catch {
          shown()
        }
      }

      // Lo que dice la insignia EN LINEA, y su estado para el color.
      function netState(room) {
        if (roomJoining || (lobby && !lobby.decided)) return 'joining'
        if (!room) return 'off'
        return room.id && !room.error ? 'on' : 'error'
      }
      function netLine(room) {
        if ((roomJoining && publicLike(roomJoining)) || (lobby && !lobby.decided))
          return L('Finding a public room...', 'Buscando sala publica...')
        if (roomJoining) return L('Joining room ', 'Entrando a la sala ') + roomJoining + '...'
        if (!room) return L('Offline · Play online', 'Sin conexion · Jugar en linea')
        if (!room.id || room.error)
          return L('No connection · Tap to retry', 'Sin conexion · Toca para reintentar')
        const count = room.players.length + 1
        const on = L('ONLINE', 'EN LINEA')
        // En un telefono parado la etiqueta corta, para que el conteo no baje.
        const pub = innerWidth < 480 ? L('Public', 'Publica') : L('Public room', 'Sala publica')
        if (room.public) return `${on} · ${pub} ${room.public} · ${count}/${publicCap()}`
        const who = count === 1 ? L('player', 'jugador') : L('players', 'jugadores')
        return `${on} · ${L('Room', 'Sala')} ${room.code} · ${count} ${who}`
      }

      // La direccion lleva el codigo de una sala privada, para compartirla; la
      // publica no: al recargar se vuelve a buscar lugar.
      function linkRoom(code) {
        const url = new URL(location.href)
        if (code) url.searchParams.set('room', code)
        else url.searchParams.delete('room')
        url.searchParams.delete('sala')
        url.searchParams.delete('online')
        history.replaceState(null, '', url)
      }

      function joinRoom(code, opts = {}) {
        if (!session) return
        // Sin WebRTC (modo bloqueo de iOS, algunos visores) no hay sala posible.
        if (typeof RTCPeerConnection === 'undefined') {
          stopLobby()
          say(
            L(
              'This browser cannot play online (no WebRTC)',
              'Este navegador no puede jugar en linea (sin WebRTC)'
            )
          )
          refreshPlayHud(true)
          return
        }
        const ticket = ++joinTicket
        roomJoining = code
        refreshPlayHud(true)
        // El primer RTCPeerConnection de la pagina la congela un par de segundos:
        // se pinta el aviso y recien despues se entra, con la pausa ya pagada.
        setTimeout(() => {
          if (!session || ticket !== joinTicket) return
          if (!rtcWarm) {
            rtcWarm = true
            try {
              new RTCPeerConnection().close()
            } catch {
              // Si falla igual, lo dice el juego al intentar.
            }
          }
          const ok = session.online(code, { fresh: !!opts.fresh })
          roomJoining = ''
          if (ok) {
            linkRoom(publicLike(code) ? '' : code)
            if (lobby && opts.fresh) lobby.since = performance.now()
          } else {
            stopLobby()
            const room = roomOf()
            say(
              L('Could not join the room', 'No pude entrar a la sala') +
                (room && room.error ? ': ' + room.error : '')
            )
          }
          refreshPlayHud(true)
          if (pausePage === 'room') roomPage()
        }, 60)
      }

      function leaveRoom() {
        if (!session) return
        stopLobby()
        joinTicket++
        roomJoining = ''
        session.offline()
        linkRoom('')
        refreshPlayHud(true)
      }

      // Alguien llego a la sala: un aviso con como desafiarlo, uno cada 4 s.
      let arrivalRoom = ''
      let arrivalSeen = new Set()
      let arrivalAt = 0
      let arrivalCheck = 0
      function arrivals() {
        const now = performance.now()
        if (now - arrivalCheck < 1000) return
        arrivalCheck = now
        const room = roomOf()
        if (!room || !room.id) {
          arrivalRoom = ''
          return
        }
        // Al cambiar de sala, los que ya estaban no llegaron: el que llego es uno.
        // Mientras se busca lugar en la publica tampoco se anuncia a nadie.
        if (room.code !== arrivalRoom || (lobby && !lobby.decided)) {
          arrivalRoom = room.code
          arrivalSeen = new Set(room.players.map((peer) => peer.id))
          return
        }
        for (const peer of room.players) {
          if (arrivalSeen.has(peer.id)) continue
          arrivalSeen.add(peer.id)
          if (now - arrivalAt < 4000 || (live && (live.duel || live.invite))) continue
          arrivalAt = now
          const how = touchPad
            ? L('Walk up to them and tap DUEL.', 'Acercate y toca DESAFIAR.')
            : L('Walk up to them and press E to duel.', 'Acercate y apreta E para un duelo.')
          say(L(`${peer.name} joined. ${how}`, `Llego ${peer.name}. ${how}`))
        }
      }

      let roomTimer = 0
      function roomPage() {
        pausePage = 'room'
        clearInterval(roomTimer)
        const done = sheet(pauseSheet, L('Online', 'En linea'), pauseMain)
        const how = touchPad
          ? L('Walk up to one and tap DUEL', 'Acercate a uno y toca DESAFIAR')
          : L('Walk up to one and press E', 'Acercate a uno y apreta E')
        line(
          pauseSheet,
          L(
            `Players in your room meet in the city. ${how}, or challenge from this list; the duel is fought in the Coliseum.`,
            `Los jugadores de tu sala se encuentran en la ciudad. ${how}, o desafialo desde esta lista; el duelo se pelea en el Coliseo.`
          )
        )
        const status = line(pauseSheet, '')
        const room = roomOf()
        // Con un desafio o un duelo abierto no se cambia de sala desde aca: se
        // pierde. Desconectarse lo avisa.
        const busyNow = duelBusy()
        const mineCode = room && room.id && !room.public ? room.code : ''
        if (busyNow) {
          line(
            pauseSheet,
            L(
              'You are in a duel: finish it to change rooms.',
              'Estas en un duelo: terminalo para cambiar de sala.'
            ),
            'note'
          )
        }
        if (!inPublic()) {
          pauseSheet.append(
            button(
              L('Join the public room', 'Entrar a la sala publica'),
              L(
                `Up to ${publicCap()} players, found automatically`,
                `Hasta ${publicCap()} jugadores, se elige sola`
              ),
              () => {
                goPublic()
                roomPage()
              },
              busyNow
            )
          )
        }
        pauseSheet.append(
          button(
            L('Invite a friend', 'Invitar a un amigo'),
            mineCode
              ? L('Copies the link to this room', 'Copia el link a esta sala')
              : L('Copies a link to a new private room', 'Copia un link a una sala privada nueva'),
            () => {
              inviteFriend()
              roomPage()
            },
            busyNow && !mineCode
          )
        )
        const form = document.createElement('form')
        form.className = 'room-box'
        const input = document.createElement('input')
        input.type = 'text'
        input.maxLength = 8
        input.autocomplete = 'off'
        input.spellcheck = false
        input.value = room && room.id && !room.public ? room.code : settings.room || ''
        const label = document.createElement('label')
        label.append(L('Private room code', 'Codigo de sala privada'), input)
        form.append(label)
        const join = document.createElement('button')
        join.type = 'submit'
        join.textContent = L('Join', 'Entrar')
        join.disabled = busyNow
        form.append(join)
        form.addEventListener('submit', (event) => {
          event.preventDefault()
          if (duelBusy()) return
          joinPrivate(input.value)
          roomPage()
        })
        pauseSheet.append(form)
        const list = document.createElement('div')
        list.className = 'room-box'
        pauseSheet.append(list)
        let shown = null
        const paint = () => {
          const now = roomOf()
          status.textContent = netLine(now)
          const busy = !!(live && (live.duel || live.invite))
          const players = now && now.id ? now.players : []
          const key = JSON.stringify([players, busy, settings.lang])
          if (key === shown) return
          shown = key
          list.replaceChildren()
          if (now && now.id && !players.length) {
            line(
              list,
              now.public
                ? L(
                    'Nobody else here yet. Send a friend the link or wait a moment.',
                    'Todavia no hay nadie. Mandale el link a un amigo o espera un momento.'
                  )
                : L('Nobody else yet: share the code.', 'Todavia nadie mas: comparti el codigo.')
            )
          }
          for (const peer of players) {
            const note =
              `${L('level', 'nivel')} ${peer.level} · ${peer.wins}-${peer.losses}` +
              (peer.here ? '' : ' · ' + L('somewhere else', 'en otro lugar'))
            list.append(
              button(
                L('Challenge ', 'Desafiar a ') + peer.name,
                note,
                () => {
                  closePause()
                  if (session) session.challenge(peer.id)
                },
                !peer.here || busy
              )
            )
          }
        }
        paint()
        if ((room && room.id) || roomJoining || lobby) {
          pauseSheet.append(
            button(
              L('Go offline', 'Desconectarse'),
              live && live.duel
                ? L(
                    'You are in a duel: leaving concedes it',
                    'Estas en un duelo: salir es rendirse'
                  )
                : null,
              () => {
                leaveRoom()
                roomPage()
              }
            )
          )
        }
        done()
        // El foco empieza en Volver: un Enter de mas no cambia de sala.
        const first = pauseSheet.lastElementChild
        if (first) first.focus()
        roomTimer = setInterval(() => {
          if (pausePage !== 'room' || pause.hidden) clearInterval(roomTimer)
          else paint()
        }, 1000)
      }

      // --- El menu de la partida ---------------------------------------------

      const pauseSheet = pause.querySelector('.sheet')
      // La hoja abierta del menu: la de la sala se refresca sola mientras esta.
      let pausePage = ''
      function openPause() {
        paused = true
        document.body.classList.add('paused')
        mover.held.clear()
        mover.fingers.clear()
        clearInterval(padRepeat)
        stopStrike()
        stickMode = null
        pause.hidden = false
        pauseMain()
      }
      function closePause() {
        paused = false
        document.body.classList.remove('paused')
        pause.hidden = true
        pausePage = ''
        // El pulgar que sigue apoyado vuelve a mover al heroe en el proximo cuadro.
        stickMode = null
      }
      function pauseMain() {
        pausePage = 'main'
        const done = sheet(pauseSheet, L('Menu', 'Menu'), closePause)
        pauseSheet.append(
          button(L('Back to the game', 'Volver al juego'), L('Esc', 'Esc'), closePause)
        )
        if (live && live.duel) {
          pauseSheet.append(
            button(L('Surrender the duel', 'Rendirse en el duelo'), 'R', () => {
              closePause()
              if (session) session.press('r')
            })
          )
        }
        pauseSheet.append(button(L('Online', 'En linea'), netLine(roomOf()), roomPage))
        pauseSheet.append(
          button(
            L('Combat strategy', 'Estrategia de combate'),
            L(
              'The script your hero follows in every fight',
              'El guion que sigue tu heroe en cada pelea'
            ),
            strategyPage
          )
        )
        if (touchPad && document.fullscreenEnabled) {
          pauseSheet.append(
            button(
              document.fullscreenElement
                ? L('Leave fullscreen', 'Salir de pantalla completa')
                : L('Fullscreen', 'Pantalla completa'),
              null,
              () => {
                const done = document.fullscreenElement
                  ? document.exitFullscreen()
                  : document.documentElement.requestFullscreen()
                Promise.resolve(done)
                  .catch(() => {})
                  .then(closePause)
              }
            )
          )
        }
        pauseSheet.append(
          button(L('Settings', 'Opciones'), null, () => settingsPage(pauseSheet, pauseMain))
        )
        pauseSheet.append(
          button(L('Controls', 'Controles'), null, () => controlsPage(pauseSheet, pauseMain))
        )
        pauseSheet.append(
          button(
            L('Save and quit to title', 'Guardar y salir al titulo'),
            L('The game saves on every step', 'El juego guarda en cada paso'),
            quitToTitle
          )
        )
        pauseSheet.querySelector('button').focus()
        // Aca "volver" es seguir jugando: la hoja principal no lleva el boton.
        void done
      }

      // La estrategia es script.txt, el mismo archivo que en la terminal: el juego
      // la relee sola cuando cambia, aun en medio de una pelea.
      function strategyPage() {
        const done = sheet(pauseSheet, L('Combat strategy', 'Estrategia de combate'), pauseMain)
        line(
          pauseSheet,
          L(
            'Fights run on their own with this script. Lines with ? are conditions; the indented line under one is what to do.',
            'Las peleas corren solas con este guion. Las lineas con ? son condiciones; la de abajo, con sangria, es lo que se hace.'
          )
        )
        const area = document.createElement('textarea')
        area.spellcheck = false
        area.value = session.script.read()
        pauseSheet.append(area)
        const status = line(pauseSheet, '')
        pauseSheet.append(
          button(L('Save the strategy', 'Guardar la estrategia'), null, () => {
            session.script.write(area.value)
            status.className = ''
            status.textContent = L(
              'Saved. The game reloads it on the next tick.',
              'Guardada. El juego la relee en el proximo tick.'
            )
            setTimeout(() => {
              const errors = session ? session.script.errors() : []
              if (!errors.length) return
              status.className = 'error'
              status.textContent = errors
                .map((error) => `${L('line', 'linea')} ${error.line}: ${tr(error.message)}`)
                .join(' · ')
            }, 250)
          })
        )
        done()
        area.focus()
      }

      // --- Botones tactiles ---------------------------------------------------

      // Iconos de trazo (24x24, currentColor): toman el color y el estado del
      // boton, igual en iPhone, Android y Windows.
      const SVG_NS = 'http://www.w3.org/2000/svg'
      const ICONS = {
        sword: 'M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2',
        hand: 'M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-6-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15',
