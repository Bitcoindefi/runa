<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Runa</title>
    <link rel="icon" href="data:," />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.min.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0c;
        --fg: #d8d8d0;
        --dim: #7a7a72;
        --accent: #e0c060;
        --line: #3a3a36;
        --panel: rgba(11, 11, 12, 0.84);
        --hp: #c8483a;
        --xp: #5f9fd0;
        /* Zonas seguras (isla, muesca, barra de inicio); 0 en la PC. */
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
        /* Controles tactiles: escalan con el lado corto de la pantalla. */
        --gut: clamp(10px, 3vmin, 16px);
        --gap: clamp(6px, 2vmin, 10px);
        --btn: clamp(48px, 13.5vmin, 58px);
        --big: calc(var(--btn) * 1.36);
        --chip: 44px;
        --pad: clamp(112px, 32vmin, 148px);
        --ctl-w: calc(2 * var(--btn) + var(--big) + 2 * var(--gap));
        --ctl-h: calc(var(--chip) + var(--btn) + var(--big) + 2 * var(--gap));
        --above-ctl: calc(var(--sab) + var(--gut) + max(var(--ctl-h), var(--pad)) + var(--gap));
        --log-h: 84px;
        --stats-w: min(290px, 36vw);
        --ui-surface: rgba(18, 14, 9, 0.84);
        --ui-surface-press: rgba(52, 40, 16, 0.92);
        --ui-edge: #a8843a;
        --ui-edge-hi: #f0d27a;
        --ui-ink: #efe6cc;
        --ui-label: #cfc4a4;
        --ui-outline: 0 0 0 1px rgba(0, 0, 0, 0.7);
        --ui-drop: 0 6px 14px rgba(0, 0, 0, 0.45);
        --ui-r: 14px;
        --ui-gold-hi: #f6dc8f;
        --ui-gold-lo: #b8862e;
        --ui-gold-ink: #1a1409;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.5 ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      [hidden] {
        display: none !important;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      /* El recorrido libre y el modo que sigue a la terminal. */
      #hud {
        position: fixed;
        inset: 16px 16px auto 16px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        pointer-events: none;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0.1em;
        color: var(--accent);
      }
      #who {
        color: var(--dim);
      }
      #mode {
        color: var(--accent);
      }
      #keys {
        color: var(--dim);
      }
      #gear {
        display: grid;
        grid-template-columns: auto auto;
        gap: 0 12px;
        margin: 0;
        text-align: right;
      }
      #gear dt {
        color: var(--dim);
      }
      #gear dd {
        margin: 0;
        text-align: left;
      }
      /* Un error que de otro modo no se veria: abajo, rojo, se cierra tocandolo. */
      #failure {
        position: fixed;
        left: 8px;
        right: 8px;
        bottom: calc(8px + env(safe-area-inset-bottom));
        z-index: 50;
        padding: 10px 12px;
        border: 1px solid #ff6b5a;
        background: rgba(40, 8, 6, 0.94);
        color: #ffd2cc;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100vw - 32px);
        text-align: center;
        color: var(--accent);
        font-size: 16px;
        letter-spacing: 0.05em;
        opacity: 0;
        transition: opacity 0.4s;
        pointer-events: none;
        z-index: 5;
      }
      #toast.show {
        opacity: 1;
      }
      #hud > div:first-child {
        max-width: min(640px, 70vw);
      }
      #places {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
        pointer-events: auto;
      }
      #places button {
        color: var(--fg);
        background: rgba(11, 11, 12, 0.72);
        border: 1px solid var(--line);
        padding: 4px 8px;
        cursor: pointer;
      }
      #places button[aria-pressed='true'] {
        color: var(--accent);
        border-color: var(--accent);
      }
      #links {
        position: fixed;
        left: 16px;
        bottom: 12px;
        display: flex;
        gap: 16px;
      }
      #links a,
      .credits a {
        color: var(--accent);
      }
      /* El joystick tactil, abajo a la izquierda: la base y la perilla que
         sigue al pulgar. */
      #pad {
        position: fixed;
        left: calc(var(--sal) + var(--gut));
        bottom: calc(var(--sab) + var(--gut));
        width: var(--pad);
        height: var(--pad);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(224, 192, 96, 0.14) 0%, rgba(18, 14, 9, 0.6) 70%);
        border: 2px solid var(--ui-edge);
        box-shadow: var(--ui-outline), var(--ui-drop);
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        z-index: 3;
      }
      #pad .knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(var(--pad) * 0.42);
        height: calc(var(--pad) * 0.42);
        margin: calc(var(--pad) * -0.21) 0 0 calc(var(--pad) * -0.21);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, var(--ui-gold-hi), var(--ui-gold-lo));
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
        pointer-events: none;
        transition: transform 0.12s;
      }
      #pad.held .knob {
        transition: none;
      }
      #rotate {
        position: fixed;
        left: 50%;
        top: calc(10px + var(--sat));
        transform: translateX(-50%);
        z-index: 6;
        padding: 8px 14px;
        border-radius: 14px;
        border: 1px solid var(--accent);
        background: rgba(11, 11, 12, 0.88);
        color: var(--fg);
        font-size: 13px;
        white-space: normal;
        text-align: center;
        width: max-content;
        max-width: calc(100vw - var(--sal) - var(--sar) - 2 * var(--gut));
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      #talk {
        position: fixed;
        left: 50%;
        bottom: 72px;
        transform: translateX(-50%);
        width: min(560px, calc(100vw - 32px));
        background: rgba(11, 11, 12, 0.88);
        border: 1px solid var(--accent);
        padding: 10px 14px;
      }
      #talk strong {
        color: var(--accent);
      }
      #talk p {
        margin: 6px 0 0;
      }
      #talk small,
      #bag small {
        display: block;
        margin-top: 6px;
        color: var(--dim);
      }
      #bag {
        position: fixed;
        right: 16px;
        top: 150px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: min(320px, calc(100vw - 32px));
        background: rgba(11, 11, 12, 0.88);
        border: 1px solid var(--line);
        padding: 10px;
      }
      #bag strong {
        color: var(--accent);
      }
      #bag button {
        text-align: left;
        background: transparent;
        border: 1px solid var(--line);
        padding: 6px 8px;
        cursor: pointer;
      }
      #pad,
      #actions button {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      /* Menu de titulo: a la izquierda, con el Coloso girando detras. */
      #menu {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: minmax(0, 440px);
        align-content: center;
        padding: 24px clamp(16px, 6vw, 80px);
        background: linear-gradient(
          90deg,
          rgba(8, 8, 9, 0.9) 0%,
          rgba(8, 8, 9, 0.6) 40%,
          rgba(8, 8, 9, 0) 72%
        );
        overflow-y: auto;
      }
      .logo {
        margin: 0;
        font-size: clamp(46px, 9vw, 78px);
        line-height: 1.05;
        letter-spacing: 0.3em;
        color: var(--accent);
        text-shadow: 0 0 28px rgba(224, 192, 96, 0.35);
      }
      /* El logo de piedra runica (Higgsfield): el texto queda como alt. */
      .logo img {
        display: block;
        width: min(440px, 86vw);
        height: auto;
        margin-left: -10px;
        filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.6));
      }
      /* El menu principal en un marco de hierro con remaches y filo dorado
         (Higgsfield): las esquinas quedan enteras y los lados repiten sus
         remaches en vez de estirarlos. */
      #menu-main {
        border: 30px solid transparent;
        border-image: url('assets/ui/menu-frame.png') 120 round;
        background: radial-gradient(ellipse at 50% 0%, rgba(60, 44, 22, 0.55), rgba(10, 9, 8, 0.86))
          padding-box;
        padding: 10px 8px;
        gap: 9px;
      }
      #menu-main button {
        background: linear-gradient(180deg, rgba(34, 29, 22, 0.95), rgba(16, 14, 11, 0.95));
        border: 1px solid rgba(224, 192, 96, 0.28);
        border-radius: 3px;
        box-shadow:
          inset 0 1px 0 rgba(255, 220, 150, 0.08),
          0 2px 6px rgba(0, 0, 0, 0.45);
        letter-spacing: 0.04em;
        transition:
          border-color 0.15s,
          box-shadow 0.15s,
          transform 0.15s;
      }
      #menu-main button:hover,
      #menu-main button:focus-visible {
        border-color: rgba(240, 200, 110, 0.9);
        box-shadow:
          inset 0 0 18px rgba(255, 150, 40, 0.18),
          0 0 14px rgba(255, 150, 40, 0.25);
        transform: translateX(3px);
      }
      .tag {
        margin: 6px 0 26px;
        color: var(--dim);
      }
      .choices,
      .sheet {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .choices button,
      .sheet button,
      .sheet a.button {
        text-align: left;
        background: rgba(11, 11, 12, 0.74);
        border: 1px solid var(--line);
        padding: 9px 14px;
        min-height: 44px;
        cursor: pointer;
        text-decoration: none;
        box-sizing: border-box;
      }
      .choices button:hover,
      .choices button:focus-visible,
      .sheet button:hover,
      .sheet button:focus-visible,
      .sheet a.button:hover,
      .sheet a.button:focus-visible {
        border-color: var(--accent);
        color: var(--accent);
        outline: none;
      }
      .choices button small,
      .sheet button small {
        display: block;
        color: var(--dim);
        font-size: 12px;
      }
      .choices button[disabled],
      .sheet button[disabled] {
        opacity: 0.45;
        cursor: default;
        border-color: var(--line);
        color: var(--fg);
      }
      .sheet h2 {
        margin: 0 0 4px;
        font-size: 15px;
        letter-spacing: 0.08em;
        color: var(--accent);
      }
      .sheet p {
        margin: 0;
        color: var(--dim);
      }
      .sheet label {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .sheet input[type='text'],
      .sheet textarea {
        background: #111;
        border: 1px solid var(--line);
        padding: 8px 10px;
      }
      .sheet input[type='text']:focus,
      .sheet textarea:focus {
        border-color: var(--accent);
        outline: none;
      }
      .sheet textarea {
        min-height: 200px;
        resize: vertical;
        white-space: pre;
        font-size: 13px;
      }
      .pick {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .pick button {
        flex: 1 1 140px;
      }
      .pick button[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .sheet .error {
        color: #e07a6a;
      }
      .sheet dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 14px;
        margin: 0;
      }
      .sheet dt {
        color: var(--accent);
      }
      .sheet dd {
        margin: 0;
      }
      .credits {
        margin: 26px 0 0;
        color: var(--dim);
        font-size: 12px;
      }

      /* Jugando: la ficha, el registro del juego y lo que hace la tecla E. */
      #play {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #stats {
        position: absolute;
        left: 16px;
        top: 16px;
        width: min(290px, calc(100vw - 32px));
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 10px 12px;
        box-sizing: border-box;
      }
      /* La mision del rey, debajo de la ficha. */
      #stats .quest {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid var(--line);
        color: var(--accent);
        font-size: 12px;
      }
      #stats .who {
        color: var(--accent);
      }
      #stats .where {
        color: var(--dim);
        font-size: 12px;
        margin-bottom: 4px;
      }
      #stats .xy {
        margin-left: 6px;
        color: var(--accent);
        white-space: nowrap;
      }
      .bar {
        position: relative;
        height: 14px;
        margin-top: 4px;
        background: #1a1a1c;
        border: 1px solid var(--line);
      }
      .bar i {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--hp);
        transition: width 0.25s;
      }
      .bar.xp i {
        background: var(--xp);
      }
      .bar span {
        position: relative;
        display: block;
        padding-left: 6px;
        font-size: 11px;
        line-height: 14px;
      }
      #stats .purse,
      #stats .worn {
        margin-top: 6px;
        font-size: 12px;
        color: var(--dim);
      }
      #stats .worn b {
        font-weight: normal;
        color: var(--fg);
      }
      #bossbar {
        position: absolute;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        width: min(520px, calc(100vw - 340px));
        text-align: center;
        color: #ffb070;
        text-shadow: 0 1px 3px #000;
      }
      #bossbar .bar i {
        background: #ff6a20;
      }
      /* El rival del duelo en linea, donde va la barra del Coloso. */
      #rivalbar {
        position: absolute;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        width: min(520px, calc(100vw - 340px));
        text-align: center;
        color: #ff9a8a;
        text-shadow: 0 1px 3px #000;
      }
      #rivalbar .bar i {
        background: #e0583a;
      }
      /* En linea: la sala y cuantos hay; tocarla abre la hoja de la sala. */
      #stats .online {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        margin-top: 6px;
        padding: 6px 8px;
        min-height: 32px;
        border: 1px solid var(--line);
        border-radius: var(--ui-r);
        background: rgba(0, 0, 0, 0.35);
        color: var(--dim);
        font: inherit;
        font-size: 12px;
        text-align: left;
        cursor: pointer;
        box-sizing: border-box;
      }
      #stats .online::before {
        content: '';
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #777;
      }
      #stats .online[data-state='on'] {
        color: var(--accent);
        border-color: var(--ui-edge);
      }
      #stats .online[data-state='on']::before {
        background: #5fd38a;
        box-shadow: 0 0 6px #5fd38a;
      }
      #stats .online[data-state='joining']::before {
        background: #e0b850;
        animation: net-blink 1s infinite;
      }
      #stats .online[data-state='error']::before {
        background: #e0583a;
      }
      @keyframes net-blink {
        50% {
          opacity: 0.2;
        }
      }
      /* Jugar en linea, en el menu de titulo: borde de oro como lo principal. */
      #menu-main button.online {
        border-color: var(--ui-edge);
        box-shadow:
          inset 0 0 14px rgba(255, 190, 80, 0.14),
          0 2px 6px rgba(0, 0, 0, 0.45);
      }
      #gait {
        position: absolute;
        right: 16px;
        top: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 4px 10px;
        font-size: 12px;
        color: var(--dim);
      }
      #gait b {
        color: var(--accent);
        font-weight: normal;
      }
      #log {
        position: absolute;
        left: 16px;
        bottom: 16px;
        margin: 0;
        padding: 0;
        list-style: none;
        width: min(640px, calc(100vw - 32px));
      }
      #log li {
        width: fit-content;
        max-width: 100%;
        margin-top: 4px;
        padding: 3px 8px;
        background: var(--panel);
        animation: arrive 0.25s ease-out;
      }
      #log li.old {
        opacity: 0.55;
      }
      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      #hint {
        position: absolute;
        left: 50%;
        bottom: 150px;
        transform: translateX(-50%);
        padding: 4px 12px;
        color: var(--accent);
        background: var(--panel);
        border: 1px solid var(--accent);
        white-space: nowrap;
      }
      #hint:empty {
        display: none;
      }
      /* Los botones tactiles, abajo a la derecha. Cuadrados con borde dorado;
         redonda y dorada solo la accion principal (atacar, o usar caminando). */
      #actions {
        position: fixed;
        right: calc(var(--sar) + var(--gut));
        bottom: calc(var(--sab) + var(--gut));
        display: grid;
        grid-template-columns: var(--btn) var(--btn) var(--big);
        grid-template-rows: var(--chip) var(--btn) var(--big);
        grid-template-areas:
          'peek t menu'
          'escape i e'
          'enter gait f';
        gap: var(--gap);
        place-items: center;
        pointer-events: auto;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        z-index: 3;
      }
      #actions button {
        width: var(--btn);
        height: var(--btn);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 0;
        border-radius: var(--ui-r);
        border: 1.5px solid var(--ui-edge);
        background: var(--ui-surface);
        color: var(--ui-ink);
        box-shadow:
          var(--ui-outline),
          inset 0 1px 0 rgba(240, 210, 122, 0.18),
          var(--ui-drop);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 0.06s,
          filter 0.06s,
          opacity 0.15s;
      }
      #actions .ico {
        display: flex;
      }
      #actions .ico svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #actions button small {
        font:
          600 10px/1 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ui-label);
        text-shadow: 0 1px 1px #000;
        max-width: calc(100% - 4px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Texto, Ciudad y Menu son fichas bajas a proposito (44 px, el minimo
         tactil): no son acciones del juego y asi la grilla no sube y tapa menos
         la escena. */
      #actions button[data-act='peek'],
      #actions button[data-act='t'],
      #actions button[data-act='menu'] {
        width: 100%;
        height: var(--chip);
        gap: 2px;
        border-radius: 12px;
      }
      #actions button[data-act='peek'] .ico svg,
      #actions button[data-act='t'] .ico svg,
      #actions button[data-act='menu'] .ico svg {
        width: 18px;
        height: 18px;
      }
      #actions button[data-act='peek'] small,
      #actions button[data-act='t'] small,
      #actions button[data-act='menu'] small {
        font-size: 10px;
      }
      #actions button.primary {
        width: var(--big);
        height: var(--big);
        border-radius: 50%;
        color: var(--ui-gold-ink);
        background: radial-gradient(circle at 35% 28%, var(--ui-gold-hi), var(--ui-gold-lo) 75%);
        border: 2px solid #fff0bf;
        box-shadow:
          0 0 0 2px rgba(20, 14, 4, 0.85),
          0 0 18px rgba(240, 200, 90, 0.35),
          var(--ui-drop);
      }
      #actions button.primary .ico svg {
        width: 32px;
        height: 32px;
        stroke-width: 2.25;
      }
      #actions button.primary small {
        font-size: 11px;
        color: #2a1e07;
        text-shadow: none;
      }
      /* Listo para usar: brilla el borde (sin transform, que es del toque). */
      #actions button.hot {
        animation: act-hot 0.9s ease-in-out infinite alternate;
      }
      @keyframes act-hot {
        to {
          box-shadow:
            0 0 0 2px rgba(20, 14, 4, 0.85),
            0 0 0 5px rgba(246, 220, 143, 0.45),
            0 0 22px rgba(246, 220, 143, 0.6),
            var(--ui-drop);
        }
      }
      #actions button.dim {
        opacity: 0.45;
        filter: saturate(0.3);
      }
      #actions button[data-tone='go'] {
        border-color: #7fd08a;
        color: #c8f2cc;
      }
      #actions button[data-tone='stop'] {
        border-color: #e0583a;
        color: #ffb4a6;
      }
      #actions button[data-tone='go'] small,
      #actions button[data-tone='stop'] small {
        color: inherit;
      }
      #actions button.off {
        visibility: hidden;
        pointer-events: none;
      }
      /* .down lo pone pointerdown: en iOS :active no siempre se aplica. */
      #actions button.down,
      #actions button:active {
        transform: scale(0.92);
        filter: brightness(1.3);
      }
      #actions button:not(.primary).down,
      #actions button:not(.primary):active {
        background: var(--ui-surface-press);
        border-color: var(--ui-edge-hi);
      }
      #actions button[aria-pressed='true'] {
        color: var(--ui-edge-hi);
        border-color: var(--ui-edge-hi);
        background:
          linear-gradient(rgba(240, 210, 122, 0.18), rgba(240, 210, 122, 0.06)), var(--ui-surface);
      }
      #actions button[aria-pressed='true'] small {
        color: var(--ui-edge-hi);
      }
      @media (prefers-reduced-motion: reduce) {
        #actions button {
          transition: none;
        }
        #actions button.hot {
          animation: none;
        }
        #actions button.down {
          transform: none;
        }
      }

      /* La pantalla de texto del juego, cuando el mapa 3D no alcanza. */
      #term {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(1240px, calc(100vw - 24px));
        height: min(820px, calc(100vh - 24px));
        height: min(820px, calc(100dvh - 24px));
        box-sizing: border-box;
        margin: 0;
        padding: 10px 12px;
        overflow: hidden;
        white-space: pre;
        font-size: 14px;
        line-height: 1.2;
        background: rgba(8, 8, 9, 0.97);
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
        z-index: 2;
      }
      #term .b {
        font-weight: 700;
      }
      #term .d {
        opacity: 0.6;
      }
      #term .u {
        text-decoration: underline;
      }
      #term .v {
        background: var(--fg);
        color: var(--bg);
      }
      #term .fk {
        color: #4a4a46;
      }
      #term .fr {
        color: #e07a6a;
      }
      #term .fg {
        color: #7fd36f;
      }
      #term .fy {
        color: #e8c860;
      }
      #term .fb {
        color: #7a9be0;
      }
      #term .fm {
        color: #d97fd9;
      }
      #term .fc {
        color: #6fd3e0;
      }
      #term .fw {
        color: #f0f0e8;
      }
      #term .fhk {
        color: #8a8a82;
      }
      #term .fhr {
        color: #ff9a8a;
      }
      #term .fhg {
        color: #a8f098;
      }
      #term .fhy {
        color: #fff08a;
      }
      #term .fhb {
        color: #a8c0ff;
      }
      #term .fhm {
        color: #ffa8ff;
      }
      #term .fhc {
        color: #a0f0ff;
      }
      #term .fhw {
        color: #ffffff;
      }

      /* El menu dentro de la partida. */
      #pause {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(5, 5, 6, 0.6);
        z-index: 4;
        padding: var(--sat) var(--sar) var(--sab) var(--sal);
        box-sizing: border-box;
      }
      #pause .sheet {
        width: min(460px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        max-height: calc(100dvh - var(--sat) - var(--sab) - 32px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 18px;
        background: rgba(11, 11, 12, 0.95);
        border: 1px solid var(--line);
      }
      /* Lo que no entra se desliza con la hoja, no se aplasta. */
      #pause .sheet > * {
        flex-shrink: 0;
      }
      /* Un grupo dentro de la hoja (el codigo privado, la lista de la sala). */
      .room-box {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* En pantallas tactiles: el texto con fondo y corto, los lugares en una
         fila que se desliza, y la cruceta y los botones a mano. */
      @media (pointer: coarse) {
        #hud > div:first-child,
        #gear {
          background: rgba(11, 11, 12, 0.6);
          padding: 6px 8px;
        }
        #who {
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }
        #places {
          flex-wrap: nowrap;
          overflow-x: auto;
        }
        #places button {
          min-height: 44px;
          white-space: nowrap;
        }
        #links {
          flex-direction: column;
          gap: 8px;
          max-width: calc(100vw - 216px);
          left: calc(var(--sal) + var(--gut));
          bottom: calc(var(--sab) + var(--gut));
        }
        /* En el recorrido el joystick ocupa la esquina: los enlaces suben. */
        body:has(#pad:not([hidden])) #links {
          bottom: calc(var(--sab) + var(--gut) + var(--pad) + var(--gap));
        }
        #links a {
          padding: 6px 0;
        }
        #stats {
          top: calc(var(--sat) + var(--gut));
          left: calc(var(--sal) + var(--gut));
        }
        /* Todo lo de abajo se apoya sobre los controles, nunca encima. */
        #toast,
        #talk,
        #bag,
        #log {
          top: auto;
          bottom: var(--above-ctl);
        }
        #hint {
          top: auto;
          bottom: calc(var(--above-ctl) + var(--log-h) + var(--gap));
        }
        /* El registro no pasa de su alto (la ayuda va encima): se ven las dos
           ultimas lineas enteras, sin una cortada arriba. */
        #log {
          max-height: var(--log-h);
          overflow: hidden;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
        }
        #log li {
          flex: none;
        }
        #log li.old {
          display: none;
        }
        #gait {
          display: none;
        }
        #term {
          top: calc(var(--sat) + 8px);
          bottom: calc(var(--above-ctl) - var(--gap));
          height: auto;
          transform: translateX(-50%);
        }
        /* Con un dialogo abierto el registro no se transparenta detras. */
        body:has(#talk:not([hidden])) :is(#log, #hint, #rotate),
        body:has(#bag:not([hidden])) :is(#log, #hint) {
          visibility: hidden;
        }
        /* El menu de pausa ya tapa los toques: los controles no se ven detras. */
        body.paused :is(#actions, #pad) {
          visibility: hidden;
        }
      }
      @media (pointer: fine) {
        #actions {
          display: none;
        }
      }
      @media (max-width: 640px) {
        /* En pantallas angostas la barra del Coloso va debajo de la ficha. */
        #bossbar,
        #rivalbar {
          top: 150px;
          width: calc(100vw - 32px);
        }
        #gait {
          top: auto;
          bottom: 248px;
        }
        #hint {
          top: 196px;
          bottom: auto;
        }
        #stats {
          width: min(240px, calc(100vw - 32px));
          padding: 6px 8px;
        }
        #stats .worn {
          display: none;
        }
      }
      /* Celular acostado: sin los textos largos, para no tapar al heroe. */
      @media (max-height: 500px) {
        #who,
        #keys,
        #stats .worn,
        #stats .purse {
          display: none;
        }
      }
      /* Celular parado: arriba respeta la isla; abajo, todo se apila sobre los
         controles. */
      @media (pointer: coarse) and (orientation: portrait) {
        #log {
          left: calc(var(--sal) + var(--gut));
          right: calc(var(--sar) + var(--gut));
          width: auto;
          bottom: var(--above-ctl);
          font-size: 12px;
        }
        /* Hasta dos renglones por linea: las dos entran en el alto del registro. */
        #log li {
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }
        #talk,
        #bag {
          left: calc(var(--sal) + var(--gut));
          right: calc(var(--sar) + var(--gut));
          width: auto;
          transform: none;
          top: auto;
          bottom: var(--above-ctl);
          max-height: calc(100dvh - var(--above-ctl) - var(--sat) - 190px);
          overflow-y: auto;
          box-sizing: border-box;
        }
        #toast {
          bottom: calc(var(--above-ctl) + var(--log-h) + var(--gap));
        }
        #hint {
          top: auto;
          bottom: calc(var(--above-ctl) + var(--log-h) + var(--gap));
          max-width: calc(100vw - var(--sal) - var(--sar) - 2 * var(--gut));
          box-sizing: border-box;
          white-space: normal;
          text-align: center;
        }
        #bossbar,
        #rivalbar {
          top: calc(var(--sat) + var(--gut));
          left: calc(var(--sal) + var(--gut));
          right: calc(var(--sar) + var(--gut));
          width: auto;
          transform: none;
        }
        body:has(#bossbar:not([hidden])) #stats,
        body:has(#rivalbar:not([hidden])) #stats {
          top: calc(var(--sat) + var(--gut) + 44px);
        }
      }
      /* Celular acostado: el registro, la ayuda y los dialogos en la columna
         libre entre el joystick y los botones. */
      @media (pointer: coarse) and (max-height: 520px) {
        #stats {
          width: var(--stats-w);
        }
        #bossbar,
        #rivalbar {
          top: calc(var(--sat) + var(--gut));
          left: calc(var(--sal) + var(--gut) + var(--stats-w) + var(--gap));
          right: calc(var(--sar) + var(--gut));
          width: auto;
          transform: none;
          font-size: 12px;
        }
        #log,
        #talk,
        #bag,
        #toast {
          left: calc(var(--sal) + var(--gut) + var(--pad) + var(--gap));
          right: calc(var(--sar) + var(--gut) + var(--ctl-w) + var(--gap));
          bottom: calc(var(--sab) + var(--gut));
          top: auto;
          width: auto;
          max-width: none;
          transform: none;
          box-sizing: border-box;
        }
        #toast {
          bottom: calc(var(--sab) + var(--gut) + var(--log-h) + var(--gap));
        }
        #log {
          font-size: 12px;
        }
        #log li {
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        #talk,
        #bag {
          font-size: 13px;
          max-height: calc(100dvh - var(--sat) - var(--sab) - 2 * var(--gut) - 150px);
          overflow-y: auto;
        }
        #hint {
          top: auto;
          left: auto;
          transform: none;
          right: calc(var(--sar) + var(--gut));
          bottom: calc(var(--sab) + var(--gut) + var(--ctl-h) + var(--gap));
          max-width: var(--ctl-w);
          box-sizing: border-box;
          white-space: normal;
          font-size: 13px;
        }
        /* La pantalla de texto termina antes de la columna de los botones, asi
           Aceptar, Comprar y los demas se leen enteros; el joystick (sin
           letras) queda tenue encima del texto. */
        #term {
          top: calc(var(--sat) + 6px);
          bottom: calc(var(--sab) + 6px);
          left: calc(var(--sal) + 6px);
          right: calc(var(--sar) + var(--gut) + var(--ctl-w) + var(--gap));
          width: auto;
          height: auto;
          transform: none;
        }
        body:has(#term:not([hidden])) #pad {
          opacity: 0.35;
        }
      }
    </style>
  </head>
  <body>
    <header id="hud" hidden>
      <div>
        <h1>[ RUNA ]</h1>
        <div id="who">loading the 3D world...</div>
        <div id="mode"></div>
        <div id="keys"></div>
        <nav id="places" hidden></nav>
      </div>
      <dl id="gear"></dl>
    </header>
    <div id="toast"></div>
    <div id="failure" hidden></div>
    <script>
      // Antes del modulo, para que tambien se vea si el modulo no carga (un
      // navegador viejo): el primer error, abajo y en rojo. En el celular no hay
      // consola donde leerlo.
      ;(() => {
        const box = document.getElementById('failure')
        window.runaFailure = (failure) => {
          const text = failure && (failure.stack || failure.message || String(failure))
          if (!text || !box.hidden) return
          box.textContent = 'Runa: ' + String(text).slice(0, 600)
          box.hidden = false
        }
        box.addEventListener('click', () => (box.hidden = true))
        addEventListener('error', (event) => window.runaFailure(event.error || event.message))
        addEventListener('unhandledrejection', (event) => window.runaFailure(event.reason))
      })()
    </script>
    <div id="talk" hidden></div>
    <aside id="bag" hidden></aside>
    <footer id="links" hidden>
      <a href="models.html">The Tripo models</a>
      <a href="https://github.com/Bitcoindefi/runa">Source and the terminal game</a>
    </footer>

    <section id="menu" hidden>
      <div>
        <h1 class="logo"><img src="assets/ui/logo.png" alt="RUNA" width="900" height="285" /></h1>
        <p class="tag" id="tagline">An ASCII RPG with a 3D world made with Tripo.</p>
      </div>
      <nav id="menu-main" class="choices"></nav>
      <div id="menu-page" class="sheet" hidden></div>
      <p class="credits" id="credits"></p>
    </section>

    <div id="play" hidden>
      <div id="stats"></div>
      <div id="bossbar" hidden></div>
      <div id="rivalbar" hidden></div>
      <div id="gait"></div>
      <ol id="log"></ol>
      <div id="hint"></div>
    </div>
    <div id="actions" hidden></div>
    <pre id="term" hidden></pre>
    <div id="pause" hidden><div class="sheet"></div></div>

    <div id="pad" hidden aria-label="joystick"><div class="knob"></div></div>
    <div id="rotate" hidden></div>
    <script type="module">
      import * as THREE from 'three'
      const showFailure = (failure) => window.runaFailure(failure)
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
      import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js'
      import { buildWorld, label, labels, seeView, CX, CZ } from './mundo.js'
      import { buildTitle } from './titulo.js'
      import { createEffects } from './efectos.js'
      import { createMeadow } from './pradera.js'
      import { createInventory } from './inventario.js'
      import { createShowcase } from './vitrina.js'

      // Runa en 2.5D. Desde el menu de titulo se elige como estar en el mundo:
      //  - Jugar: el juego de la terminal corre entero en esta pagina (juego.js es
      //    lib/ empaquetado con scripts/build-juego.js). La pagina le manda teclas,
      //    dibuja en 3D lo que el juego dice y muestra su pantalla de texto cuando
      //    el mapa 3D no alcanza: inventario, tiendas, la pradera, el combate.
      //  - Recorrer: el mundo 3D sin reglas, para mirar los modelos de Tripo.
      //  - Seguir la terminal: con el juego abierto con --teclas (solo en el visor
      //    local), la pagina lo sigue y le manda teclas.

      const SLOTS = ['left_hand', 'right_hand', 'chest', 'head', 'boots']
      // Items con modelo de Tripo. Un GLB llamado como el id del item
      // (assets/tripo/spear.glb) se usa solo; aca van los alias y sus ajustes.
      const SKINS = {
        // Tripo entrega los modelos mirando hacia +x; el heroe mira hacia +z.
        iron_helmet: { file: 'yelmo.glb', size: 0.46, yaw: -Math.PI / 2, lift: 0.03 },
        // El escudo mira a +x.
        shield: { file: 'shield.glb', size: 0.62, yaw: -Math.PI / 2 },
        // Las armas se paran solas sobre su eje largo (fitWeapon). `size` es el
        // largo al lado de la espada, `grip` donde la agarra la mano (desde la
        // base), `tip` hacia donde apunta la punta en el modelo y `down` que lado
        // va abajo. Las de Tripo Studio llegan inclinadas: la daga con la punta
        // abajo, la lanza hacia -x. El arco se lleva parado (`hold: 'bow'`) y la
        // ballesta apuntando derecho (`hold: 'aim'`).
        sword: { grip: 0.1 },
        dagger: { size: 0.55, grip: 0.17, tip: [1, -1, 1] },
        spear: { size: 1.6, grip: 0.36, tip: [-1, 1, -1] },
        warhammer: { size: 1.05, grip: 0.16 },
        crossbow: { size: 0.8, grip: 0.3, tip: [1, 0, 0], down: [0, -1, 0], hold: 'aim' },
        longbow: { size: 1.25, grip: 0.5, flat: 'x', hold: 'bow' }
      }
      const HERO_FIT = { grow: 1.15, lift: 0.03, back: 0 }
      // Fondos por zona, con modelos de Tripo que ya existen. El del titulo es el
      // Coloso grande detras del heroe, como el menu de la terminal.
      const SCENERY = {
        titulo: { file: 'coloso.glb', size: 6.4, at: [0.4, 0, -5.2], yaw: 0.2 },
        ruinas: { file: 'coloso.glb', size: 3.4, at: [-3, 0, -9], yaw: 0.32 },
        reino: { file: 'paisaje.glb', size: 2.6, at: [0, 0, -6], yaw: 0 }
      }
      const GROUND = {
        titulo: 0x1c0e08,
        reino: 0x16140f,
        pradera: 0x101a10,
        ruinas: 0x1c0e08,
        cripta: 0x0d0d13
      }

      // Opciones de quien juega, en este navegador. Los efectos (brillo, bruma,
      // vineta) van en alto, salvo en pantallas tactiles: ahi cuestan mas.
      const SETTINGS = 'runa:web:settings'
      const settings = {
        lang: 'en',
        run: true,
        camera: 'third',
        shadows: true,
        effects: matchMedia('(pointer: coarse)').matches ? 'low' : 'high',
        // En linea al empezar: 'public' (la sala publica) u 'off'. En Steam
        // (runa://) arranca apagado: se entra a mano desde el titulo o la insignia.
        net: location.protocol === 'runa:' ? 'off' : 'public',
        // Si ya se mostro el aviso de la primera vez en linea (la IP se ve).
        netNoticed: false,
        // La ultima sala privada del Coliseo en linea.
        room: ''
      }
      try {
        Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS) || '{}'))
      } catch {
        // Sin almacenamiento: quedan las de siempre.
      }
      // 'private' (volver a la ultima sala privada) ya no es un modo de arranque:
      // una sala privada se retoma por su link (?room=CODIGO).
      if (!['public', 'off'].includes(settings.net)) settings.net = 'public'
      // RUNA era la sala de todos: ahora es la publica, no una privada (la misma
      // regla que publicLike, mas abajo).
      if (
        /^(PUBLIC|RUNA|RUNA[1-9]\d?)$/.test(
          String(settings.room || '')
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, '')
            .slice(0, 8)
        )
      )
        settings.room = ''
      // La tercera persona llego despues: quien tenia guardada otra vista (la de
      // lejos era la de antes) pasa una vez a la nueva y puede volver en Opciones.
      if (settings.cameraV !== 2) {
        settings.camera = 'third'
        settings.cameraV = 2
      }
      function keepSettings() {
        try {
          localStorage.setItem(SETTINGS, JSON.stringify(settings))
        } catch {
          // Igual se aplican mientras dure la pestana.
        }
      }
      const L = (en, es) => (settings.lang === 'es' ? es : en)
      const pick = (pair) => pair[settings.lang === 'es' ? 1 : 0]

      const who = document.getElementById('who')
      const mode = document.getElementById('mode')
      const gear = document.getElementById('gear')
      const toast = document.getElementById('toast')
      // El sitio publicado (scripts/build-web.js) no tiene visor: no hay
      // terminal que seguir ni partidas de la terminal para copiar.
      const DEMO =
        document.documentElement.dataset.demo === '1' ||
        new URLSearchParams(location.search).has('demo')
      const touchPad = matchMedia('(pointer: coarse)').matches

      // Escena. Sin WebGL no hay nada que dibujar: se avisa en vez de quedar mudo.
      let renderer
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true })
      } catch (error) {
        document.getElementById('hud').hidden = false
        who.textContent = L(
          'This 3D page needs WebGL, and this browser has it turned off.',
          'Este navegador no tiene WebGL: la pagina 3D no puede dibujar.'
        )
        throw error
      }
      // Con 1,5 alcanza para que se vea nitido y no se trabe en pantallas densas.
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5))
      renderer.shadowMap.enabled = settings.shadows
      document.body.prepend(renderer.domElement)
      // Para medir desde la consola cuanto cuesta cada cuadro.
      window.runaInfo = () => ({
        ...renderer.info.render,
        geometries: renderer.info.memory.geometries
      })

      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x0b0b0c)
      scene.fog = new THREE.Fog(0x0b0b0c, 11, 30)
      // Un cuarto neutro para que el metal y los PBR de Tripo tengan que reflejar.
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(
        new RoomEnvironment(),
        0.04
      ).texture
      scene.environmentIntensity = 0.45

      const camera = new THREE.PerspectiveCamera(
        38,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      )
      camera.position.set(0, 1.55, 4.8)
      const controls = new OrbitControls(camera, renderer.domElement)
      controls.target.set(0, 1, 0)
      controls.enableDamping = true
      controls.enablePan = false
      controls.autoRotate = true
      controls.autoRotateSpeed = 0.9
      controls.minDistance = 2.4
      controls.maxDistance = 11
      controls.maxPolarAngle = Math.PI * 0.49
      // Para probar la pagina en un navegador real.
      window.runaView = {
        camera,
        controls,
        // Ajuste en vivo de la pieza de cabeza del heroe, para calibrar `fits`.
        tune(id, values) {
          AVATAR.fits[id] = { ...HERO_FIT, ...AVATAR.fits[id], ...values }
          if (worn.head === id) return refitHead(id)
        },
        head: () => avatarHead.getWorldPosition(new THREE.Vector3()).project(camera),
        // Para calibrar las armas: equipa solo la figura, sin tocar la partida.
        wear: (slot, id) => wear(slot, id ? { id } : null),
        swing: () => swingSword(),
        // Para las capturas: lleva al heroe (solo la figura) a la celda (x, y) del
        // mapa 3D y pone la camara a `dist` metros, a `height` de alto y girada
        // `azimuth` grados desde el sur. La camara lo sigue ahi hasta que se mueva.
        // `face` gira al heroe (grados, 0 mira al sur) y `look` corre el punto que
        // mira la camara, en metros desde el heroe.
        frame(x, y, { dist = 14, height = 8, azimuth = 0, face = null, look = [0, 1, 0] } = {}) {
          if (!world) return false
          const at = world.built.toWorld(x, y)
          heroTarget.copy(at)
          hero.root.position.copy(at)
          if (face !== null) hero.root.rotation.y = THREE.MathUtils.degToRad(face)
          framing.set(...look)
          controls.target.set(at.x + look[0], look[1], at.z + look[2])
          const turn = THREE.MathUtils.degToRad(azimuth)
          camera.position.set(at.x + Math.sin(turn) * dist, height, at.z + Math.cos(turn) * dist)
          return true
        },
        // Prende o apaga los carteles flotantes (nombres, salidas), para las
        // capturas sin interfaz.
        labels(on) {
          scene.traverse((object) => {
            if (object.userData.label) object.visible = on
          })
          return true
        },
        // Donde quedan una celda y el Coloso en el mundo 3D, en metros.
        spot: (x, y) => (world ? world.built.toWorld(x, y).toArray() : null),
        boss() {
          const colossus = world && world.built.colossus && world.built.colossus()
          return colossus ? colossus.getWorldPosition(new THREE.Vector3()).toArray() : null
        }
      }

      const sky = new THREE.HemisphereLight(0xd8d8d0, 0x1a1408, 1.3)
      scene.add(sky)
      const sun = new THREE.DirectionalLight(0xfff1d6, 2.4)
      sun.position.set(3, 6, 4)
      sun.castShadow = true
      sun.shadow.mapSize.set(1024, 1024)
      scene.add(sun)
      const ember = new THREE.PointLight(0xe0c060, 5, 9)
      ember.position.set(-2, 2.2, -1.5)
      scene.add(ember)

      // Como llega cada cuadro a la pantalla (bloom, vineta), y el cielo, la
      // niebla y las luces de cada mapa: efectos.js.
      const effects = createEffects({
        renderer,
        scene,
        camera,
        settings,
        lights: { sun, sky, ember }
      })
      // Para medir desde la consola: runaEffects.setQuality('low'), y los pases
      // de runaEffects.post().composer.passes se prenden y apagan con enabled.
      window.runaEffects = effects

      const groundMat = new THREE.MeshStandardMaterial({ color: GROUND.reino, roughness: 1 })
      const ground = new THREE.Mesh(new THREE.CircleGeometry(9, 64), groundMat)
      ground.rotation.x = -Math.PI / 2
      ground.receiveShadow = true
      scene.add(ground)
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0xe0c060,
        transparent: true,
        opacity: 0.5
      })
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.62, 0.66, 64), ringMat)
      ring.rotation.x = -Math.PI / 2
      ring.position.y = 0.003
      scene.add(ring)

      // Materiales
      const chalk = new THREE.MeshStandardMaterial({ color: 0xd8d8d0, roughness: 0.65 })
      const metal = (color = 0xb8bec8) =>
        new THREE.MeshStandardMaterial({ color, metalness: 0.85, roughness: 0.3 })
      const wood = () => new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.8 })
      const hide = () => new THREE.MeshStandardMaterial({ color: 0x7a4a26, roughness: 0.9 })
      const rune = () =>
        new THREE.MeshStandardMaterial({
          color: 0xe0c060,
          emissive: 0xe0a030,
          emissiveIntensity: 0.7
        })

      function part(geometry, material, x = 0, y = 0, z = 0) {
        const mesh = new THREE.Mesh(geometry, material)
        mesh.position.set(x, y, z)
        mesh.castShadow = true
        return mesh
      }

      // Un hueso que cuelga hacia abajo desde su pivote.
      function bone(length, radius, skin = chalk) {
        const pivot = new THREE.Group()
        pivot.add(part(new THREE.CapsuleGeometry(radius, length, 6, 12), skin, 0, -length / 2))
        const end = new THREE.Group()
        end.position.y = -length - radius
        pivot.add(end)
        return { pivot, end }
      }

      // El stickman: +y arriba y la cara hacia +z. Su izquierda queda en +x.
      function stickman(skin = chalk) {
        const root = new THREE.Group()
        const hips = new THREE.Group()
        hips.position.y = 0.95
        root.add(hips)
        const torso = part(new THREE.CapsuleGeometry(0.15, 0.4, 8, 16), skin, 0, 0.32)
        hips.add(torso)
        const head = part(new THREE.SphereGeometry(0.16, 24, 16), skin, 0, 0.86)
        hips.add(head)
        const headSocket = new THREE.Group()
        headSocket.position.y = 0.86
        hips.add(headSocket)

        const arms = {}
        for (const [slot, side] of [
          ['left_hand', 1],
          ['right_hand', -1]
        ]) {
          const upper = bone(0.27, 0.05, skin)
          upper.pivot.position.set(0.23 * side, 0.56, 0)
          upper.pivot.rotation.z = 0.18 * side
          hips.add(upper.pivot)
          const lower = bone(0.25, 0.045, skin)
          // El antebrazo apunta hacia adelante, como en guardia.
          lower.pivot.rotation.x = -1.15
          upper.end.add(lower.pivot)
          lower.end.add(part(new THREE.SphereGeometry(0.055, 16, 12), skin))
          // El enchufe deshace la pose del brazo: lo que se cuelga ahi queda con
          // +y hacia arriba y +z hacia adelante.
          const socket = new THREE.Group()
          socket.rotation.set(1.15, 0, -0.18 * side)
          lower.end.add(socket)
          arms[slot] = { shoulder: upper.pivot, socket }
        }

        const feet = []
        const legs = []
        for (const side of [1, -1]) {
          const thigh = bone(0.4, 0.06, skin)
          thigh.pivot.position.set(0.1 * side, 0.02, 0)
          hips.add(thigh.pivot)
          legs.push(thigh.pivot)
          const shin = bone(0.38, 0.05, skin)
          thigh.end.add(shin.pivot)
          // El tobillo queda a 8 cm del suelo: el pie baja 5 para apoyarse.
          const foot = new THREE.Group()
          foot.position.y = -0.05
          shin.end.add(foot)
          foot.add(part(new THREE.BoxGeometry(0.1, 0.06, 0.18), skin, 0, 0, 0.04))
          feet.push(foot)
        }
        return { root, hips, torso, headSocket, arms, feet, legs }
      }

      // Los NPC del mapa sin dibujo propio: una figura del color que usa la terminal.
      const TERMINAL = {
        cyan: 0x6fd3e0,
        green: 0x7fd36f,
        yellow: 0xe8d36f,
        magenta: 0xd97fd9,
        red: 0xe07a6a,
        blue: 0x7a9be0,
        white: 0xd8d8d0,
        gray: 0x9a9a92
      }
      // Una figura liviana: tres mallas que comparten geometria y material, sin
      // sombra. En la ciudad hay 17 NPC y tienen que costar poco.
      const NPC = {
        body: new THREE.CapsuleGeometry(0.17, 0.62, 2, 6),
        head: new THREE.SphereGeometry(0.16, 8, 6),
        legs: new THREE.BoxGeometry(0.26, 0.8, 0.12)
      }
      const npcSkins = {}
      function figure(color) {
        if (!npcSkins[color]) {
          npcSkins[color] = new THREE.MeshStandardMaterial({
            color: TERMINAL[color] || 0xbdb8aa,
            roughness: 0.7
          })
        }
        const skin = npcSkins[color]
        const body = new THREE.Group()
        const torso = new THREE.Mesh(NPC.body, skin)
        torso.position.y = 1.25
        const head = new THREE.Mesh(NPC.head, skin)
        head.position.y = 1.86
        const legs = new THREE.Mesh(NPC.legs, skin)
        legs.position.y = 0.4
        body.add(torso, head, legs)
        // Comparte geometria y material con los demas NPC: el mapa no los libera.
        body.userData.shared = true
        return body
      }

      // Armas y piezas con formas simples, en el marco del enchufe.
      function blade(length, width, guard) {
        const g = new THREE.Group()
        g.add(part(new THREE.CylinderGeometry(0.022, 0.022, 0.15, 8), hide()))
        g.add(part(new THREE.BoxGeometry(guard, 0.03, 0.05), metal(0x8a6d2c), 0, 0.09))
        g.add(part(new THREE.BoxGeometry(width, length, 0.014), metal(), 0, 0.1 + length / 2))
        g.add(
          part(
            new THREE.ConeGeometry(width * 0.72, width * 1.8, 4),
            metal(),
            0,
            0.1 + length + width * 0.9
          )
        )
        return g
      }

      function spear() {
        const g = new THREE.Group()
        g.add(part(new THREE.CylinderGeometry(0.02, 0.02, 1.9, 8), wood(), 0, 0.35))
        g.add(part(new THREE.ConeGeometry(0.05, 0.22, 6), metal(), 0, 1.41))
        g.add(part(new THREE.TorusGeometry(0.03, 0.01, 6, 16), rune(), 0, 1.28))
        return g
      }

      function hammer() {
        const g = new THREE.Group()
        g.add(part(new THREE.CylinderGeometry(0.025, 0.025, 0.8, 8), wood(), 0, 0.22))
        g.add(part(new THREE.BoxGeometry(0.32, 0.16, 0.16), metal(0x8d939b), 0, 0.66))
        g.add(part(new THREE.BoxGeometry(0.33, 0.03, 0.17), rune(), 0, 0.66))
        return g
      }

      function curve(points, radius, material) {
        const path = new THREE.CatmullRomCurve3(
          points.map(([x, y, z]) => new THREE.Vector3(x, y, z))
        )
        return part(new THREE.TubeGeometry(path, 32, radius, 6), material)
      }

      function string(a, b) {
        const geometry = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(...a),
          new THREE.Vector3(...b)
        ])
        return new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: 0xd8d8d0 }))
      }

      function longbow() {
        const g = new THREE.Group()
        // La curva abre hacia afuera (+x), para que de frente se lea como arco.
        const arc = [
          [-0.16, -0.7, 0],
          [0.02, -0.35, 0],
          [0.06, 0, 0],
          [0.02, 0.35, 0],
          [-0.16, 0.7, 0]
        ]
        g.add(curve(arc, 0.018, wood()))
        g.add(string([-0.16, -0.7, 0], [-0.16, 0.7, 0]))
        return g
      }

      function crossbow() {
        const g = new THREE.Group()
        g.add(part(new THREE.BoxGeometry(0.06, 0.07, 0.62), wood(), 0, 0.02, 0.18))
        g.add(
          curve(
            [
              [-0.32, 0.04, 0.38],
              [0, 0.04, 0.5],
              [0.32, 0.04, 0.38]
            ],
            0.016,
            metal()
          )
        )
        g.add(string([-0.32, 0.04, 0.38], [0.32, 0.04, 0.38]))
        return g
      }

      function shield() {
        const g = new THREE.Group()
        const face = part(new THREE.CylinderGeometry(0.3, 0.3, 0.04, 32), wood(), 0, 0.05, 0.07)
        face.rotation.x = Math.PI / 2
        g.add(face)
        const rim = part(new THREE.TorusGeometry(0.3, 0.02, 8, 32), metal(), 0, 0.05, 0.07)
        g.add(rim)
        g.add(part(new THREE.SphereGeometry(0.06, 16, 12), metal(), 0, 0.05, 0.1))
        g.add(part(new THREE.TorusGeometry(0.16, 0.008, 6, 32), rune(), 0, 0.05, 0.095))
        return g
      }

      function cap() {
        const g = new THREE.Group()
        g.add(
          part(
            new THREE.SphereGeometry(0.175, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2),
            hide(),
            0,
            0.01
          )
        )
        return g
      }

      function helmet() {
        const g = new THREE.Group()
        g.add(
          part(
            new THREE.SphereGeometry(0.185, 24, 12, 0, Math.PI * 2, 0, Math.PI / 1.8),
            metal(),
            0,
            0
          )
        )
        g.add(part(new THREE.BoxGeometry(0.03, 0.14, 0.03), metal(), 0, -0.03, 0.18))
        g.add(part(new THREE.SphereGeometry(0.02, 8, 8), rune(), 0, 0.09, 0.16))
        return g
      }

      const BUILD = {
        dagger: () => blade(0.26, 0.04, 0.1),
        sword: () => blade(0.72, 0.05, 0.2),
        spear,
        warhammer: hammer,
        longbow,
        crossbow,
        shield,
        leather_cap: cap,
        iron_helmet: helmet
      }

      // Lo que va sobre el cuerpo: el pecho y las botas se visten, no se cuelgan.
      const ARMOR = {
        leather: () => new THREE.MeshStandardMaterial({ color: 0x7a4a26, roughness: 0.9 }),
        chainmail: () =>
          new THREE.MeshStandardMaterial({ color: 0x8a8f96, metalness: 0.7, roughness: 0.55 }),
        plate: () => metal(0xc8ccd2)
      }

      const hero = stickman()
      scene.add(hero.root)

      // En el mundo camina el heroe de Tripo; el stickman con el equipo cambiable
      // queda para la vitrina. heroe-anim.glb es el heroe rehecho en pose A con
      // Tripo H3.1 desde Higgsfield, con el esqueleto y los clips Idle, Walk y Run
      // que le puso Higgsfield, y ya mira hacia +z. Si no esta, camina heroe.glb,
      // el original: sin esqueleto, mirando hacia +x y con un balanceo al caminar.
      // `fits` ajusta cada pieza de cabeza a ese heroe: cuanto la envuelve, cuanto
      // sube su techo sobre la coronilla y cuanto se corre hacia la nuca.
      const AVATARS = [
        {
          file: 'heroe-anim.glb',
          height: 2.1,
          yaw: 0,
          rigged: true,
          // Calibrado con runaView.tune en Chrome, como el del heroe original.
          // Mas chico que antes: el yelmo tapaba casi toda la cabeza del heroe.
          fits: { iron_helmet: { grow: 1.28, lift: 0.2, back: 0.09 } }
        },
        {
          file: 'heroe.glb',
          height: 2.1,
          yaw: -Math.PI / 2,
          rigged: false,
          // Calibrado con runaView.tune en Chrome: asi envuelve la cabeza cuadrada
          // del heroe, la cara se ve por la abertura y no asoma la vincha.
          fits: { iron_helmet: { grow: 1.55, lift: 0.22, back: 0.12 } }
        }
      ]
      let AVATAR = AVATARS[AVATARS.length - 1]
      // Los pasos, en m/s. `pace` es la velocidad de suelo a la que el clip no
      // patina con el heroe de 2,1 m, medida en sus huesos: el pie apoyado de Walk
      // retrocede a 0,6 m/s y el de Run (Run_02) a 3,4 m/s. `most` limita cuanto
      // se acelera el clip: mas rapido parece una pelicula adelantada, asi que de
      // ahi en adelante el pie desliza un poco. Correr es lo de siempre; Shift
      // esprinta, o corre si se eligio caminar.
      const GAITS = {
        walk: { speed: 1.6, clip: 'Walk', pace: 0.6, most: 2.2 },
        run: { speed: 7, clip: 'Run', pace: 3.4, most: 1.9 },
        sprint: { speed: 9, clip: 'Run', pace: 3.4, most: 2.25 }
      }
      let shiftHeld = false
      function gaitName() {
        if (shiftHeld) return settings.run ? 'sprint' : 'run'
        return settings.run ? 'run' : 'walk'
      }
      const pace = () => GAITS[gaitName()]
      const avatar = new THREE.Group()
      avatar.visible = false
      hero.root.add(avatar)
      // Lo que va en la cabeza tambien lo lleva el heroe de Tripo.
      const avatarHead = new THREE.Group()
      avatar.add(avatarHead)
      // Y lo que va en las manos: un soporte por mano, colgado de su hueso.
      const avatarHands = { left_hand: new THREE.Group(), right_hand: new THREE.Group() }
      avatar.add(avatarHands.left_hand, avatarHands.right_hand)
      const headSize = { width: 0.42, depth: 0.42 }
      let avatarBody = null
      let avatarLoading = null
      const avatarFailed = new Set()
      let mixer = null
      const gaits = {}
      let gait = null
      let gaitClip = ''
      function loadAvatar() {
        if (avatarBody || avatarLoading) return avatarLoading || Promise.resolve()
        const chosen = AVATARS.find(
          (entry) => models.has(entry.file) && !avatarFailed.has(entry.file)
        )
        if (!chosen) return Promise.resolve()
        avatarLoading = loadRig(chosen.file)
          .then(({ object, clips }) => {
            AVATAR = chosen
            object.rotation.y = chosen.yaw
            object.updateMatrixWorld(true)
            const box = new THREE.Box3().setFromObject(object)
            object.scale.multiplyScalar(chosen.height / box.getSize(new THREE.Vector3()).y)
            object.updateMatrixWorld(true)
            const placed = new THREE.Box3().setFromObject(object)
            const mid = placed.getCenter(new THREE.Vector3())
            object.position.x -= mid.x
            object.position.z -= mid.z
            object.position.y -= placed.min.y
            object.traverse((child) => {
              if (child.isMesh) {
                child.castShadow = true
                // El cuadro de un SkinnedMesh es el de la pose de reposo: al caminar
                // los brazos salen de ahi y el recorte lo haria desaparecer.
                if (child.isSkinnedMesh) child.frustumCulled = false
              }
            })
            avatar.add(object)
            avatarBody = object
            // La cabeza se mide en la pose de reposo, antes de animar, y el yelmo se
            // engancha al hueso Head para seguir la animacion.
            findHead(object)
            if (chosen.rigged) {
              const head = object.getObjectByName('Head')
              if (head) head.attach(avatarHead)
              // Cada soporte se pone en la pose de reposo con los ejes que tiene el
              // brazo caido: +y hacia el codo (arriba, con el brazo colgando) y +z
              // al frente del heroe. Despues se cuelga del hueso y sigue la
              // animacion. El arma va en la palma, pasando la muneca hacia los
              // dedos (`reach` del antebrazo desde el codo); el escudo, en el medio
              // del antebrazo.
              avatar.updateMatrixWorld(true)
              const spot = (name) => {
                const bone = object.getObjectByName(name)
                return bone && avatar.worldToLocal(bone.getWorldPosition(new THREE.Vector3()))
              }
              for (const [slot, elbow, wrist, bone, reach] of [
                ['left_hand', 'LeftForeArm', 'LeftHand', 'LeftHand', 1.3],
                ['right_hand', 'RightForeArm', 'RightHand', 'RightForeArm', 0.55]
              ]) {
                const from = spot(elbow)
                const to = spot(wrist)
                const holder = avatarHands[slot]
                const host = object.getObjectByName(bone)
                if (!from || !to || !host) continue
                const up = from.clone().sub(to).normalize()
                const front = new THREE.Vector3(0, 0, 1)
                front.addScaledVector(up, -front.dot(up)).normalize()
                const side = new THREE.Vector3().crossVectors(up, front)
                holder.position.copy(from).lerp(to, reach)
                holder.quaternion.setFromRotationMatrix(
                  new THREE.Matrix4().makeBasis(side, up, front)
                )
                holder.updateMatrixWorld(true)
                host.attach(holder)
                // El giro de reposo, para sumarle el tajo en la pelea.
                holder.userData.base = holder.quaternion.clone()
              }
              mixer = new THREE.AnimationMixer(object)
              for (const name of ['Idle', 'Walk', 'Run']) {
                const clip = THREE.AnimationClip.findByName(clips, name)
                if (clip) gaits[name] = mixer.clipAction(clip)
              }
              setGait('Idle', 1)
            }
            // Lo que ya llevaba en la cabeza se vuelve a medir con su cabeza.
            if (worn.head) refitHead(worn.head)
          })
          .catch((error) => {
            console.warn('sin el heroe de Tripo', chosen.file, error)
            avatarFailed.add(chosen.file)
            avatarLoading = null
          })
        return avatarLoading
      }
      function useAvatar(on) {
        const ready = on && !!avatarBody
        avatar.visible = ready
        hero.hips.visible = !ready
      }
      // Cambia de clip con un fundido corto y acompana la velocidad sin saltos.
      // Sin Run (un heroe-anim.glb viejo) corre con Walk acelerado.
      function setGait(name, scale) {
        let clip = name
        if (!gaits[clip] && clip === 'Run') {
          clip = 'Walk'
          scale = Math.min(3, scale * 2.4)
        }
        const next = gaits[clip]
        if (!next) return
        if (next === gait) {
          next.timeScale += (scale - next.timeScale) * 0.2
          return
        }
        next.reset()
        next.timeScale = scale
        next.fadeIn(gait ? 0.18 : 0).play()
        if (gait) gait.fadeOut(0.18)
        gait = next
        gaitClip = clip
      }

      // La cabeza del heroe de Tripo se mide en la malla: la tapa es lo que queda
      // en el 8% mas alto del cuerpo (el heroe no levanta nada por encima). Con
      // esqueleto se miden los vertices ya deformados por los huesos.
      function findHead(object) {
        avatar.updateMatrixWorld(true)
        const inverse = new THREE.Matrix4().copy(avatar.matrixWorld).invert()
        const toAvatar = new THREE.Matrix4()
        const v = new THREE.Vector3()
        const each = (visit) =>
          object.traverse((child) => {
            if (!child.isMesh) return
            toAvatar.multiplyMatrices(inverse, child.matrixWorld)
            const position = child.geometry.attributes.position
            for (let i = 0; i < position.count; i++) {
              v.fromBufferAttribute(position, i)
              if (child.isSkinnedMesh) child.applyBoneTransform(i, v)
              visit(v.applyMatrix4(toAvatar))
            }
          })
        let top = -Infinity
        each((point) => {
          top = Math.max(top, point.y)
        })
        const box = new THREE.Box3()
        each((point) => {
          if (point.y > top - AVATAR.height * 0.08) box.expandByPoint(point)
        })
        if (box.isEmpty()) return
        const size = box.getSize(new THREE.Vector3())
        headSize.width = size.x
        headSize.depth = size.z
        avatarHead.position.set((box.min.x + box.max.x) / 2, top, (box.min.z + box.max.z) / 2)
        window.runaHead = () => ({ ...avatarHead.position, ...headSize })
      }

      // La pieza para la cabeza del heroe de Tripo envuelve su cabeza. Va dentro
      // de un grupo para que el pop de equipar no le pise la escala.
      async function avatarPiece(id) {
        let object = null
        try {
          object = await tripoPiece(id, 'head', 1)
        } catch (error) {
          console.warn('sin modelo de Tripo para', id, error)
        }
        if (!object && BUILD[id]) object = BUILD[id]()
        if (!object) return null
        const tune = (AVATAR.fits && AVATAR.fits[id]) || HERO_FIT
        object.updateMatrixWorld(true)
        const dims = new THREE.Box3().setFromObject(object).getSize(new THREE.Vector3())
        object.scale.multiplyScalar(
          tune.grow * Math.max(headSize.width / dims.x, headSize.depth / dims.z)
        )
        object.updateMatrixWorld(true)
        const box = new THREE.Box3().setFromObject(object)
        const center = box.getCenter(new THREE.Vector3())
        object.position.x -= center.x
        object.position.z -= center.z + tune.back
        object.position.y += tune.lift - box.max.y
        const holder = new THREE.Group()
        holder.add(object)
        return holder
      }

      // Rearma solo la pieza del heroe de Tripo. Lleva su propio turno: asi el
      // heroe que termina de cargar no le corta el aviso a un equipar en curso.
      let headTicket = 0
      async function refitHead(id) {
        const ticket = ++headTicket
        const fitted = id ? await avatarPiece(id) : null
        if (ticket !== headTicket) return null
        avatarHead.clear()
        if (fitted) avatarHead.add(fitted)
        return fitted
      }

      let chestLayer = null
      function dressChest(id) {
        if (chestLayer) hero.hips.remove(chestLayer)
        chestLayer = null
        if (!id) return
        const material = (ARMOR[id] || ARMOR.leather)()
        chestLayer = new THREE.Group()
        chestLayer.add(part(new THREE.CapsuleGeometry(0.168, 0.4, 8, 16), material, 0, 0.32))
        if (id === 'plate') {
          for (const side of [1, -1]) {
            chestLayer.add(
              part(new THREE.SphereGeometry(0.085, 16, 12), material, 0.21 * side, 0.6)
            )
          }
        }
        hero.hips.add(chestLayer)
        return chestLayer
      }

      let bootLayers = []
      function dressBoots(id) {
        for (const layer of bootLayers) layer.parent.remove(layer)
        bootLayers = []
        if (!id) return
        for (const foot of hero.feet) {
          const boot = part(new THREE.BoxGeometry(0.12, 0.16, 0.21), hide(), 0, 0.05, 0.04)
          foot.add(boot)
          bootLayers.push(boot)
        }
        return bootLayers
      }

      // Modelos de Tripo
      const loader = new GLTFLoader()
      const loaded = new Map()
      let models = new Map()

      // Medido en Chrome recien abierto: el primer pedido puede fallar con "Failed
      // to fetch". Cada pedido se reintenta dos veces antes de rendirse; una
      // respuesta 4xx no se reintenta, porque no va a cambiar.
      const statusOf = (error) => error.status || (error.response && error.response.status) || 0
      async function retry(task, times = 3) {
        let failure
        for (let i = 0; i < times; i++) {
          if (i) await new Promise((resolve) => setTimeout(resolve, 500 * i))
          try {
            return await task()
          } catch (error) {
            failure = error
            if (statusOf(error) >= 400 && statusOf(error) < 500) break
          }
        }
        throw failure
      }
      function httpError(what, response) {
        const error = new Error(what + ' respondio ' + response.status)
        error.status = response.status
        return error
      }

      function loadGltf(file) {
        const key = file + ':' + models.get(file)
        if (!loaded.has(key)) {
          const url = 'assets/tripo/' + encodeURIComponent(file) + '?v=' + models.get(file)
          loaded.set(
            key,
            retry(() => loader.loadAsync(url)).catch((error) => {
              loaded.delete(key)
              throw error
            })
          )
        }
        return loaded.get(key)
      }
      function loadGlb(file) {
        return loadGltf(file).then((gltf) => gltf.scene.clone(true))
      }
      // Un GLB con esqueleto se clona con SkeletonUtils: el clone comun deja la
      // malla atada a los huesos del original.
      function loadRig(file) {
        return loadGltf(file).then((gltf) => ({
          object: SkeletonUtils.clone(gltf.scene),
          clips: gltf.animations
        }))
      }

      // Lleva un GLB al tamano pedido, centrado. Las armas van con fitWeapon.
      function fit(object, size, slot, spec = {}) {
        if (slot === 'left_hand') return fitWeapon(object, size, spec)
        object.updateMatrixWorld(true)
        const longest = Math.max(
          ...new THREE.Box3().setFromObject(object).getSize(new THREE.Vector3()).toArray()
        )
        const holder = new THREE.Group()
        holder.add(object)
        object.scale.multiplyScalar(size / longest)
        object.updateMatrixWorld(true)
        object.position.sub(new THREE.Box3().setFromObject(object).getCenter(new THREE.Vector3()))
        object.traverse((child) => {
          if (child.isMesh) child.castShadow = true
        })
        return holder
      }

      // Un arma parada sobre su eje largo, con la punta hacia +y, la cara ancha
      // hacia +z (se ve desde la camara, que mira desde arriba) y el origen en el
      // agarre: `grip` del largo desde la base. El eje sale de los vertices: el
      // de mayor varianza, afinado entre los centros de sus dos puntas (asi la
      // cabeza del martillo no lo tuerce). `tip` elige la punta, `flat: 'x'` deja
      // la cara de costado (el arco) y `down` dice que lado va abajo.
      function fitWeapon(object, size, spec) {
        object.updateMatrixWorld(true)
        const points = []
        object.traverse((child) => {
          if (!child.isMesh) return
          child.castShadow = true
          const position = child.geometry.attributes.position
          const step = Math.max(1, Math.floor(position.count / 3000))
          for (let i = 0; i < position.count; i += step) {
            points.push(
              new THREE.Vector3().fromBufferAttribute(position, i).applyMatrix4(child.matrixWorld)
            )
          }
        })
        const mean = new THREE.Vector3()
        for (const p of points) mean.add(p)
        mean.divideScalar(points.length)
        const c = [0, 0, 0, 0, 0, 0]
        for (const p of points) {
          const x = p.x - mean.x
          const y = p.y - mean.y
          const z = p.z - mean.z
          c[0] += x * x
          c[1] += x * y
          c[2] += x * z
          c[3] += y * y
          c[4] += y * z
          c[5] += z * z
        }
        const tip = new THREE.Vector3(...(spec.tip || [0, 1, 0])).normalize()
        const axis = tip.clone()
        for (let i = 0; i < 60; i++) {
          axis
            .set(
              c[0] * axis.x + c[1] * axis.y + c[2] * axis.z,
              c[1] * axis.x + c[3] * axis.y + c[4] * axis.z,
              c[2] * axis.x + c[4] * axis.y + c[5] * axis.z
            )
            .normalize()
        }
        const along = points.map((p) => axis.dot(p) - axis.dot(mean))
        let lo = Infinity
        let hi = -Infinity
        for (const t of along) {
          lo = Math.min(lo, t)
          hi = Math.max(hi, t)
        }
        const ends = [new THREE.Vector3(), new THREE.Vector3()]
        const counts = [0, 0]
        points.forEach((p, i) => {
          const k = (along[i] - lo) / (hi - lo)
          const end = k < 0.12 ? 0 : k > 0.88 ? 1 : -1
          if (end < 0) return
          ends[end].add(p)
          counts[end]++
        })
        ends[0].divideScalar(counts[0])
        ends[1].divideScalar(counts[1])
        axis.subVectors(ends[1], ends[0]).normalize()
        if (axis.dot(tip) < 0) axis.negate()
        const stand = new THREE.Quaternion().setFromUnitVectors(axis, new THREE.Vector3(0, 1, 0))
        // El giro sobre el eje: la direccion mas angosta (el filo, el grosor del
        // martillo) se mide en el plano x-z ya parado.
        let xx = 0
        let xz = 0
        let zz = 0
        const q = new THREE.Vector3()
        for (const p of points) {
          q.copy(p).sub(mean).applyQuaternion(stand)
          xx += q.x * q.x
          xz += q.x * q.z
          zz += q.z * q.z
        }
        const wide = 0.5 * Math.atan2(2 * xz, xx - zz)
        let roll = spec.flat === 'x' ? wide - Math.PI / 2 : wide
        if (spec.down) {
          const down = new THREE.Vector3(...spec.down)
            .applyQuaternion(stand)
            .applyAxisAngle(new THREE.Vector3(0, 1, 0), roll)
          if (down.z < 0) roll += Math.PI
        }
        const turn = new THREE.Quaternion()
          .setFromAxisAngle(new THREE.Vector3(0, 1, 0), roll)
          .multiply(stand)
        object.quaternion.premultiply(turn)
        object.updateMatrixWorld(true)
        const box = new THREE.Box3().setFromObject(object)
        const scale = size / (box.max.y - box.min.y)
        object.scale.multiplyScalar(scale)
        // El agarre: sobre la recta entre las dos puntas, a `grip` del largo.
        const line = ends[0].add(ends[1]).multiplyScalar(0.5).applyQuaternion(turn)
        const low = box.min.y + (box.max.y - box.min.y) * (spec.grip ?? 0.3)
        object.position.set(-line.x, -low, -line.z).multiplyScalar(scale)
        const holder = new THREE.Group()
        holder.add(object)
        return holder
      }

      // `size` fija la medida; si no, la de SKINS por `scale` (la mano del heroe
      // de Tripo lleva las piezas mas grandes que el stickman).
      async function tripoPiece(id, slot, size, scale = 1) {
        const spec = { file: id + '.glb', ...SKINS[id] }
        if (!models.has(spec.file)) return null
        const fitted =
          size || (spec.size || { left_hand: 1, right_hand: 0.62, head: 0.46 }[slot] || 0.5) * scale
        const piece = fit(await loadGlb(spec.file), fitted, slot, spec)
        piece.rotation.y = spec.yaw || 0
        piece.position.y += spec.lift || 0
        return piece
      }

      // Equipar
      const worn = {}
      const tokens = {}
      const pops = []

      function pop(shown) {
        for (const object of [shown].flat()) {
          if (!object) continue
          object.scale.setScalar(0.01)
          pops.push({ object, start: performance.now() })
        }
      }

      async function piece(id, slot) {
        try {
          const skinned = await tripoPiece(id, slot)
          if (skinned) return skinned
        } catch (error) {
          console.warn('sin modelo de Tripo para', id, error)
        }
        return BUILD[id] ? BUILD[id]() : part(new THREE.BoxGeometry(0.1, 0.1, 0.1), rune())
      }

      // La pieza en el brazo del heroe de Tripo. Los soportes tienen los ejes del
      // brazo caido (+y arriba, +z al frente): el arma apunta al frente y un poco
      // abajo (como se lleva al correr), la ballesta derecho, el arco parado y el
      // escudo, sobre el antebrazo, mira hacia afuera y adelante.
      // Al tamano del heroe de Tripo (2,1 m y de proporciones gruesas): mas grandes
      // que en el stickman de la vitrina.
      const HAND_SCALE = { left_hand: 1.35, right_hand: 1.53 }
      async function handPiece(id, slot) {
        let object = null
        try {
          object = await tripoPiece(id, slot, 0, HAND_SCALE[slot])
        } catch (error) {
          console.warn('sin modelo de Tripo para', id, error)
        }
        if (!object) object = await piece(id, slot)
        const grip = new THREE.Group()
        grip.add(object)
        const hold = (SKINS[id] && SKINS[id].hold) || ''
        if (slot === 'right_hand') {
          grip.rotation.y = -0.85
          grip.position.set(-0.07, 0, 0.05)
        } else if (hold === 'aim') grip.rotation.x = Math.PI / 2
        else if (hold !== 'bow') grip.rotation.x = Math.PI / 2 + 0.3
        return grip
      }

      async function wear(slot, entry, announce) {
        const id = entry ? entry.id : null
        const token = (tokens[slot] = (tokens[slot] || 0) + 1)
        let shown = null
        if (slot === 'chest') shown = dressChest(id)
        else if (slot === 'boots') shown = dressBoots(id)
        else {
          const socket = slot === 'head' ? hero.headSocket : hero.arms[slot].socket
          const fitting = slot === 'head' ? refitHead(id) : null
          const next = id ? await piece(id, slot) : null
          const inHand = slot !== 'head' && id ? await handPiece(id, slot) : null
          const onAvatar = await fitting
          if (token !== tokens[slot]) return
          socket.clear()
          if (next) socket.add(next)
          if (slot !== 'head') {
            avatarHands[slot].clear()
            if (inHand) avatarHands[slot].add(inHand)
          }
          shown = [next, onAvatar || inHand]
        }
        if (announce && id) {
          pop(shown)
