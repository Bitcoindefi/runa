          'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3',
        bag: 'M4 10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M8 14h8',
        check: 'M20 6 9 17l-5-5',
        x: 'M18 6 6 18M6 6l12 12',
        back: 'M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11',
        flag: 'M5 22V4M5 4h12l-2 4 2 4H5',
        home: 'M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5M10 21v-6h4v6',
        text: 'M4 17l6-6-6-6M12 19h8',
        menu: 'M4 6h16M4 12h16M4 18h16',
        walk: 'm9 18 6-6-6-6',
        run: 'm5 18 6-6-6-6M13 18l6-6-6-6'
      }
      function iconNode(name) {
        const svg = document.createElementNS(SVG_NS, 'svg')
        svg.setAttribute('viewBox', '0 0 24 24')
        svg.setAttribute('aria-hidden', 'true')
        svg.setAttribute('focusable', 'false')
        const path = document.createElementNS(SVG_NS, 'path')
        path.setAttribute('d', ICONS[name])
        svg.append(path)
        return svg
      }
      // Lo que hace E segun lo que hay al lado (nearOf en tripo-estado.js).
      const NEAR_ACT = {
        npc: ['talk', 'Talk', 'Hablar'],
        player: ['sword', 'Duel', 'Desafiar'],
        ranking: ['trophy', 'Ranks', 'Ranking'],
        shop: ['shop', 'Shop', 'Tienda'],
        travel: ['door', 'Go', 'Ir'],
        home: ['door', 'Enter', 'Entrar'],
        church: ['door', 'Enter', 'Entrar'],
        tavern: ['door', 'Enter', 'Entrar']
      }

      let actionsReady = false
      let actionsKey = ''
      const ACT = {}
      // Atacar y usar salen al apoyar el dedo; el resto, con el click.
      const STRIKE_ACTS = new Set(['f', 'e'])
      let strikeRepeat = 0
      function stopStrike() {
        clearInterval(strikeRepeat)
        strikeRepeat = 0
      }

      // Lo mismo que el teclado (playKey), boton por boton.
      function runAct(act) {
        if (!session) return
        const st = live || session.state()
        if (act === 'menu') return paused ? closePause() : openPause()
        if (act === 'gait') {
          settings.run = !settings.run
          applySettings('run')
          return
        }
        if (act === 'peek') {
          if (exploring(st) && st.world) peek = !peek
          return
        }
        if (act === 'escape') {
          if (peek) {
            peek = false
            return
          }
          // El desafio enviado se cancela con N; Esc caminando abre el menu.
          if (exploring(st) && st.invite && st.invite.direction === 'out') return session.press('n')
          // En un duelo abre el menu: rendirse se confirma, no se toca al pasar.
          if (exploring(st)) return openPause()
          return session.press('escape')
        }
        if (act === 'f') strikeFx(st)
        session.press(act)
      }

      function setupActions() {
        if (actionsReady) return
        actionsReady = true
        for (const act of ['peek', 't', 'menu', 'escape', 'i', 'e', 'enter', 'gait', 'f']) {
          const b = document.createElement('button')
          b.type = 'button'
          b.dataset.act = act
          b.style.gridArea = act
          const icon = document.createElement('span')
          icon.className = 'ico'
          const small = document.createElement('small')
          b.append(icon, small)
          ACT[act] = { b, icon, small, iconName: '' }
          const release = () => {
            b.classList.remove('down')
            if (act === 'f') stopStrike()
          }
          b.addEventListener('pointerdown', (event) => {
            b.classList.add('down')
            if (!STRIKE_ACTS.has(act)) return
            event.preventDefault()
            b.setPointerCapture(event.pointerId)
            runAct(act)
            // En el duelo, mantener apretado repite el ataque; la recarga
            // (cooldownLeft) la impone el juego.
            if (act === 'f' && live && live.arena) {
              stopStrike()
              strikeRepeat = setInterval(() => {
                if (!session || paused || !live || !live.arena) return stopStrike()
                runAct('f')
              }, 260)
            }
          })
          b.addEventListener('pointerup', release)
          b.addEventListener('pointercancel', release)
          b.addEventListener('pointerleave', release)
          b.addEventListener('lostpointercapture', release)
          b.addEventListener('contextmenu', (event) => event.preventDefault())
          b.addEventListener('click', (event) => {
            b.blur()
            // Con el dedo, atacar y usar ya salieron en pointerdown; el click
            // solo cuenta si viene del teclado (detail 0).
            if (STRIKE_ACTS.has(act) && event.detail > 0) return
            runAct(act)
          })
          actions.append(b)
        }
        actionsKey = ''
        if (live) syncActions(live)
      }

      // Un boton: visible o no, su icono, su texto (tambien aria-label) y su estado.
      function setAct(act, o) {
        const a = ACT[act]
        if (!a) return
        const show = !!o
        o = o || {}
        a.b.classList.toggle('off', !show)
        a.b.classList.toggle('primary', show && !!o.primary)
        a.b.classList.toggle('dim', show && !!o.dim)
        a.b.classList.toggle('hot', show && !!o.hot)
        a.b.style.gridArea = o.area || act
        a.b.dataset.tone = o.tone || ''
        a.b.tabIndex = show ? 0 : -1
        a.b.setAttribute('aria-hidden', String(!show))
        if (o.icon && o.icon !== a.iconName) {
          a.iconName = o.icon
          a.icon.replaceChildren(iconNode(o.icon))
        }
        if (o.label && a.small.textContent !== o.label) {
          a.small.textContent = o.label
          a.b.setAttribute('aria-label', o.label)
        }
        if (o.pressed === undefined) a.b.removeAttribute('aria-pressed')
        else a.b.setAttribute('aria-pressed', String(o.pressed))
      }

      // Los botones muestran solo lo que el juego acepta ahora. Se ocultan con
      // visibility (.off): los demas no se mueven de lugar.
      function syncActions(st) {
        if (!actionsReady || actions.hidden || !st) return
        const arena = st.arena
        const inv = st.invite
        const near = st.near
        const inviteIn = !!(inv && inv.direction === 'in')
        const inviteOut = !!(inv && inv.direction === 'out')
        const screenUp = !!(st.title || st.naming || (st.overlay && !inviteIn))
        const bossLive = !!(st.boss && !st.boss.defeated)
        const inReach = !!(arena && arena.distance <= arena.self.reach)
        const loaded = !arena || arena.self.cooldownLeft <= 0
        const key = [
          paused,
          peek,
          screenUp && (st.overlay || 'title'),
          inviteIn,
          inviteOut,
          !!arena,
          inReach,
          loaded,
          st.combat,
          st.field,
          bossLive,
          near ? near.kind + (near.name || '') : '',
          settings.run,
          settings.lang,
          !!st.world
        ].join('|')
        if (key === actionsKey) return
        actionsKey = key
        const roam = !screenUp && !inviteIn
        setAct('menu', { icon: 'menu', label: L('Menu', 'Menu') })
        setAct(
          'gait',
          roam && {
            icon: settings.run ? 'run' : 'walk',
            label: L('Run', 'Correr'),
            pressed: settings.run
          }
        )
        setAct(
          'peek',
          roam && (!!st.world || peek) && { icon: 'text', label: L('Text', 'Texto'), pressed: peek }
        )
        setAct(
          't',
          roam &&
            !arena &&
            st.field === 'field' &&
            !st.combat && { icon: 'home', label: L('Town', 'Ciudad') }
        )
        if (inviteIn) {
          for (const a of ['f', 'e', 'i']) setAct(a, null)
          // Aceptar va en el lugar grande, bajo el pulgar, como Atacar y Usar.
          setAct('enter', {
            icon: 'check',
            label: L('Accept', 'Aceptar'),
            tone: 'go',
            hot: true,
            primary: true,
            area: 'f'
          })
          setAct('escape', { icon: 'x', label: L('Decline', 'Rechazar'), tone: 'stop' })
          return
        }
        if (screenUp) {
          for (const a of ['f', 'e', 'i']) setAct(a, null)
          // El inventario trae sus propios botones y tapa la grilla.
          setAct(
            'enter',
            st.overlay !== 'inventory' && {
              icon: 'check',
              label: st.overlay === 'shop' ? L('Buy', 'Comprar') : L('OK', 'OK')
            }
          )
          setAct('escape', {
            icon: 'back',
            label: st.title || st.naming ? L('Back', 'Volver') : L('Close', 'Cerrar')
          })
          return
        }
        if (arena) {
          setAct('f', {
            icon: 'sword',
            primary: true,
            label: loaded ? L('Attack', 'Atacar') : L('Reload', 'Recarga'),
            hot: inReach && loaded,
            dim: !inReach || !loaded
          })
          setAct('escape', { icon: 'flag', label: L('Give up', 'Rendirse'), tone: 'stop' })
          for (const a of ['e', 'i', 'enter']) setAct(a, null)
          return
        }
        if (st.combat || st.field === 'boss') {
          setAct('f', {
            icon: 'sword',
            primary: true,
            label: st.combat ? L('Attack', 'Atacar') : L('Strike', 'Golpear'),
            hot: st.combat || bossLive,
            dim: !st.combat && !bossLive
          })
          setAct('e', !st.combat && { icon: 'hand', label: L('Use', 'Usar') })
          setAct('i', !st.combat && { icon: 'bag', label: L('Bag', 'Mochila') })
          setAct('enter', null)
          setAct('escape', null)
          return
        }
        // Caminando (ciudad, mapas, pradera o cripta sin pelea): USE pasa al
        // lugar grande y dice que va a hacer.
        const [icon, en, es] = (near && NEAR_ACT[near.kind]) || ['hand', 'Use', 'Usar']
        setAct('f', null)
        setAct('e', {
          icon,
          label: L(en, es),
          primary: true,
          area: 'f',
          hot: !!near,
          dim: !near && !st.field
        })
        setAct('i', { icon: 'bag', label: L('Bag', 'Mochila') })
        setAct('enter', null)
        setAct('escape', inviteOut && { icon: 'x', label: L('Cancel', 'Cancelar'), tone: 'stop' })
      }

      // --- Recorrer: el mundo 3D sin reglas ----------------------------------

      // En las ruinas se arranca a 10 m del Coloso, para que se vea apenas se llega.
      // En la ciudad, en el pasto a la derecha de Elian (160,132): se ven los dos,
      // los nombres no se pisan y ya aparece la ayuda para hablarle.
      const PLACES = [
        {
          map: 'city',
          short: ['City', 'Ciudad'],
          name: ['The city of RUNA', 'La ciudad de RUNA'],
          at: [164, 132]
        },
        {
          map: 'nox',
          short: ['NOX', 'NOX'],
          name: ['NOX, the rival kingdom', 'NOX, el reino rival'],
          at: [160, 130]
        },
        {
          map: 'castle',
          short: ['Castle', 'Castillo'],
          name: ['The castle', 'El castillo'],
          at: [56, 17]
        },
        {
          map: 'coliseum',
          short: ['Coliseum', 'Coliseo'],
          name: ['The Coliseum, for duels', 'El Coliseo, para los duelos'],
          at: [64, 26]
        },
        {
          map: 'boss',
          short: ['Colossus', 'Coloso'],
          name: [
            'Volcanic ruins: the Runic Colossus, the world boss',
            'Ruinas volcanicas: el Coloso runico, el jefe del mundo'
          ],
          at: [84, 22]
        },
        // La pradera, si pradera.js la arma: arranca donde diga su mapa (start).
        ...(meadow
          ? [
              {
                map: 'field',
                short: ['Meadow', 'Pradera'],
                name: [
                  'The meadow: monsters, camps and the road to the Colossus',
                  'La pradera: monstruos, campamentos y el camino al Coloso'
                ],
                at: null
              }
            ]
          : []),
        {
          map: null,
          short: ['Showcase', 'Vitrina'],
          name: vitrina
            ? [
                'Showcase: the Tripo models, each on its pedestal',
                'Vitrina: los modelos de Tripo, cada uno en su pedestal'
              ]
            : [
                'Showcase: the stickman and the Tripo kingdom',
                'Vitrina: el stickman y el reino de Tripo'
              ]
        }
      ]
      // La mochila del recorrido: lo que se puede probar puesto.
      const DEMO_BAG = [
        { id: 'iron_helmet', name: 'iron rune helmet (Tripo)', slot: 'head' },
        { id: 'sword', name: 'sword', slot: 'left_hand' },
        { id: 'shield', name: 'rune shield', slot: 'right_hand' },
        { id: 'plate', name: 'plate armor', slot: 'chest' },
        { id: 'boots', name: 'leather boots', slot: 'boots' }
      ]
      const GEAR_EN = {
        left_hand: 'weapon',
        right_hand: 'shield',
        chest: 'chest',
        head: 'head',
        boots: 'boots'
      }
      const GEAR_ES = {
        left_hand: 'izq',
        right_hand: 'der',
        chest: 'pecho',
        head: 'casco',
        boots: 'botas'
      }
      // held: flechas del teclado; fingers: la flecha bajo cada dedo en la cruceta.
      const demo = {
        map: undefined,
        data: null,
        x: 0,
        y: 0,
        held: new Set(),
        fingers: new Map(),
        wait: 0,
        phase: 0,
        blockedX: 0,
        blockedY: 0,
        busy: false,
        bag: DEMO_BAG
      }
      const placeButtons = []
      window.runaDemo = () => ({
        screen,
        driver: { tour: 'demo', mirror: 'terminal', play: 'juego' }[screen] || screen,
        place: PLACES.findIndex((entry) => entry.map === demo.map),
        map: world ? world.map : null,
        x: screen === 'play' && live && live.location ? live.location.x : demo.x,
        y: screen === 'play' && live && live.location ? live.location.y : demo.y,
        helmet: worn.head || null,
        onAvatar: avatarHead.children.length,
        avatar: avatar.visible,
        gait: gaitClip,
        timeScale: gait ? Number(gait.timeScale.toFixed(2)) : 0,
        velocity: Number(velocity.toFixed(2)),
        term: termShown,
        overlay: live ? live.overlay : null
      })

      function placeName(map) {
        const place = PLACES.find((entry) => entry.map === map)
        return place ? pick(place.name) : map
      }

      function tileOf(data, x, y) {
        return data.tiles[(data.rows[y] || '')[x]]
      }

      function walkable(data, x, y) {
        if (x < 0 || y < 0 || x >= data.width || y >= data.height) return false
        const ch = (data.rows[y] || '')[x] || ' '
        if (data.kind === 'boss') {
          if ('#~|-+'.includes(ch)) return false
          // El cuerpo del Coloso: world-boss-event.js distanceToBody.
          const boss = data.boss
          return !boss || Math.abs(x - boss.x) > 11 || y < boss.y - 8 || y > boss.y
        }
        const tile = data.tiles[ch]
        if (!tile || tile.solid) return false
        if (!data.npcCells)
          data.npcCells = new Set((data.npcs || []).map((npc) => npc.x + ',' + npc.y))
        return !data.npcCells.has(x + ',' + y)
      }

      // La celda libre mas cercana, por si el punto de partida cae en una pared.
      // Al llegar por un porton se evitan puertas y portones, para no rebotar.
      function nearestWalkable(data, x, y, avoidDoors = false) {
        const ok = (cx, cy) => {
          if (!walkable(data, cx, cy)) return false
          const tile = tileOf(data, cx, cy)
          return !avoidDoors || !(tile && tile.enter)
        }
        const seen = new Set([x + ',' + y])
        const queue = [[x, y]]
        for (let i = 0; i < queue.length; i++) {
          const [cx, cy] = queue[i]
          if (ok(cx, cy)) return [cx, cy]
          for (const [dx, dy] of Object.values(DIRS)) {
            const nx = cx + dx
            const ny = cy + dy
            if (nx < 0 || ny < 0 || nx >= data.width || ny >= data.height) continue
            if (seen.has(nx + ',' + ny)) continue
            seen.add(nx + ',' + ny)
            queue.push([nx, ny])
          }
        }
        return [x, y]
      }

      async function goMap(map, at) {
        const place = PLACES.find((entry) => entry.map === map) || PLACES[0]
        demo.map = map
        demo.held.clear()
        placeButtons.forEach((b) =>
          b.setAttribute('aria-pressed', String(b.dataset.map === String(map)))
        )
        // En la vitrina no se camina: la cruceta se esconde.
        pad.hidden = !touchPad || !map
        talkBox.hidden = true
        if (!map) {
          demo.data = null
          exitWorld()
          // La vitrina de vitrina.js, o la de siempre: el stickman y el reino.
          if (vitrina) vitrina.show(true)
          else setScene('reino')
          mode.textContent = pick(place.name)
          return
        }
        if (vitrina) vitrina.show(false)
        let data
        try {
          data = await mapData(map)
        } catch (error) {
          mode.textContent = L('could not load ', 'no pude cargar ') + pick(place.short)
          console.warn(error)
          return
        }
        if (demo.map !== map || screen !== 'tour') return
        const [x, y] = nearestWalkable(data, ...(at || place.at || data.start || [0, 0]), true)
        Object.assign(demo, { data, x, y })
        await enterWorld({ map, x, y })
        hint()
      }

      // Cada cuadro del recorrido: los pasos, lo que se mueve en la pradera
      // (pradera.js) y la vitrina (vitrina.js) mientras se ve.
      function tourFrame(dt, t) {
        stepDemo(dt)
        if (meadow && world) meadow.update(t, dt, null, world)
        if (vitrina && demo.map === null) vitrina.update(t, dt)
      }

      // Un paso por vez al paso elegido, en 8 direcciones como en una partida
      // (nextStep). Cada eje se prueba por separado, como en la terminal: primero
      // el vertical y despues el horizontal desde la fila nueva. El que choca queda
      // frenado un rato y se sigue por el otro, asi no se cuela entre dos paredes.
      function stepDemo(dt) {
        if (demo.busy || !world || !demo.data || world.map !== demo.map) return
        const [dx, dy] = heading(demo.held, demo.fingers)
        if (!dx && !dy) {
          demo.wait = 0
          demo.phase = 0
          return
        }
        demo.wait -= dt
        if (demo.wait > 0) return
        if (demo.wait < -0.1) demo.wait = 0
        const [sx, sy, meters] = nextStep(dx, dy, demo)
        const free = (cx, cy) => walkable(demo.data, demo.x + cx, demo.y + cy)
        const now = performance.now()
        let my = 0
        let mx = 0
        if (sy) {
          if (free(0, sy)) my = sy
          else demo.blockedY = now + 300
        }
        if (sx) {
          if (free(sx, my)) mx = sx
          else demo.blockedX = now + 300
        }
        if (!mx && !my) {
          demo.wait = 0.05
          return
        }
        demo.x += mx
        demo.y += my
        heroTarget.copy(world.built.toWorld(demo.x, demo.y))
        demo.wait += meters / pace().speed
        arrive()
      }

      // Pisar un porton lleva al otro mapa; pisar una puerta avisa que adentro se
      // juega con "Jugar".
      function arrive() {
        const tile = tileOf(demo.data, demo.x, demo.y)
        const enter = tile && tile.enter
        if (enter && enter.kind === 'travel') travel(enter)
        else if (enter) {
          say(
            tr(tile.name) +
              L(
                ': the inside is played with Play in the menu',
                ': adentro se juega con Jugar, en el menu'
              )
          )
        }
        hint()
      }

      // Se llega al lado del porton que vuelve al mapa de donde se viene, como en la
      // terminal. Los caminos a la pradera o a la cripta no tienen mapa 3D.
      async function travel(enter) {
        if (!PLACES.some((place) => place.map === enter.to)) {
          say(
            L(
              'That road leaves the 3D maps: follow it in a real game.',
              'Ese camino sale de los mapas 3D: seguilo en una partida.'
            )
          )
          return
        }
        demo.busy = true
        try {
          const data = await mapData(enter.to)
          let gate = null
          for (let y = 0; y < data.height && !gate; y++) {
            const row = data.rows[y] || ''
            for (let x = 0; x < row.length; x++) {
              const tile = data.tiles[row[x]]
              if (tile && tile.enter && tile.enter.to === demo.map) {
                gate = [x, y]
                break
              }
            }
          }
          await goMap(enter.to, gate || undefined)
        } catch (error) {
          say(L('could not travel: ', 'no pude viajar: ') + error.message)
        } finally {
          demo.busy = false
        }
      }

      // El NPC mas cercano, a menos de 2,4 m.
      function nearbyNpc() {
        if (!demo.data || !demo.data.npcs) return null
        let best = null
        let bestDistance = 2.4
        for (const npc of demo.data.npcs) {
          const distance = Math.hypot((npc.x - demo.x) * CX, (npc.y - demo.y) * CZ)
          if (distance <= bestDistance) {
            best = npc
            bestDistance = distance
          }
        }
        return best
      }

      function hint() {
        if (!demo.map || screen !== 'tour') return
        const npc = nearbyNpc()
        mode.textContent =
          placeName(demo.map) +
          ` · X:${demo.x} Y:${demo.y}` +
          (npc ? L(' · E: talk to ', ' · E: hablar con ') + tr(npc.name) : '')
      }

      let talkTimer = 0
      function talk() {
        const npc = nearbyNpc()
        if (!npc) {
          say(L('Nobody close enough to talk to.', 'No hay nadie cerca para hablar.'))
          return
        }
        const speaker = document.createElement('strong')
        speaker.textContent = tr(npc.name) + (npc.role ? ', ' + tr(npc.role) : '')
        const words = document.createElement('p')
        words.textContent = npc.line ? '"' + tr(npc.line) + '"' : '...'
        talkBox.replaceChildren(speaker, words)
        if (npc.action === 'shop' || npc.action === 'tavern') {
          const note = document.createElement('small')
          note.textContent = L(
            'Trading happens in a real game: Play, in the menu.',
            'Para comprar hace falta una partida: Jugar, en el menu.'
          )
          talkBox.append(note)
        }
        talkBox.hidden = false
        clearTimeout(talkTimer)
        talkTimer = setTimeout(() => {
          talkBox.hidden = true
        }, 8000)
      }

      function showTourGear() {
        gear.replaceChildren()
        for (const slot of SLOTS) {
          const id = worn[slot]
          const item = id && demo.bag.find((entry) => entry.id === id)
          const dt = document.createElement('dt')
          dt.textContent = (settings.lang === 'es' ? GEAR_ES : GEAR_EN)[slot]
          const dd = document.createElement('dd')
          dd.textContent = id ? (item ? item.name : id) : '-'
          gear.append(dt, dd)
        }
      }

      // Equipar desde la mochila del recorrido cambia lo que se ve, nada mas.
      function equip(item) {
        const off = worn[item.slot] === item.id
        worn[item.slot] = off ? null : item.id
        wear(item.slot, off ? null : item, !off)
        if (off) say(L('took off ', 'te sacaste ') + item.name)
        showTourGear()
      }

      function openBag(show = bagBox.hidden) {
        bagBox.hidden = !show
        if (!show) return
        const title = document.createElement('strong')
        title.textContent = L(
          'Bag: click to equip or take off',
          'Mochila: clic para equipar o sacar'
        )
        bagBox.replaceChildren(title)
        for (const item of demo.bag) {
          const b = document.createElement('button')
          b.textContent = (worn[item.slot] === item.id ? '[x] ' : '[ ] ') + item.name
          b.addEventListener('click', () => {
            b.blur()
            equip(item)
            openBag(true)
          })
          bagBox.append(b)
        }
      }

      function tourKey(event, down) {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key
        if (key === 'Shift') {
          shiftHeld = down
          return
        }
        const dir = MOVES[key]
        if (dir) {
          event.preventDefault()
          if (down) demo.held.add(dir)
          else demo.held.delete(dir)
          return
        }
        if (!down || event.repeat) return
        if (key >= '1' && key <= String(PLACES.length)) goMap(PLACES[Number(key) - 1].map)
        else if (key === 'e') talk()
        else if (key === 'i') openBag()
        else if (key === 'h') equip(DEMO_BAG[0])
        else if (key === 'Escape') {
          if (!bagBox.hidden || !talkBox.hidden) {
            bagBox.hidden = true
            talkBox.hidden = true
          } else showMenu()
        }
      }

      function tourTexts() {
        document.querySelector('#hud h1').textContent = '[ RUNA x TRIPO ]'
        who.textContent = L(
          'The 3D world without rules. The hero, the helmet, the Colossus and the kingdom are Tripo models; Higgsfield rigged and animated the hero.',
          'El mundo 3D sin reglas. El heroe, el yelmo, el Coloso y el reino son modelos de Tripo; Higgsfield le puso esqueleto y animo al heroe.'
        )
        keysLine.textContent = touchPad
          ? L(
              'Joystick: run. Tap a place. ✋: talk. 🎒: bag.',
              'Joystick: correr. Toca un lugar. ✋: hablar. 🎒: mochila.'
            )
          : L(
              `WASD: run (Shift sprints). E: talk. I: bag. H: Tripo helmet. 1-${PLACES.length}: place. Esc: menu.`,
              `WASD: correr (Shift esprinta). E: hablar. I: mochila. H: yelmo de Tripo. 1-${PLACES.length}: lugar. Esc: menu.`
            )
        placeButtons.forEach((b, i) => {
          b.textContent = i + 1 + ' ' + pick(PLACES[i].short)
        })
        const extra = document.querySelectorAll('#places [data-extra]')
        if (extra[0]) extra[0].textContent = L('E talk', 'E hablar')
        if (extra[1]) extra[1].textContent = L('I bag', 'I mochila')
        if (extra[2]) extra[2].textContent = L('Menu', 'Menu')
        showTourGear()
      }

      // Botones de lugar y de accion. Se arman una sola vez.
      let tourReady = false
      function setupTour() {
        if (tourReady) return
        tourReady = true
        const nav = document.getElementById('places')
        // Despues de un clic el boton suelta el foco: si no, Espacio o Enter lo
        // vuelven a apretar.
        const tap = (b, action) =>
          b.addEventListener('click', () => {
            b.blur()
            action()
          })
        PLACES.forEach((place) => {
          const b = document.createElement('button')
          b.dataset.map = String(place.map)
          tap(b, () => goMap(place.map))
          nav.append(b)
          placeButtons.push(b)
        })
        for (const action of [talk, () => openBag(), showMenu]) {
          const b = document.createElement('button')
          b.dataset.extra = '1'
          tap(b, action)
          nav.append(b)
        }
      }

      function startTour() {
        leaveScreen()
        screen = 'tour'
        hud.hidden = false
        setupTour()
        document.getElementById('places').hidden = false
        links.hidden = !DEMO
        // El recorrido arranca con lo que llevaba la partida, o sin nada.
        for (const slot of SLOTS) {
          worn[slot] = null
          wear(slot, null, false)
        }
        tourTexts()
        goMap('city')
      }

      // --- Seguir la terminal (solo en el visor local) ------------------------

      let mirrorTimer = 0
      let mirrorFirst = true
      let mirrorGear = ''
      function startMirror() {
        leaveScreen()
        screen = 'mirror'
        hud.hidden = false
        mirrorFirst = true
        mirrorGear = ''
        document.querySelector('#hud h1').textContent = '[ RUNA ]'
        who.textContent = L(
          'following the terminal game...',
          'siguiendo al juego de la terminal...'
        )
        keysLine.textContent = L(
          'WASD or arrows: walk. E: talk. I: inventory. The keys go to the terminal. Esc twice: menu.',
          'WASD o flechas: caminar. E: hablar. I: inventario. Las teclas van a la terminal. Esc dos veces: menu.'
        )
        clearInterval(mirrorTimer)
        mirrorTimer = setInterval(pollMirror, 200)
        pollMirror()
      }

      async function pollMirror() {
        if (screen !== 'mirror') {
          clearInterval(mirrorTimer)
          return
        }
        let state
        try {
          state = await (await fetch('state.json', { cache: 'no-store' })).json()
        } catch {
          who.textContent = L('the viewer is not answering', 'el visor no responde')
          return
        }
        if (screen !== 'mirror') return
        if (!state.listening) {
          terminalOpen = false
          showMenu()
          say(L('The terminal game closed.', 'El juego de la terminal se cerro.'))
          return
        }
        if (state.empty) {
          who.textContent = state.busy
            ? L('reading the save...', 'leyendo la partida...')
            : L(
                'no saves yet: start a game in the terminal',
                'no hay partidas: entra a una en la terminal'
              )
          return
        }
        who.textContent =
          state.name +
          ', ' +
          L('level ', 'nivel ') +
          state.level +
          ', ' +
          (tr(state.place) || '') +
          (state.world ? ` · X:${state.world.x} Y:${state.world.y}` : '')
        const gearKey = JSON.stringify(state.equipped)
        if (gearKey !== mirrorGear) {
          mirrorGear = gearKey
          gear.replaceChildren()
          for (const slot of SLOTS) {
            const dt = document.createElement('dt')
            dt.textContent = (settings.lang === 'es' ? GEAR_ES : GEAR_EN)[slot]
            const dd = document.createElement('dd')
            dd.textContent = itemName(state.equipped[slot])
            gear.append(dt, dd)
          }
        }
        for (const slot of SLOTS) {
          const id = state.equipped[slot] ? state.equipped[slot].id : null
          if (worn[slot] === id && !mirrorFirst) continue
          worn[slot] = id
          wear(slot, state.equipped[slot], !mirrorFirst)
        }
        if (state.world) enterWorld(state.world)
        else {
          exitWorld()
          setScene(state.scene)
          mode.textContent =
            L('showcase: ', 'vitrina: ') +
            (tr(state.place) || L('this zone', 'esta zona')) +
            L(' has no 3D map yet', ' todavia no tiene mapa 3D')
        }
        mirrorFirst = false
      }

      // Las teclas van a la terminal en fila, en el orden en que se apretaron.
      const TERMINAL_KEYS = {
        ArrowUp: 'up',
        ArrowDown: 'down',
        ArrowLeft: 'left',
        ArrowRight: 'right',
        Enter: 'enter',
        Escape: 'escape',
        Backspace: 'backspace',
        Tab: 'tab',
        ' ': 'space'
      }
      let keyChain = Promise.resolve()
      let lastEscape = 0
      function mirrorKey(event) {
        const key = TERMINAL_KEYS[event.key] || (event.key.length === 1 ? event.key : null)
        if (!key) return
        event.preventDefault()
        if (key === 'escape') {
          // Dos Esc seguidos vuelven al menu; uno solo va al juego.
          if (performance.now() - lastEscape < 400) {
            showMenu()
            return
          }
          lastEscape = performance.now()
        }
        if (key === 'q' || key === 'Q') {
          keysLine.textContent = L(
            'Q closes the game: quit from the terminal.',
            'Q cierra el juego: para salir usa la terminal.'
          )
          return
        }
        keyChain = keyChain.then(async () => {
          try {
            const response = await fetch('key', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-Runa': '1' },
              body: JSON.stringify({ key })
            })
            if (response.status === 409) {
              keysLine.textContent = L(
                'The game is not reading keys: start it with npm.cmd start -- --teclas',
                'El juego no esta leyendo teclas: abrilo con npm.cmd start -- --teclas'
              )
            }
          } catch {
            keysLine.textContent = L('the viewer is not answering', 'el visor no responde')
          }
        })
      }

      // Si la terminal se abre o se cierra mientras se esta en el menu, el menu lo
      // muestra; las partidas de la terminal se ofrecen para copiar.
      async function checkTerminal() {
        if (DEMO || screen === 'mirror') return
        try {
          const state = await (await fetch('state.json', { cache: 'no-store' })).json()
          const open = !!state.listening
          let saves = terminalSaves
          try {
            const response = await fetch('saves.json', { cache: 'no-store' })
            if (response.ok) saves = await response.json()
          } catch {
            // Sin la lista, quedan las de antes.
          }
          const changed =
            open !== terminalOpen || JSON.stringify(saves) !== JSON.stringify(terminalSaves)
          terminalOpen = open
          terminalSaves = saves
          if (changed && screen === 'menu' && menuPage.hidden) mainMenu()
        } catch {
          // El visor no contesta: se vuelve a probar en un rato.
        }
      }

      // --- Teclado, cruceta y arranque -----------------------------------------

      function menuKey(event) {
        const inPage = !menuPage.hidden
        if (event.key === 'Escape' && inPage) {
          event.preventDefault()
          mainMenu()
          return
        }
        if (event.target.closest && event.target.closest('input, textarea')) return
        const list = [...(inPage ? menuPage : menuMain).querySelectorAll('button:not([disabled])')]
        const at = list.indexOf(document.activeElement)
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key
        if (key === 'ArrowDown' || key === 's') {
          event.preventDefault()
          list[(at + 1) % list.length].focus()
        } else if (key === 'ArrowUp' || key === 'w') {
          event.preventDefault()
          list[(at - 1 + list.length) % list.length].focus()
        }
      }

      window.addEventListener('keydown', (event) => {
        if (event.ctrlKey || event.metaKey || event.altKey) return
        const typing = event.target.closest && event.target.closest('input, textarea')
        if (screen === 'menu') return menuKey(event)
        if (typing) {
          if (event.key === 'Escape' && screen === 'play') closePause()
          return
        }
        if (screen === 'play') playKey(event, true)
        else if (screen === 'tour') tourKey(event, true)
        else if (screen === 'mirror') mirrorKey(event)
      })
      window.addEventListener('keyup', (event) => {
        if (screen === 'play') playKey(event, false)
        else if (screen === 'tour') tourKey(event, false)
      })
      window.addEventListener('blur', () => {
        demo.held.clear()
        demo.fingers.clear()
        mover.held.clear()
        mover.fingers.clear()
        shiftHeld = false
      })
      // Cerrar la pagina es dejar la sala: con un duelo abierto, rendirse y
      // avisarle al rival, que se queda con la victoria y vuelve a la ciudad.
      // Va en beforeunload, que corre antes de que Trystero corte sus canales,
      // y otra vez en pagehide por los navegadores que se saltan el primero.
      // Primero la rendicion, y la sala se deja un momento despues: channel.leave()
      // corta los canales enseguida y el aviso se perdia en el camino (el rival
      // salia sin ganador).
      let leaving = 0
      function leaveOnExit() {
        let conceded = false
        try {
          conceded = !!(session && session.concede())
        } catch {
          // El rival lo nota igual por el silencio.
        }
        // Cerrar la pestana no espera a WebRTC: con una rendicion recien enviada se
        // retiene la pagina 200 ms para que el aviso llegue a salir por la red.
        if (conceded) {
          const until = performance.now() + 200
          while (performance.now() < until) {
            // espera activa a proposito
          }
        }
        clearTimeout(leaving)
        leaving = setTimeout(() => {
          try {
            if (session) session.offline()
          } catch {
            // La pagina ya se esta cerrando.
          }
        }, 400)
      }
      window.addEventListener('beforeunload', leaveOnExit)
      window.addEventListener('pagehide', () => {
        leaveOnExit()
        try {
          if (session) session.runa.saveCurrent()
        } catch {
          // Se guardo en el ultimo paso igual.
        }
      })

      // El joystick: la direccion sale del angulo del pulgar respecto del centro,
      // en ocho sectores y con una zona muerta. En una pantalla del juego (una
      // tienda) solo valen cuatro: cada direccion nueva es una tecla, y sostenida
      // se repite.
      const SECTORS = [
        'right',
        'down-right',
        'down',
        'down-left',
        'left',
        'up-left',
        'up',
        'up-right'
      ]
      const knob = pad.querySelector('.knob')
      let stickId = null
      let stickDir = null
      let stickMode = null
      // El angulo del pulgar (fuera de los menus), para caminar en tercera persona.
      let stickAngle = null
      let padRepeat = 0
      const fingersNow = () => (screen === 'play' ? mover.fingers : demo.fingers)
      const inMenu = () => screen === 'play' && session && !exploring(live)
      function stickAt(event) {
        const box = pad.getBoundingClientRect()
        const radius = box.width / 2
        let dx = event.clientX - (box.left + radius)
        let dy = event.clientY - (box.top + radius)
        const dist = Math.hypot(dx, dy)
        const reach = radius - 22
        if (dist > reach) {
          dx *= reach / dist
          dy *= reach / dist
        }
        knob.style.transform = `translate(${dx}px, ${dy}px)`
        if (dist < 16) {
          stickAngle = null
          return null
        }
        const turn = Math.atan2(dy, dx)
        stickAngle = inMenu() ? null : turn
        const names = inMenu() ? ['right', 'down', 'left', 'up'] : SECTORS
        const step = (2 * Math.PI) / names.length
        // Cerca del borde entre dos sectores se queda el que ya estaba (unos 10 grados).
        const at = names.indexOf(stickDir)
        if (at >= 0) {
          const off = Math.atan2(Math.sin(turn - at * step), Math.cos(turn - at * step))
          if (Math.abs(off) < step / 2 + 0.17) return stickDir
        }
        return names[((Math.round(turn / step) % names.length) + names.length) % names.length]
      }
      function stickSet(dir) {
        const mode = inMenu() ? 'menu' : 'move'
        if (dir === stickDir && mode === stickMode) return
        // Un menu que se abre bajo el pulgar quieto no recibe esa direccion: solo
        // cuenta un sector nuevo o un toque nuevo.
        const held = mode === 'menu' && stickMode !== 'menu' && dir === stickDir
        stickDir = dir
        stickMode = mode
        clearInterval(padRepeat)
        fingersNow().delete(stickId)
        // Bajo la hoja de pausa el pulgar no le manda nada al juego.
        if (!dir || paused) return
        if (mode === 'menu') {
          // Una diagonal que quedo de caminar no es una tecla: espera al pulgar.
          if (dir.includes('-') || held) return
          session.press(dir)
          padRepeat = setInterval(() => {
            if (!session || paused || !inMenu()) return clearInterval(padRepeat)
            session.press(dir)
          }, 160)
          return
        }
        fingersNow().set(stickId, dir)
      }
      pad.addEventListener('pointerdown', (event) => {
        event.preventDefault()
        if (stickId !== null) return
        stickId = event.pointerId
        pad.setPointerCapture(event.pointerId)
        pad.classList.add('held')
        stickSet(stickAt(event))
      })
      pad.addEventListener('pointermove', (event) => {
        if (event.pointerId === stickId) stickSet(stickAt(event))
      })
      const lift = (event) => {
        if (event.pointerId !== stickId) return
        clearInterval(padRepeat)
        fingersNow().delete(stickId)
        stickId = null
        stickDir = null
        stickAngle = null
        pad.classList.remove('held')
        knob.style.transform = ''
      }
      pad.addEventListener('pointerup', lift)
      pad.addEventListener('pointercancel', lift)
      pad.addEventListener('lostpointercapture', lift)
      pad.addEventListener('contextmenu', (event) => event.preventDefault())

      // En el celular parado el mundo se ve angosto: un aviso que se cierra
      // tocandolo, mientras se juega o se recorre.
      const rotate = document.getElementById('rotate')
      let rotateClosed = false
      rotate.textContent = L(
        'Turn your phone sideways for a wider view · tap to hide',
        'Gira el celular para ver mas · toca para ocultar'
      )
      let rotateTimer = 0
      function checkRotate() {
        rotate.hidden =
          rotateClosed ||
          !touchPad ||
          innerHeight <= innerWidth ||
          (screen !== 'play' && screen !== 'tour')
        // Se ve unos segundos y se va solo: debajo esta la ficha. Solo cuenta el
        // tiempo en que se ve.
        if (rotate.hidden && rotateTimer) {
          clearTimeout(rotateTimer)
          rotateTimer = 0
        }
        if (!rotate.hidden && !rotateTimer) {
          rotateTimer = setTimeout(() => {
            rotateClosed = true
            checkRotate()
          }, 6000)
        }
      }
      rotate.addEventListener('click', () => {
        rotateClosed = true
        checkRotate()
      })
      addEventListener('resize', checkRotate)
      setInterval(checkRotate, 1000)

      window.runaPage = () => ({
        screen,
        juego: !!juego,
        live,
        term: termShown,
        cols: termCols,
        rows: termRows,
        gait: gaitClip,
        timeScale: gait ? gait.timeScale : 0,
        speed: pace().speed,
        map: world ? world.map : null,
        // La sala del Coliseo en linea y las figuras de los otros jugadores.
        room: roomOf(),
        figures: [...peers.values()].map((entry) => ({
          id: entry.id,
          name: entry.name,
          duel: entry.duel,
          rig: !!entry.rig,
          hp: entry.hp,
          at: entry.root.position.toArray().map((n) => Number(n.toFixed(2)))
        }))
      })

      // La lista de modelos se reintenta antes de arrancar: sin ella no aparece
      // ningun modelo de Tripo. El juego baja mientras tanto.
      const gameReady = loadGame()
      for (let i = 0; !(await refreshModels()) && i < 4; i++) {
        await new Promise((resolve) => setTimeout(resolve, 600 * (i + 1)))
      }
      document.documentElement.lang = settings.lang
      if (!DEMO) await checkTerminal()
      // Con la terminal abierta, la pagina la sigue como antes; si no, el menu.
      if (terminalOpen) startMirror()
      else showMenu()
      await gameReady
      if (!DEMO) setInterval(checkTerminal, 1500)
    </script>
  </body>
</html>
