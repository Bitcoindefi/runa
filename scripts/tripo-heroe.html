          say(L('equipped ', 'equipaste ') + itemName(entry))
          hop = performance.now()
        }
      }

      let toastTimer = 0
      function say(text) {
        toast.textContent = text
        toast.classList.add('show')
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2600)
      }

      // Fondo por zona. Cada llamada lleva su turno: si la vitrina se deja y se
      // vuelve a abrir mientras el fondo baja, solo queda el ultimo pedido.
      let sceneName = null
      let backdrop = null
      let sceneTicket = 0
      async function setScene(name) {
        if (name === sceneName) return
        sceneName = name
        const ticket = ++sceneTicket
        groundMat.color.setHex(GROUND[name] || GROUND.reino)
        const fiery = name === 'ruinas' || name === 'titulo'
        ash.visible = fiery
        ember.color.setHex(fiery ? 0xff6a20 : 0xe0c060)
        if (backdrop) scene.remove(backdrop)
        backdrop = null
        const spec = SCENERY[name]
        if (!spec || !models.has(spec.file)) return
        try {
          const object = await loadGlb(spec.file)
          if (ticket !== sceneTicket || sceneName !== name || world) return
          if (backdrop) scene.remove(backdrop)
          object.updateMatrixWorld(true)
          const box = new THREE.Box3().setFromObject(object)
          const dims = box.getSize(new THREE.Vector3())
          object.scale.multiplyScalar(spec.size / dims.y)
          object.updateMatrixWorld(true)
          const placed = new THREE.Box3().setFromObject(object)
          const center = placed.getCenter(new THREE.Vector3())
          object.position.x -= center.x
          object.position.z -= center.z
          object.position.y -= placed.min.y
          const holder = new THREE.Group()
          holder.add(object)
          holder.position.set(...spec.at)
          holder.rotation.y = spec.yaw
          object.traverse((child) => {
            if (child.isMesh) child.castShadow = true
          })
          backdrop = holder
          scene.add(holder)
        } catch (error) {
          console.warn('sin fondo', name, error)
        }
      }

      // Ceniza de las ruinas y del titulo.
      const ASH = 600
      const ashGeo = new THREE.BufferGeometry()
      const ashPos = new Float32Array(ASH * 3)
      for (let i = 0; i < ASH; i++) {
        ashPos[i * 3] = (Math.random() - 0.5) * 10
        ashPos[i * 3 + 1] = Math.random() * 6
        ashPos[i * 3 + 2] = (Math.random() - 0.5) * 10
      }
      ashGeo.setAttribute('position', new THREE.BufferAttribute(ashPos, 3))
      const ash = new THREE.Points(
        ashGeo,
        new THREE.PointsMaterial({ color: 0xb09080, size: 0.035, transparent: true, opacity: 0.8 })
      )
      ash.visible = false
      scene.add(ash)

      // Mundo: en un mapa fijo el heroe camina por la version 3D del mapa ASCII,
      // hacia la celda del juego. En el resto queda la vitrina.
      const heroTarget = new THREE.Vector3()
      let world = null
      let worldToken = 0
      scene.add(sun.target)

      // La lente se elige por ancho: en una pantalla vertical, el mismo angulo
      // vertical deja apenas 11 grados de ancho y el Coloso queda fuera de cuadro.
      // Ahi se abre la vertical hasta que el ancho vuelva a ser el de la base.
      let lensBase = 38
      function lens() {
        if (camera.aspect >= 1) return lensBase
        const half = Math.tan(THREE.MathUtils.degToRad(lensBase / 2)) / camera.aspect
        return Math.min(75, THREE.MathUtils.radToDeg(2 * Math.atan(half)))
      }

      // En el mapa, la vista elegida: en tercera persona lente abierta y cerca del
      // heroe; en 2.5D lente cerrada y desde lejos, casi isometrica.
      function lensFor(on) {
        const third = !on && settings.camera === 'third'
        lensBase = on ? 38 : third ? 52 : 24
        camera.fov = lens()
        camera.updateProjectionMatrix()
        controls.minDistance = on ? 2.4 : third ? 3 : 14
        controls.maxDistance = on ? 11 : third ? 16 : 110
        // En tercera persona ni cenital ni a ras del pasto.
        controls.minPolarAngle = third ? Math.PI * 0.22 : 0
        controls.maxPolarAngle = third ? Math.PI * 0.44 : Math.PI * 0.49
      }

      function showcase(on) {
        ground.visible = on
        ring.visible = on
        // El cielo, la niebla y las luces: los de la vitrina (fondo negro) o los
        // del mapa, que efectos.js elige por mapa.
        effects.atmosphere(on ? null : world && world.data)
        useAvatar(!on)
        if (backdrop) backdrop.visible = on
        controls.autoRotate = on
        controls.autoRotateSpeed = 0.9
        lensFor(on)
        const reach = on ? 6 : 24
        Object.assign(sun.shadow.camera, { left: -reach, right: reach, top: reach, bottom: -reach })
        sun.shadow.camera.far = on ? 30 : 80
        sun.shadow.camera.updateProjectionMatrix()
        camera.far = on ? 100 : 220
        camera.updateProjectionMatrix()
      }

      function leaveWorld() {
        if (!world) return
        // La pradera saca lo suyo (monstruos, golpes) antes que el mapa.
        if (meadow) meadow.leave(world.map)
        scene.remove(world.built.group)
        world.built.dispose()
        // Las etiquetas del mapa que se fue salen de la lista de sizeLabels.
        world.built.group.traverse((object) => labels.delete(object))
        world = null
        if (marks) marks.visible = false
        duelAim = null
        bossAim = null
        bossLift = 0
      }

      // Los mapas no cambian mientras la pagina corre: cada uno se pide una vez.
      const maps = new Map()
      function mapData(id) {
        // Un mapa que arma la pagina (la pradera, de pradera.js) no se pide al visor.
        const local = meadow && meadow.provide(id)
        if (local) return Promise.resolve(local)
        if (!maps.has(id)) {
          const request = retry(() =>
            fetch('world/' + id + '.json', { cache: 'no-store' }).then((response) => {
              if (!response.ok) throw httpError('el mapa ' + id, response)
              return response.json()
            })
          )
          maps.set(id, request)
          request.catch(() => maps.delete(id))
        }
        return maps.get(id)
      }

      // Los carteles, las puertas y los NPC en el idioma elegido, con la tabla
      // del juego (lib/locale.js). Los letreros pintados en el mapa conservan su
      // largo, como en la terminal.
      function localized(data) {
        if (settings.lang !== 'en' || !juego) return { data, text: (name) => name }
        return {
          data: { ...data, signs: data.rows.map((row) => juego.signs('en', row)) },
          text: (name) => juego.translate('en', name)
        }
      }

      // Donde se para la camara al llegar a un mapa: al sur del heroe y arriba.
      // [alto, atras] de la camara respecto del heroe. third: tercera persona,
      // detras y un poco arriba; far y near: la vista 2.5D, casi isometrica.
      const VIEWS = { third: [3.6, 6.2], far: [44, 32], near: [24, 18] }
      function cameraOffset() {
        const [up, back] = VIEWS[settings.camera] || VIEWS.far
        return new THREE.Vector3(0, up, back)
      }

      // La consulta llega seguido y armar la ciudad puede tardar mas: mientras un
      // mapa se arma no se vuelve a pedir, solo se anota la ultima celda.
      let loadingMap = null
      let lastAt = null
      async function enterWorld(at) {
        lastAt = at
        if (world && world.map === at.map) {
          heroTarget.copy(world.built.toWorld(at.x, at.y))
          return
        }
        if (loadingMap === at.map) return
        loadingMap = at.map
        if (screen !== 'play')
          mode.textContent = L('building the 3D map...', 'armando el mapa 3D...')
        const token = ++worldToken
        let data
        try {
          data = await mapData(at.map)
        } catch (error) {
          if (token === worldToken) loadingMap = null
          mode.textContent = L('could not load the map ', 'no pude traer el mapa ') + at.map
          console.warn(error)
          return
        }
        if (token !== worldToken) return
        loadingMap = null
        const cameFrom = world ? world.map : null
        leaveWorld()
        let built
        try {
          const shown = localized(data)
          built = buildWorld(shown.data, {
            figure,
            text: shown.text,
            glb: (file) => (models.has(file) ? loadGlb(file) : Promise.resolve(null))
          })
        } catch (error) {
          mode.textContent = L('could not build the map ', 'no pude armar el mapa ') + at.map
          console.error(error)
          return
        }
        // Mientras se armaba el heroe pudo moverse: se usa la ultima celda.
        if (lastAt && lastAt.map === at.map) at = lastAt
        if (screen === 'mirror') {
          mode.textContent =
            L('3D map: ', 'mapa 3D: ') +
            data.name +
            L('. You move from the terminal game.', '. Te moves desde la terminal del juego.')
        } else if (screen === 'tour') mode.textContent = placeName(at.map)
        scene.add(built.group)
        world = { map: at.map, built, data }
        showcase(false)
        ash.visible = data.kind === 'boss'
        ember.color.setHex(data.kind === 'boss' ? 0xff6a20 : 0xe0c060)
        // La vitrina se vuelve a armar al salir del mapa.
        sceneName = null
        // El giro de la camara en el mapa anterior, alrededor del heroe.
        const lastAz = Math.atan2(
          camera.position.x - controls.target.x,
          camera.position.z - controls.target.z
        )
        heroTarget.copy(built.toWorld(at.x, at.y))
        hero.root.position.copy(heroTarget)
        controls.target.copy(heroTarget).setY(1)
        // La camara arranca al sur del heroe, mirando al norte como la terminal.
        // Al pasar de un mapa a otro en tercera persona, con adelante sostenido
        // queda detras de hacia donde caminaba el heroe; con otra tecla conserva
        // el giro que tenia, asi la tecla sigue yendo al mismo lado y no lo
        // vuelve a la puerta.
        const off = cameraOffset()
        if (cameFrom && settings.camera === 'third') {
          const az = rawForward ? hero.root.rotation.y + Math.PI : lastAz
          off.set(Math.sin(az) * VIEWS.third[1], VIEWS.third[0], Math.cos(az) * VIEWS.third[1])
        }
        camera.position.copy(heroTarget).add(off)
        // Sin el arrastre ni el giro que quedaban del mapa anterior.
        lead.set(0, 0, 0)
        walkingFor = 0
        armLen = -1
        if (controls._sphericalDelta) controls._sphericalDelta.set(0, 0, 0)
        if ('_scale' in controls) controls._scale = 1
        if (screen === 'tour' && !avatarBody) {
          mode.textContent =
            placeName(at.map) +
            L(' (loading the Tripo hero...)', ' (cargando el heroe de Tripo...)')
        }
        loadAvatar().then(() => {
          useAvatar(!!world)
          if (screen === 'tour' && world) hint()
        })
      }

      function exitWorld() {
        worldToken++
        loadingMap = null
        if (!world) return
        leaveWorld()
        showcase(true)
        hero.root.position.set(0, 0, 0)
        hero.root.rotation.y = 0
        heroTarget.set(0, 0, 0)
        controls.target.set(0, 1, 0)
        camera.position.set(0, 1.55, 4.8)
        ash.position.set(0, 0, 0)
      }

      // El idioma cambio: el mapa se vuelve a armar con sus carteles nuevos.
      function relabel() {
        if (!world) return
        const at = lastAt
        leaveWorld()
        if (at) enterWorld(at)
      }

      async function refreshModels() {
        try {
          const response = await fetch('models.json', { cache: 'no-store' })
          if (!response.ok) throw httpError('models.json', response)
          const list = await response.json()
          models = new Map(list.map((model) => [model.name, model.mtime]))
          // Si la lista llego tarde, el heroe de Tripo se carga ahora y no al
          // cambiar de mapa.
          if (!avatarBody) {
            loadAvatar().then(() => {
              if (world || screen === 'menu') useAvatar(true)
            })
          }
          if (screen === 'menu' && sceneName === 'titulo') {
            sceneName = null
            setScene('titulo')
          }
          return true
        } catch (error) {
          // Sin lista no hay modelos de Tripo: quedan las formas simples.
          console.warn('sin la lista de modelos de Tripo', error)
          return false
        }
      }

      // El Coloso marca en el piso donde va a pegar (rojo, late) y lo que ya
      // quema (naranja): son las celdas que da el juego, sobre el mapa 3D.
      let marks = null
      const markMatrix = new THREE.Matrix4()
      const markRed = new THREE.Color(0xff3b1a)
      const markOrange = new THREE.Color(0xff9a20)
      function bossMarks(boss, time) {
        const cells = boss && world && world.map === 'boss' ? boss : null
        if (!cells) {
          if (marks) marks.visible = false
          return
        }
        if (!marks) {
          marks = new THREE.InstancedMesh(
            new THREE.PlaneGeometry(CX * 0.94, CZ * 0.94).rotateX(-Math.PI / 2),
            new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.6, depthWrite: false }),
            256
          )
          marks.frustumCulled = false
          marks.renderOrder = 2
          scene.add(marks)
        }
        let i = 0
        const put = (cell, color) => {
          if (i >= 256) return
          const p = world.built.toWorld(cell.x, cell.y)
          marks.setMatrixAt(i, markMatrix.makeTranslation(p.x, 0.07, p.z))
          marks.setColorAt(i++, color)
        }
        for (const cell of cells.telegraphs || []) put(cell, markRed)
        for (const cell of cells.hazards || []) put(cell, markOrange)
        marks.count = i
        marks.instanceMatrix.needsUpdate = true
        if (marks.instanceColor) marks.instanceColor.needsUpdate = true
        marks.material.opacity = 0.45 + Math.sin(time * 9) * 0.2
        marks.visible = i > 0
      }

      // Animacion
      let hop = 0
      let stride = 0
      let lastStep = 0
      let velocity = 0
      const timer = new THREE.Timer()
      const step = new THREE.Vector3()
      const follow = new THREE.Vector3()
      // En tercera persona las etiquetas de cerca se achican segun la distancia a
      // la camara; las de lejos quedan como en la vista 2.5D. Las de un mapa que
      // todavia no entro a la escena se saltean.
      const labelAt = new THREE.Vector3()
      function sizeLabels() {
        const third = settings.camera === 'third' && !!world
        for (const sprite of labels) {
          let root = sprite
          while (root.parent) root = root.parent
          if (root !== scene) continue
          const size = sprite.userData.size
          if (!third) {
            sprite.scale.copy(size)
            continue
          }
          sprite.getWorldPosition(labelAt)
          const k = Math.min(1, Math.max(0.25, labelAt.distanceTo(camera.position) / 32))
          sprite.scale.set(size.x * k, size.y * k, 1)
        }
      }
      // En tercera persona la camara gira despacio hasta quedar detras de
      // `facing` (un rumbo del piso, como rotation.y del heroe) si ya esta dentro
      // del cono; fuera de el no gira, asi no da vueltas sola. Con el mouse o el
      // dedo se la sigue girando a mano.
      const behind = new THREE.Vector3()
      function alignTo(facing, dt, cone, rate = CAM.turn) {
        behind.subVectors(camera.position, controls.target)
        const flat = Math.hypot(behind.x, behind.z)
        if (flat < 0.01) return
        const now = Math.atan2(behind.x, behind.z)
        if (Math.abs(wrap(now + Math.PI - facing)) > cone) return
        const turn = now + wrap(facing + Math.PI - now) * ease(dt, rate)
        behind.x = Math.sin(turn) * flat
        behind.z = Math.cos(turn) * flat
        camera.position.copy(controls.target).add(behind)
      }

      // La camara en tercera persona flota detras del heroe en vez de ir pegada:
      // - el punto que mira persigue al heroe con un retraso que no depende de
      //   los fps (1 - e^(-velocidad * dt)), como el "camera lag" de un brazo de
      //   resorte; a la carrera queda un metro y algo atras y lo alcanza al frenar;
      // - una zona muerta chica: los pasitos no la mueven;
      // - mira un poco adelante de hacia donde se camina, suavizado;
      // - se acomoda detras recien despues de medio segundo caminando, despacio,
      //   y no lo hace por unos segundos si se la giro a mano;
      // - un salto grande (otro mapa, un portal) la lleva de golpe, sin arrastre.
      const CAM = {
        lag: 3.2,
        lead: 1.1,
        leadEase: 2.2,
        dead: 0.3,
        turn: 0.9,
        wait: 0.5,
        hands: 2.5
      }
      const ease = (dt, speed) => 1 - Math.exp(-speed * dt)
      const lead = new THREE.Vector3()
      const wantLead = new THREE.Vector3()
      const chase = new THREE.Vector3()
      let walkingFor = 0
      let handsUntil = 0
      // Mientras el mouse o el dedo giran la camara, nada la acomoda sola; al
      // soltar espera CAM.hands segundos.
      let dragging = false
      // La entrada cruda (respecto de la pantalla) apunta derecho adelante.
      let rawForward = false
      // El rumbo del piso de esa entrada, solo con rawForward; si no, null.
      let steerYaw = null
      // El ultimo sector del joystick, para que no titile en el borde.
      let lastSector = null
      // En un duelo o contra el Coloso, el rumbo hacia el rival (o null).
      let duelAim = null
      let bossAim = null
      // Cuanto sube lo que mira la camara en la pelea con el Coloso.
      let bossLift = 0
      controls.addEventListener('start', () => {
        dragging = true
        handsUntil = Infinity
      })
      controls.addEventListener('end', () => {
        dragging = false
        handsUntil = performance.now() + CAM.hands * 1000
      })
      function floatCamera(dt, going, speed = 0) {
        walkingFor = going && rawForward ? walkingFor + dt : 0
        // Adelante de la marcha: hacia donde mira el heroe, solo caminando.
        if (going) {
          const facing = hero.root.rotation.y
          wantLead.set(Math.sin(facing) * CAM.lead, 0, Math.cos(facing) * CAM.lead)
        } else wantLead.set(0, 0, 0)
        lead.lerp(wantLead, ease(dt, CAM.leadEase))
        chase.set(follow.x + lead.x, follow.y, follow.z + lead.z).sub(controls.target)
        const gap = chase.length()
        if (gap > 8) {
          // Otro mapa o un portal: sin arrastre.
          lead.set(0, 0, 0)
          chase.set(follow.x, follow.y, follow.z).sub(controls.target)
          armLen = -1
        } else {
          // La zona muerta solo con el heroe quieto; caminando, el retraso crece
          // con la velocidad para que a la carrera no quede metros atras.
          const dead = going ? 0 : CAM.dead
          if (gap <= dead) chase.set(0, 0, 0)
          else chase.multiplyScalar(((gap - dead) / gap) * ease(dt, CAM.lag + speed * 0.6))
        }
        camera.position.add(chase)
        controls.target.add(chase)
        // Se acomoda sola solo sin manos encima. En un duelo o contra el Coloso,
        // detras del heroe mirando al rival; caminando, solo si la entrada va
        // derecho adelante (una diagonal no la gira: asi no da vueltas sola) y
        // detras del rumbo pedido, no del cuerpo (una pared o una puerta que
        // corre al heroe de costado no la tuercen).
        const t = performance.now()
        // Con adelante sostenido la espera despues de soltar es de un segundo.
        const early = going && rawForward ? (CAM.hands - 1) * 1000 : 0
        const free = !dragging && t > handsUntil - early
        const src = screen === 'tour' ? demo : mover
        const blocked =
          t < (src.blockedX || 0) || t < (src.blockedY || 0) || t < (src.nudgedUntil || 0)
        if (duelAim !== null) {
          if (free) alignTo(duelAim, dt, Math.PI, 2.5)
        } else if (bossAim !== null) {
          if (free) alignTo(bossAim, dt, Math.PI, 1.5)
        } else if (going && free && !blocked && steerYaw !== null && walkingFor > CAM.wait)
          alignTo(steerYaw, dt, Math.PI / 8 + 0.02)
      }
      // El brazo de resorte de la tercera persona: si una casa queda entre lo que
      // mira la camara y la camara, se la acerca hasta antes de la pared (y no
      // baja dentro del cerro del borde). Se suma solo al dibujar, como el
      // temblor: los controles nunca ven la distancia acortada. Se acerca de
      // golpe y vuelve a alejarse despacio.
      let armLen = -1
      const armDir = new THREE.Vector3()
      const armOff = new THREE.Vector3()
      let armT0 = 0
      let armT1 = 0
      // Recorta [armT0, armT1] con una franja del rayo sobre un eje.
      function armSlab(p, v, lo, hi) {
        if (Math.abs(v) < 1e-6) {
          if (p < lo || p > hi) armT0 = Infinity
          return
        }
        let a = (lo - p) / v
        let c = (hi - p) / v
        if (a > c) [a, c] = [c, a]
        if (a > armT0) armT0 = a
        if (c < armT1) armT1 = c
      }
      // Las cajas llevan un margen por los zocalos y marcos que salen de la pared.
      const ARM_PAD = 0.2
      function armHit(o, d, want) {
        let best = want
        for (const b of world.built.blocks || []) {
          // Parado en la puerta de una casa: esa casa no cuenta.
          if (o.x > b.x0 && o.x < b.x1 && o.z > b.z0 && o.z < b.z1) continue
          // Pegado a la pared (dentro del margen) cuenta la pared misma.
          const near =
            o.x > b.x0 - ARM_PAD &&
            o.x < b.x1 + ARM_PAD &&
            o.z > b.z0 - ARM_PAD &&
            o.z < b.z1 + ARM_PAD
          const pad = near ? 0 : ARM_PAD
          armT0 = 0
          armT1 = best
          armSlab(o.x, d.x, b.x0 - pad, b.x1 + pad)
          armSlab(o.y, d.y, 0, b.top)
          armSlab(o.z, d.z, b.z0 - pad, b.z1 + pad)
          if (armT0 <= armT1 && armT0 < best) best = armT0
        }
        return best
      }
      function springArm(dt) {
        if (settings.camera !== 'third' || !world || screen === 'menu') {
          armLen = -1
          return null
        }
        armDir.subVectors(camera.position, controls.target)
        const want = armDir.length()
        if (want < 0.01) return null
        armDir.divideScalar(want)
        // Hasta 0,3 m antes de la casa, solo si hay una en el medio.
        const hit = armHit(controls.target, armDir, want)
        const free = hit < want ? Math.min(want, Math.max(1.4, hit - 0.3)) : want
        armLen = armLen < 0 || free < armLen ? free : armLen + (free - armLen) * ease(dt, 2.2)
        armLen = Math.min(armLen, want)
        armOff.copy(armDir).multiplyScalar(armLen - want)
        const ground = world.built.terrainHeight
          ? world.built.terrainHeight(camera.position.x + armOff.x, camera.position.z + armOff.z)
          : 0
        armOff.y += Math.max(0, ground + 0.8 - (camera.position.y + armOff.y))
        return armOff.lengthSq() > 1e-4 ? armOff : null
      }
      // El heroe se desvanece si la camara le queda encima (el brazo de resorte la
      // acerco contra una pared): opaco a mas de FADE.far metros del pecho, y a
      // FADE.near queda en FADE.least. Solo en tercera persona dentro de un mapa.
      // No toca los materiales del heroe, que pueden compartirse (el rival los
      // clona, la vitrina los usa): mientras dura, cada malla lleva una copia
      // transparente y al volver a opaco recupera la suya tal cual.
      const FADE = { far: 2.2, near: 1.2, least: 0.25, speed: 8 }
      const fadeChest = new THREE.Vector3()
      // Opciones las vacia al cambiar las sombras: la copia se arma de nuevo.
      let fadeCopies = new WeakMap()
      let fadeNow = 1
      let fadeShown = false
      // La copia sigue a la suya en cada cuadro: opacidad, color y brillo (el
      // destello al recibir un golpe).
      function fadeSync(copy, own) {
        copy.opacity = own.opacity * fadeNow
        if (own.color && copy.color) copy.color.copy(own.color)
        if (own.emissive && copy.emissive) {
          copy.emissive.copy(own.emissive)
          copy.emissiveIntensity = own.emissiveIntensity
        }
      }
      function fadeCopy(material) {
        let copy = fadeCopies.get(material)
        if (!copy) {
          copy = material.clone()
          // clone() no copia el parche del shader.
          copy.onBeforeCompile = material.onBeforeCompile
          copy.customProgramCacheKey = material.customProgramCacheKey
          copy.transparent = true
          copy.depthWrite = false
          fadeCopies.set(material, copy)
        }
        fadeSync(copy, material)
        return copy
      }
      function fadeMesh(child) {
        if (!child.isMesh) return
        const data = child.userData
        if (data.fadeCopy && child.material === data.fadeCopy) {
          if (fadeShown) {
            if (Array.isArray(data.fadeCopy)) {
              for (let i = 0; i < data.fadeCopy.length; i++)
                fadeSync(data.fadeCopy[i], data.fadeOwn[i])
            } else fadeSync(data.fadeCopy, data.fadeOwn)
          } else child.material = data.fadeOwn
          return
        }
        // Una malla nueva (equipo, armadura) o lo que ya es transparente, como
        // el tajo, que lleva su propio fundido.
        if (!fadeShown) return
        const own = child.material
        if (Array.isArray(own) ? own.some((m) => m.transparent) : own.transparent) return
        data.fadeOwn = own
        data.fadeCopy = Array.isArray(own) ? own.map(fadeCopy) : fadeCopy(own)
        child.material = data.fadeCopy
      }
      function fadeHero(dt) {
        let want = 1
        const applies = settings.camera === 'third' && world && screen !== 'menu' && !ground.visible
        if (applies) {
          hero.root.getWorldPosition(fadeChest)
          fadeChest.y += 1.3
          const k = (camera.position.distanceTo(fadeChest) - FADE.near) / (FADE.far - FADE.near)
          want = FADE.least + (1 - FADE.least) * Math.min(1, Math.max(0, k))
        }
        // Fuera de la tercera persona (titulo, vitrina, 2.5D) vuelve opaco de una.
        fadeNow =
          !applies || (want === 1 && !fadeShown)
            ? 1
            : fadeNow + (want - fadeNow) * ease(dt, FADE.speed)
        if (fadeNow > 0.995 && want === 1) fadeNow = 1
        const show = fadeNow < 1
        if (!show && !fadeShown) return
        fadeShown = show
        hero.root.traverse(fadeMesh)
      }

      // Lo que mira la camara respecto del heroe: runaView.frame lo corre para
      // encuadrar una captura, y vuelve al pecho del heroe cuando camina.
      const framing = new THREE.Vector3(0, 1, 0)
      const steer = new THREE.Vector3()
      const lateral = new THREE.Vector3()
      const wrap = (angle) => Math.atan2(Math.sin(angle), Math.cos(angle))

      // La pelea con el Coloso, que se sienta. Todo sale de lo que dice el juego
      // (su vida, la del heroe, las celdas que marca y las que queman): no cambia
      // reglas, solo lo muestra.
      // - El Coloso respira y gira despacio hacia el heroe.
      // - Cuando marca un golpe (rojo) se echa atras y se carga de brillo; cuando
      //   el golpe cae (aparece lo que quema), se vence hacia adelante, tiembla la
      //   camara y una onda se abre por el piso.
      // - Cuando lo golpean destella, retrocede, saltan chispas y sube el dano.
      // - El heroe embiste con un tajo al apretar F o espacio; cuando lo alcanzan
      //   salta, le saltan chispas rojas y sube su dano en rojo.
      const fight = {
        built: null,
        rig: null,
        bossHp: null,
        heroHp: null,
        warned: 0,
        burning: 0,
        windup: 0,
        slam: 0,
        hit: 0,
        hurt: 0,
        swing: 0,
        shake: 0,
        bits: []
      }
      const sparkGeo = new THREE.OctahedronGeometry(0.08)
      const flashColor = new THREE.Color(0xfff0c8)
      const chargeColor = new THREE.Color(0xff5a10)
      // El tajo barre de costado: gira el soporte de la mano sobre su +y, que con
      // el brazo caido apunta arriba.
      const swingAxis = new THREE.Vector3(0, 1, 0)
      const swingTurn = new THREE.Quaternion()
      const shake = new THREE.Vector3()

      // Arma el Coloso de la arena para animarlo: un pivote en sus pies que lo gira
      // y otro que lo inclina. Con materiales propios, para que el destello no
      // toque al Coloso del titulo ni al de la vitrina.
      function fightRig() {
        const built = world && world.built
        if (fight.built !== built) {
          fightReset()
          fight.built = built
        }
        if (fight.rig || !built || !built.colossus) return fight.rig
        const object = built.colossus()
        if (!object || !object.parent) return null
        object.updateMatrixWorld(true)
        const box = new THREE.Box3().setFromObject(object)
        const turn = new THREE.Group()
        turn.position.set((box.min.x + box.max.x) / 2, box.min.y, (box.min.z + box.max.z) / 2)
        const lean = new THREE.Group()
        turn.add(lean)
        object.parent.add(turn)
        turn.updateMatrixWorld(true)
        lean.attach(object)
        const materials = []
        object.traverse((child) => {
          if (!child.isMesh) return
          const own = [child.material].flat().map((material) => {
            const copy = material.clone()
            // clone() no copia el parche del shader (el calado de tripo-mundo.js).
            copy.onBeforeCompile = material.onBeforeCompile
            copy.customProgramCacheKey = material.customProgramCacheKey
            copy.userData.emissive = copy.emissive ? copy.emissive.clone() : null
            copy.userData.intensity = copy.emissiveIntensity ?? 1
            materials.push(copy)
            return copy
          })
          child.material = Array.isArray(child.material) ? own : own[0]
        })
        fight.rig = { turn, lean, materials, height: box.max.y - box.min.y }
        return fight.rig
      }

      function fightReset() {
        if (fight.rig) for (const material of fight.rig.materials) material.dispose()
        for (const bit of fight.bits) {
          ;(bit.parent || scene).remove(bit.object)
          if (bit.dispose) bit.dispose()
        }
        fight.bits = []
        fight.rig = null
        fight.bossHp = fight.heroHp = null
        fight.warned = fight.burning = 0
        fight.windup = fight.slam = fight.hit = fight.hurt = fight.swing = fight.shake = 0
        avatar.position.z = 0
        const holder = avatarHands.left_hand
        if (holder.userData.base) holder.quaternion.copy(holder.userData.base)
      }

      // Un numero que sube y se apaga: el dano.
      function floater(text, color, at) {
        const canvas = document.createElement('canvas')
        canvas.width = 256
        canvas.height = 128
        const g = canvas.getContext('2d')
        g.font = 'bold 84px ui-monospace, Consolas, monospace'
        g.textAlign = 'center'
        g.textBaseline = 'middle'
        g.lineWidth = 12
        g.strokeStyle = 'rgba(12, 8, 6, 0.9)'
        g.strokeText(text, 128, 64)
        g.fillStyle = color
        g.fillText(text, 128, 64)
        const texture = new THREE.CanvasTexture(canvas)
        texture.colorSpace = THREE.SRGBColorSpace
        const material = new THREE.SpriteMaterial({
          map: texture,
          depthTest: false,
          depthWrite: false,
          transparent: true
        })
        const sprite = new THREE.Sprite(material)
        sprite.scale.set(2.6, 1.3, 1)
        sprite.renderOrder = 20
        sprite.position.copy(at)
        scene.add(sprite)
        fight.bits.push({
          object: sprite,
          life: 0,
          span: 1.1,
          kind: 'number',
          from: at.clone(),
          dispose: () => {
            texture.dispose()
            material.dispose()
          }
        })
      }

      // Chispas que saltan del golpe.
      function sparks(at, color) {
        const material = new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
        for (let i = 0; i < 18; i++) {
          const mesh = new THREE.Mesh(sparkGeo, material)
          mesh.position.copy(at)
          const a = Math.random() * Math.PI * 2
          const out = 2.5 + Math.random() * 4
          scene.add(mesh)
          fight.bits.push({
            object: mesh,
            life: 0,
            span: 0.55,
            kind: 'spark',
            v: new THREE.Vector3(Math.cos(a) * out, 2 + Math.random() * 5, Math.sin(a) * out),
            dispose: i === 0 ? () => material.dispose() : null
          })
        }
      }

      // Una onda que se abre por el piso donde cae el golpe.
      function shockwave(at) {
        const material = new THREE.MeshBasicMaterial({
          color: 0xff8a2a,
          transparent: true,
          opacity: 0.85,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide
        })
        const mesh = new THREE.Mesh(
          new THREE.RingGeometry(0.7, 1.1, 48).rotateX(-Math.PI / 2),
          material
        )
        mesh.position.set(at.x, 0.15, at.z)
        scene.add(mesh)
        fight.bits.push({
          object: mesh,
          life: 0,
          span: 0.7,
          kind: 'wave',
          dispose: () => {
            mesh.geometry.dispose()
            material.dispose()
          }
        })
      }

      // El tajo del heroe: un arco dorado delante de el, que barre y se apaga.
      function swingSword() {
        fight.swing = 1
        const material = new THREE.MeshBasicMaterial({
          color: 0xffe08a,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide
        })
        // El arco va delante del heroe (+z): centrado en -90 grados antes de
        // acostarlo, que al girar el plano queda hacia +z.
        const mesh = new THREE.Mesh(
          new THREE.RingGeometry(0.9, 1.35, 32, 1, -Math.PI * 0.85, Math.PI * 0.7).rotateX(
            -Math.PI / 2
          ),
          material
        )
        mesh.position.set(0, 1.0, 0.2)
        hero.root.add(mesh)
        fight.bits.push({
          object: mesh,
          parent: hero.root,
          life: 0,
          span: 0.24,
          kind: 'slash',
          dispose: () => {
            mesh.geometry.dispose()
            material.dispose()
          }
        })
      }

      function shakeOffset(dt) {
        if (fight.shake <= 0.01 || screen !== 'play') return null
        shake.set(
          (Math.random() - 0.5) * fight.shake * 0.7,
          (Math.random() - 0.5) * fight.shake * 0.4,
          (Math.random() - 0.5) * fight.shake * 0.7
        )
        fight.shake = Math.max(0, fight.shake - dt * 2.4)
        return shake
      }

      function fightFrame(dt, time, st) {
        const boss = st && st.boss
        if (!world || world.map !== 'boss' || !boss) {
          bossAim = null
          bossLift = 0
          if (fight.built) {
            fightReset()
            fight.built = null
          }
          return
        }
        const rig = fightRig()
        const chest = rig
          ? new THREE.Vector3().setFromMatrixPosition(rig.turn.matrixWorld).setY(rig.height * 0.62)
          : null
        // En tercera persona la camara va detras del heroe mirando al Coloso, y
        // un poco mas alta para que entren su cabeza y los numeros del dano.
        bossAim =
          chest && settings.camera === 'third'
            ? Math.atan2(chest.x - hero.root.position.x, chest.z - hero.root.position.z)
            : null
        // Mas cerca del Coloso sube mas (de 2 m a 12 m hasta 2,8 m a 4 m), para
        // que su cabeza no salga por arriba.
        const near = chest
          ? Math.hypot(chest.x - hero.root.position.x, chest.z - hero.root.position.z)
          : 99
        const wantLift = bossAim !== null ? 2 + 0.8 * Math.min(1, Math.max(0, (12 - near) / 8)) : 0
        bossLift += (wantLift - bossLift) * Math.min(1, dt * 2)
        // Lo que paso desde el cuadro anterior, en los numeros del juego.
        if (fight.bossHp !== null && boss.hp < fight.bossHp && chest) {
          fight.hit = 1
          fight.shake = Math.max(fight.shake, 0.35)
          floater('-' + (fight.bossHp - boss.hp), '#ffd27a', chest.clone().setY(rig.height + 0.8))
          sparks(chest, 0xffb040)
        }
        fight.bossHp = boss.hp
        if (fight.heroHp !== null && st.hp < fight.heroHp) {
          fight.hurt = 1
          fight.shake = Math.max(fight.shake, 0.7)
          hop = performance.now()
          const at = hero.root.position.clone()
          floater('-' + (fight.heroHp - st.hp), '#ff6a5a', at.clone().setY(3.1))
          sparks(at.setY(1.2), 0xff4030)
        }
        fight.heroHp = st.hp
        const warned = (boss.telegraphs || []).length
        const burning = (boss.hazards || []).length
        if (burning > fight.burning || (warned === 0 && fight.warned > 0)) {
          // El golpe cae: donde quema, o donde estaba marcado.
          const cells = burning ? boss.hazards : []
          fight.slam = 1
          fight.shake = Math.max(fight.shake, 1)
          if (cells.length) {
            const sum = new THREE.Vector3()
            for (const cell of cells) sum.add(world.built.toWorld(cell.x, cell.y))
            shockwave(sum.divideScalar(cells.length))
          } else if (chest) shockwave(chest)
        }
        fight.warned = warned
        fight.burning = burning
        fight.windup = warned
          ? Math.min(1, fight.windup + dt * 1.6)
          : Math.max(0, fight.windup - dt * 3)
        fight.slam = Math.max(0, fight.slam - dt * 2.2)
        fight.hit = Math.max(0, fight.hit - dt * 3.5)
        fight.hurt = Math.max(0, fight.hurt - dt * 2.5)
        fight.swing = Math.max(0, fight.swing - dt / 0.3)

        // El tajo: el heroe embiste y la espada baja en arco.
        const s = fight.swing > 0 ? Math.sin((1 - fight.swing) * Math.PI) : 0
        avatar.position.z = s * 0.4
        const holder = avatarHands.left_hand
        if (holder.userData.base) {
          holder.quaternion
            .copy(holder.userData.base)
            .multiply(swingTurn.setFromAxisAngle(swingAxis, -s * 1.5))
        }
        if (!rig) return

        // Gira hacia el heroe, despacio. Mira hacia -x en su pivote.
        const dx = hero.root.position.x - rig.turn.position.x
        const dz = hero.root.position.z - rig.turn.position.z
        if (dx * dx + dz * dz > 0.01) {
          const want = Math.atan2(dz, -dx)
          rig.turn.rotation.y += wrap(want - rig.turn.rotation.y) * Math.min(1, dt * 1.2)
        }
        // Se inclina: atras al cargar, adelante al caer, un poco atras al recibir.
        // Inclinarse hacia su frente (-x) es girar positivo sobre z.
        const breathe = Math.sin(time * 1.3)
        const fall = fight.slam > 0 ? Math.sin(fight.slam * Math.PI) : 0
        rig.lean.rotation.z = breathe * 0.015 - fight.windup * 0.2 + fall * 0.32 - fight.hit * 0.08
        rig.lean.position.y = breathe * 0.06 + fight.windup * 0.3 - fall * 0.35
        // Destello: claro al recibir, naranja al cargar el golpe.
        const glow = Math.max(fight.hit, fight.windup * 0.6)
        const tone = fight.hit >= fight.windup * 0.6 ? flashColor : chargeColor
        for (const material of rig.materials) {
          if (!material.emissive || !material.userData.emissive) continue
          material.emissive.copy(material.userData.emissive).lerp(tone, glow)
          material.emissiveIntensity = material.userData.intensity + glow * 1.6
        }
      }

      // Chispas, numeros, ondas y tajos que siguen vivos: los de la pelea con el
      // Coloso y los del duelo en el Coliseo.
      function tickBits(dt) {
        for (let i = fight.bits.length - 1; i >= 0; i--) {
          const bit = fight.bits[i]
          bit.life += dt
          const k = bit.life / bit.span
          if (k >= 1) {
            ;(bit.parent || scene).remove(bit.object)
            if (bit.dispose) bit.dispose()
            fight.bits.splice(i, 1)
            continue
          }
          if (bit.kind === 'number') {
            bit.object.position.y = bit.from.y + k * 1.6
            bit.object.material.opacity = 1 - k * k
          } else if (bit.kind === 'spark') {
            bit.v.y -= 14 * dt
            bit.object.position.addScaledVector(bit.v, dt)
            bit.object.scale.setScalar(Math.max(0.05, 1 - k))
          } else if (bit.kind === 'wave') {
            bit.object.scale.setScalar(1 + k * 7)
            bit.object.material.opacity = 0.85 * (1 - k)
          } else if (bit.kind === 'slash') {
            bit.object.material.opacity = 0.9 * (1 - k)
            bit.object.rotation.y = -k * 1.4
          }
        }
      }

      // --- Los otros jugadores de la sala ------------------------------------
      // En la ciudad cada jugador de la sala es una figura liviana con su nombre,
      // la de los NPC (comparte geometria y material). En el Coliseo el rival es
      // el heroe de Tripo clonado y tenido de rojo, con su barra de vida, y sale
      // del duelo (st.arena, que ordena el host), no de la red: se ve lo que paso.
      const peers = new Map()
      const rivalTint = new THREE.Color(1, 0.5, 0.45)
      // Cuanto se corre la camara hacia el rival durante un duelo.
      const duelView = new THREE.Vector3()
      const duelWant = new THREE.Vector3()
      const duelToward = new THREE.Vector3()
      // Lo ultimo que se vio del heroe en el duelo, para notar golpes y tajos.
      const duelSelf = { hp: null, swinging: 0 }

      // La barra de vida sobre el rival: se repinta solo si cambia.
      function hpSprite() {
        const canvas = document.createElement('canvas')
        canvas.width = 128
        canvas.height = 18
        const texture = new THREE.CanvasTexture(canvas)
        texture.colorSpace = THREE.SRGBColorSpace
        const sprite = new THREE.Sprite(
          new THREE.SpriteMaterial({ map: texture, depthWrite: false, transparent: true })
        )
        sprite.scale.set(1.5, 0.21, 1)
        sprite.renderOrder = 11
        let shown = ''
        return {
          sprite,
          set(share) {
            const key = share.toFixed(3)
            if (key === shown) return
            shown = key
            const g = canvas.getContext('2d')
            g.clearRect(0, 0, 128, 18)
            g.fillStyle = 'rgba(10, 8, 8, 0.85)'
            g.fillRect(0, 0, 128, 18)
            g.fillStyle = share > 0.5 ? '#e0583a' : share > 0.25 ? '#e8902a' : '#ff3020'
            g.fillRect(3, 3, Math.max(0, Math.round(122 * share)), 12)
            g.strokeStyle = 'rgba(255, 235, 200, 0.55)'
            g.lineWidth = 2
            g.strokeRect(1, 1, 126, 16)
            texture.needsUpdate = true
          },
          dispose() {
            texture.dispose()
            sprite.material.dispose()
          }
        }
      }

      function addPeer(who, duel) {
        const root = new THREE.Group()
        // El cuerpo cuelga de `holder`, que adelanta el tajo del rival.
        const holder = new THREE.Group()
        root.add(holder)
        const entry = {
          id: who.id,
          name: who.name,
          duel,
          root,
          holder,
          body: figure(duel ? 'red' : 'cyan'),
          mixer: null,
          clips: {},
          clip: '',
          rig: null,
          materials: [],
          // Con teclado, la etiqueta recuerda como desafiarlo.
          tag: label(who.name + (duel || touchPad ? '' : ' [E]'), duel ? '#e07a6a' : '#6fd3e0'),
          bar: duel ? hpSprite() : null,
          hp: null,
          swinging: 0,
          lunge: 0,
          placed: false
        }
        holder.add(entry.body)
        entry.tag.position.y = duel ? 2.95 : 2.4
        root.add(entry.tag)
        if (entry.bar) {
          entry.bar.sprite.position.y = 2.6
          root.add(entry.bar.sprite)
        }
        scene.add(root)
        peers.set(who.id, entry)
        if (duel && avatarBody) dressRival(entry, AVATAR)
        return entry
      }

      // El rival con el cuerpo del heroe de Tripo: el GLB ya esta en cache, asi
      // que no baja nada nuevo. Materiales propios para que el del jugador no
      // cambie de color; la geometria se comparte y no se libera.
      function dressRival(entry, spec) {
        loadRig(spec.file)
          .then(({ object, clips }) => {
            if (peers.get(entry.id) !== entry) return
            object.rotation.y = spec.yaw
            object.updateMatrixWorld(true)
            const box = new THREE.Box3().setFromObject(object)
            object.scale.multiplyScalar(spec.height / box.getSize(new THREE.Vector3()).y)
            object.updateMatrixWorld(true)
            const placed = new THREE.Box3().setFromObject(object)
            const mid = placed.getCenter(new THREE.Vector3())
            object.position.x -= mid.x
            object.position.z -= mid.z
            object.position.y -= placed.min.y
            object.traverse((child) => {
              if (!child.isMesh) return
              child.castShadow = true
              if (child.isSkinnedMesh) child.frustumCulled = false
              const own = [child.material].flat().map((material) => {
                const copy = material.clone()
                if (copy.color) copy.color.multiply(rivalTint)
                entry.materials.push(copy)
                return copy
              })
              child.material = Array.isArray(child.material) ? own : own[0]
            })
            entry.holder.remove(entry.body)
            entry.body = object
            entry.rig = object
            entry.holder.add(object)
            if (spec.rigged) {
              entry.mixer = new THREE.AnimationMixer(object)
              for (const name of ['Idle', 'Run']) {
                const clip = THREE.AnimationClip.findByName(clips, name)
                if (clip) entry.clips[name] = entry.mixer.clipAction(clip)
              }
            }
          })
          .catch((error) => console.warn('el rival queda con la figura simple', error))
      }

      function dropPeer(entry) {
        scene.remove(entry.root)
        entry.tag.material.map.dispose()
        entry.tag.material.dispose()
        if (entry.bar) entry.bar.dispose()
        for (const material of entry.materials) material.dispose()
        if (entry.mixer) entry.mixer.stopAllAction()
        if (entry.rig) {
          entry.rig.traverse((child) => {
            if (child.isSkinnedMesh && child.skeleton) child.skeleton.dispose()
          })
        }
        peers.delete(entry.id)
      }

      // Va hacia su celda al paso de correr, mira hacia donde va (en el duelo,
      // al heroe) y en el duelo cuenta los golpes que recibe y los tajos que da.
      function movePeer(entry, who, dt) {
        const at = world.built.toWorld(who.x, who.y)
        const pos = entry.root.position
        const gap = Math.hypot(at.x - pos.x, at.z - pos.z)
        if (!entry.placed || gap > 6) {
          pos.set(at.x, 0, at.z)
          entry.placed = true
        } else if (gap > 0.004) {
          const stride = Math.min(gap, (GAITS.run.speed * 1.1 + gap * 3) * dt)
          pos.x += ((at.x - pos.x) / gap) * stride
          pos.z += ((at.z - pos.z) / gap) * stride
        }
        const moving = gap > 0.05
        let yaw = null
        if (moving) yaw = Math.atan2(at.x - pos.x, at.z - pos.z)
        else if (entry.duel) {
          yaw = Math.atan2(hero.root.position.x - pos.x, hero.root.position.z - pos.z)
        }
        if (yaw !== null) {
          entry.root.rotation.y += wrap(yaw - entry.root.rotation.y) * Math.min(1, dt * 10)
        }
        if (entry.mixer) {
          const name = moving && entry.clips.Run ? 'Run' : 'Idle'
          if (entry.clip !== name && entry.clips[name]) {
            entry.clips[name].reset().fadeIn(0.15).play()
            if (entry.clips[entry.clip]) entry.clips[entry.clip].fadeOut(0.15)
            entry.clip = name
          }
          entry.mixer.update(dt)
        }
        if (!entry.duel) return
        entry.bar.set(who.maxHp > 0 ? Math.max(0, who.hp) / who.maxHp : 0)
        if (entry.hp !== null && who.hp < entry.hp) {
          floater('-' + (entry.hp - who.hp), '#ffd27a', pos.clone().setY(3.4))
          sparks(pos.clone().setY(1.2), 0xffb040)
        }
        entry.hp = who.hp
        if (who.swinging > entry.swinging) entry.lunge = 1
        entry.swinging = who.swinging
        entry.lunge = Math.max(0, entry.lunge - dt / 0.3)
        entry.holder.position.z = Math.sin(entry.lunge * Math.PI) * 0.4
      }

      // Cada cuadro: quien de la sala esta en este mapa, o el rival del duelo.
      function othersFrame(dt, st) {
        const arena = st && st.arena
        const want = new Map()
        if (world && arena && world.map === 'coliseum') {
          want.set(arena.rival.id, { ...arena.rival, duel: true })
        } else if (world && st && !arena && st.location && world.map === st.location.mapId) {
          for (const player of st.players || []) want.set(player.id, { ...player, duel: false })
        }
        for (const entry of [...peers.values()]) {
          const who = want.get(entry.id)
          if (!who || who.duel !== entry.duel) dropPeer(entry)
        }
        for (const who of want.values())
          movePeer(peers.get(who.id) || addPeer(who, who.duel), who, dt)

        const rival = arena && peers.get(arena.rival.id)
        if (!rival) {
          duelView.set(0, 0, 0)
          duelAim = null
          duelSelf.hp = null
          duelSelf.swinging = 0
          return
        }
        // En 2.5D la camara mira entre los dos; en tercera persona va detras del
        // heroe, sobre la linea hacia el rival, asi el rival queda adelante.
        duelToward.subVectors(rival.root.position, hero.root.position).setY(0)
        duelWant
          .copy(duelToward)
          .multiplyScalar(settings.camera === 'third' ? 0 : 0.5)
          .clampLength(0, 12)
        duelView.lerp(duelWant, Math.min(1, dt * 3))
        duelAim =
          settings.camera === 'third' && duelToward.lengthSq() > 0.01
            ? Math.atan2(duelToward.x, duelToward.z)
            : null
        // Quieto, el heroe mira al rival.
        if (velocity < 0.3) {
          const yaw = Math.atan2(duelToward.x, duelToward.z)
          if (duelToward.lengthSq() > 0.01) {
            hero.root.rotation.y += wrap(yaw - hero.root.rotation.y) * Math.min(1, dt * 8)
          }
        }
        // Lo que le pasa al heroe, en los numeros del duelo.
        if (duelSelf.hp !== null && arena.self.hp < duelSelf.hp) {
          const at = hero.root.position.clone()
          floater('-' + (duelSelf.hp - arena.self.hp), '#ff6a5a', at.clone().setY(3.1))
          sparks(at.setY(1.2), 0xff4030)
          hop = performance.now()
        }
        duelSelf.hp = arena.self.hp
        if (arena.self.swinging > duelSelf.swinging) swingSword()
        duelSelf.swinging = arena.self.swinging
      }

      // Hacia donde apuntan las teclas (o los dedos en la cruceta), en el piso:
      // una de 8 direcciones, sin el eje que una pared frena. Null si no se camina.
      function steerDir() {
        // Lo que heading anota para la camara vale solo para este cuadro.
        rawForward = false
        steerYaw = null
        let source = null
        if (screen === 'play') {
          if (!session || !exploring(live) || peek || !live.world) return null
          source = mover
        } else if (screen === 'tour') source = demo
        else return null
        let [dx, dy] = heading(source.held, source.fingers)
        const now = performance.now()
        if (dx && dy) {
          if (now < (source.blockedX || 0)) dx = 0
          if (now < (source.blockedY || 0)) dy = 0
        }
        if (!dx && !dy) return null
        return steer.set(dx, 0, dy).normalize()
      }

      // En el mundo: el heroe va hacia la celda del juego al paso elegido, mira
      // hacia donde va y la camara lo sigue sin perder el angulo que eligio quien
      // mira. El clip sale del paso: Run al correr o esprintar, Walk al caminar e
      // Idle quieto, con la velocidad del clip atada a la del heroe.
      //
      // El juego avanza de a una celda por eje. Con las teclas sostenidas la
      // figura no salta de celda en celda: va derecha hacia donde apuntan, a la
      // velocidad del paso, y se acerca de a poco a la celda del juego por el
      // costado. Asi la diagonal es una recta y no una escalera.
      function walk(dt) {
        const pos = hero.root.position
        step.subVectors(heroTarget, pos).setY(0)
        const dist = step.length()
        let moved = 0
        // Siguiendo a la terminal no se sabe a que paso va: se la alcanza rapido.
        const speed = screen === 'mirror' ? 12 : pace().speed
        const dir = dist < 3 ? steerDir() : null
        if (dist > 6) pos.set(heroTarget.x, pos.y, heroTarget.z)
        else if (dir) {
          // Cuanto le falta por delante a la celda del juego: con medio metro de
          // ventaja va a la velocidad del paso; si la alcanzo (una pared), frena.
          const along = step.dot(dir)
          lateral.copy(step).addScaledVector(dir, -along)
          // Jugando, el paso va parejo (entre 0,8 y 1,2 del ritmo) y nunca pasa
          // la celda del juego: no se acelera y frena en cada celda. La
          // correccion de costado es suave mientras el desvio es chico.
          const cellLen = Math.abs(dir.x) * CX + Math.abs(dir.z) * CZ
          const forward =
            screen === 'mirror'
              ? speed * Math.min(1.4, Math.max(0, along / 0.55))
              : along > 0.01
                ? Math.min(
                    along / Math.max(dt, 1e-3),
                    speed * THREE.MathUtils.clamp(1 + (along - 0.5 * cellLen) * 0.8, 0.8, 1.2)
                  )
                : 0
          const lat = lateral.length()
          const sideways =
            THREE.MathUtils.smoothstep(lat, 0.25, 0.5) * Math.min(1, dt * 3) + Math.min(1, dt * 0.6)
          const x = dir.x * forward * dt + lateral.x * sideways
          const z = dir.z * forward * dt + lateral.z * sideways
          pos.x += x
          pos.z += z
          moved = Math.hypot(x, z)
          const yaw = Math.atan2(dir.x, dir.z)
          hero.root.rotation.y += wrap(yaw - hero.root.rotation.y) * Math.min(1, dt * 12)
        } else if (dist > 0.004) {
          moved = Math.min(dist, (speed * 1.12 + dist * 3) * dt)
          pos.addScaledVector(step.normalize(), moved)
          const yaw = Math.atan2(step.x, step.z)
          hero.root.rotation.y += wrap(yaw - hero.root.rotation.y) * Math.min(1, dt * 14)
        }
        const now = performance.now()
        const rate = moved / Math.max(dt, 1e-3)
        velocity += (rate - velocity) * Math.min(1, dt * 8)
        if (rate > 0.2) lastStep = now
        const going = now - lastStep < 170
        stride = going ? stride + dt * 11 : 0
        const swing = going ? Math.sin(stride) * 0.55 : 0
        if (mixer) {
          if (!going) setGait('Idle', 1)
          else {
            const spec = screen === 'mirror' ? (velocity > 3.5 ? GAITS.run : GAITS.walk) : pace()
            // Las piernas siguen la velocidad real del cuerpo.
            const base =
              screen === 'mirror' ? Math.max(velocity, 1) : Math.min(spec.speed * 1.25, velocity)
            setGait(spec.clip, Math.min(spec.most, Math.max(0.8, base / spec.pace)))
          }
        }
        // Sin esqueleto, el heroe de Tripo se balancea.
        const sway = going && !AVATAR.rigged
        avatar.position.y = sway ? Math.abs(Math.sin(stride)) * 0.09 : 0
        avatar.rotation.z = sway ? Math.sin(stride) * 0.05 : 0
        hero.legs[0].rotation.x = swing
        hero.legs[1].rotation.x = -swing
        if (going) {
          hero.arms.left_hand.shoulder.rotation.x = -swing * 0.4
          hero.arms.right_hand.shoulder.rotation.x = swing * 0.4
        }
        if (going) framing.set(0, 1, 0)
        // En un duelo la camara mira entre los dos, para que el rival entre en cuadro.
        follow.set(
          pos.x + framing.x + duelView.x,
          framing.y + bossLift,
          pos.z + framing.z + duelView.z
        )
        if (settings.camera === 'third') floatCamera(dt, going, speed)
        else {
          camera.position.add(step.subVectors(follow, controls.target))
          controls.target.copy(follow)
        }
        sun.position.set(pos.x + 12, 22, pos.z + 10)
        sun.target.position.set(pos.x, 0, pos.z)
        if (ash.visible) ash.position.set(pos.x, 0, pos.z)
      }

      // El escenario del menu de titulo (titulo.js): se arma la primera vez que
      // se muestra el menu.
      let title = null
      // La pradera y su combate en 3D (pradera.js), el inventario como panel
      // (inventario.js) y la vitrina del recorrido (vitrina.js). Cada uno puede
      // devolver null: entonces la pagina sigue como antes.
      const meadow = createMeadow({
        scene,
        camera,
        hero,
        CX,
        CZ,
        session: () => session,
        bundle: () => juego,
        figure,
        label,
        text: (name) => tr(name),
        L
      })
      const inventory = createInventory({
        tr: (name) => tr(name),
        L,
        settings,
        models: () => models,
        loadGlb
      })
      const vitrina = createShowcase({
        scene,
        camera,
        controls,
        renderer,
        hero,
        models: () => models,
        loadGlb,
        loadRig,
        label,
        L,
        say
      })

      renderer.setAnimationLoop(() => {
        timer.update()
        const t = timer.getElapsed()
        const dt = Math.min(0.1, timer.getDelta())
        const now = performance.now()
        hero.hips.position.y = 0.95 + Math.sin(t * 2) * 0.008
        hero.torso.scale.y = 1 + Math.sin(t * 2) * 0.015
        hero.arms.left_hand.shoulder.rotation.x = Math.sin(t * 1.3) * 0.05
        hero.arms.right_hand.shoulder.rotation.x = -Math.sin(t * 1.3) * 0.05
        const since = (now - hop) / 1000
        hero.root.position.y = since < 0.45 ? Math.sin((since / 0.45) * Math.PI) * 0.18 : 0
        ringMat.opacity = since < 1 ? 0.5 + (1 - since) * 0.5 : 0.5
        ring.scale.setScalar(since < 1 ? 1 + (1 - since) * 0.25 : 1)
        for (let i = pops.length - 1; i >= 0; i--) {
          const k = Math.min(1, (now - pops[i].start) / 450)
          const overshoot = 1 + Math.sin(k * Math.PI) * 0.18
          pops[i].object.scale.setScalar(Math.max(0.01, k * overshoot))
          if (k === 1) {
            pops[i].object.scale.setScalar(1)
            pops.splice(i, 1)
          }
        }
        if (ash.visible) {
          for (let i = 0; i < ASH; i++) {
            const y = i * 3 + 1
            ashPos[y] -= 0.006 + (i % 7) * 0.0008
            ashPos[i * 3] += Math.sin(t + i) * 0.0015
            if (ashPos[y] < 0) ashPos[y] = 6
          }
          ashGeo.attributes.position.needsUpdate = true
        }
        if (screen === 'tour') tourFrame(dt, t)
        if (screen === 'play') playFrame(dt, t)
        if (world) walk(dt)
        else if (mixer && screen === 'menu') setGait('Idle', 1)
        if (mixer && avatar.visible) mixer.update(dt)
        // El mundo puede tener movimiento propio: viento, agua, NPC.
        if (world && world.built.update) world.built.update(t)
        if (title && screen === 'menu') title.update(t, dt)
        // La inercia del giro no depende de los fps (0,05 a 60 cuadros).
        controls.dampingFactor = 1 - Math.exp(-3.1 * dt)
        controls.update()
        // El brazo de resorte: la camara se acerca si una casa o el cerro quedan
        // en el medio, solo para este cuadro.
        const pulled = springArm(dt)
        if (pulled) camera.position.add(pulled)
        // Con la camara ya acercada: si le queda encima, el heroe se desvanece.
        fadeHero(dt)
        sizeLabels()
        // El temblor de la pelea con el Coloso: se suma solo para este cuadro.
        const shook = shakeOffset(dt)
        if (shook) camera.position.add(shook)
        // El calado de murallas y casas termina donde mira la camara, aunque la
        // pelea con el Coloso la suba: lo que esta detras del heroe no se cala.
        seeView.y.value = world ? controls.target.y : 1
        effects.render(dt, screen)
        if (shook) camera.position.sub(shook)
        if (pulled) camera.position.sub(pulled)
      })

      // En el menu de titulo la escena se corre a la derecha (una fraccion del
      // ancho) para que los botones no tapen al heroe ni al Coloso. En una
      // pantalla vertical los botones ocupan el medio: la escena sube, y el
      // Coloso y el alba quedan arriba, alrededor del logo.
      let viewShift = 0
      function shiftView() {
        const { clientWidth: w, clientHeight: h } = renderer.domElement
        if (viewShift && w > h) camera.setViewOffset(w, h, -w * viewShift, 0, w, h)
        else if (viewShift) camera.setViewOffset(w, h, 0, h * 0.18, w, h)
        else camera.clearViewOffset()
      }

      // El CSS fija el tamano del lienzo; el buffer lo sigue cuando cambia.
      function fitView() {
        const { clientWidth, clientHeight } = renderer.domElement
        if (!clientWidth || !clientHeight) return
        renderer.setSize(clientWidth, clientHeight, false)
        effects.setSize(clientWidth, clientHeight)
        camera.aspect = clientWidth / clientHeight
        camera.fov = lens()
        // En el celular el giro con el dedo es mas lento: un barrido corto no da
        // media vuelta.
        controls.rotateSpeed = touchPad ? (camera.aspect > 1 ? 0.5 : 0.75) : 1
        shiftView()
        camera.updateProjectionMatrix()
      }
      new ResizeObserver(fitView).observe(renderer.domElement)
      fitView()

      // Un boton de menu, con su nota abajo.
      function button(text, note, action, disabled = false) {
        const b = document.createElement('button')
        b.type = 'button'
        b.append(text)
        if (note) {
          const small = document.createElement('small')
          small.textContent = note
          b.append(small)
        }
        b.disabled = disabled
        b.addEventListener('click', () => {
          b.blur()
          action()
        })
        return b
      }

      function sheet(box, title, back) {

        return () => box.append(button(L('Back', 'Volver'), null, back))
      }

      // Un grupo de botones que elige uno.
      function choice(box, options, current, onPick) {
        const row = document.createElement('div')
        row.className = 'pick'
        for (const [value, text] of options) {
          const b = button(text, null, () => onPick(value))
          b.setAttribute('aria-pressed', String(value === current))
          row.append(b)
        }
        box.append(row)
      }

      function line(box, text, className) {
        const p = document.createElement('p')
        p.textContent = text

      function newGamePage() {
        subPage((box, back) => {
          const done = sheet(box, L('New game', 'Partida nueva'), back)
          const form = document.createElement('form')

          const name = document.createElement('input')
          name.type = 'text'

          name.placeholder = L('your name', 'tu nombre')
          const label = document.createElement('label')
          label.append(L('Your name', 'Tu nombre'), name)
          form.append(label)
          let realm = 'runa'
          const realms = document.createElement('div')
          const paint = () => {
            realms.replaceChildren()
            line(realms, L('Your kingdom', 'Tu reino'))
            choice(
              realms,
              [
                ['runa', L('RUNA, the kingdom of dawn', 'RUNA, el reino del alba')],
                ['nox', L('NOX, the rival kingdom', 'NOX, el reino rival')]
              ],
              realm,
              (value) => {
                realm = value
                paint()
              }
            )
          }
          paint()
          form.append(realms)
          // Con las tres ranuras llenas se elige cual reemplazar.
          const slots = slotsOf()
          let slot = (slots.find((entry) => entry.empty) || {}).slot || null
          const full = !slot
          const replace = document.createElement('div')
          if (full) {
            slot = 1
            const paintSlots = () => {
              replace.replaceChildren()
              line(
                replace,
                L(
                  'All three slots are used: pick one to replace',
                  'Las tres ranuras estan ocupadas: elegi cual reemplazar'
                )
              )
              choice(
                replace,
                slots.map((entry) => [entry.slot, `${entry.slot}. ${entry.name || '-'}`]),
                slot,
                (value) => {
                  slot = value
                  paintSlots()
                }
              )
            }
            paintSlots()
            form.append(replace)
          }
          const error = line(form, '', 'error')
          const start = document.createElement('button')
          start.type = 'submit'
          start.textContent = L('Start', 'Empezar')
          form.append(start)
          form.addEventListener('submit', (event) => {
            event.preventDefault()
            // La terminal solo dibuja ASCII: el juego descarta el resto del nombre.
            const typed = name.value.replace(/[^\x20-\x7e]/g, '').trim()
            if (!typed) {
              error.textContent = L('Write a name to start.', 'Escribi un nombre para empezar.')
              name.focus()
              return
            }
            if (!juego) {
              // Sin el juego empaquetado play() no hace nada: que se vea por que.
              error.textContent =
                L('The game did not load: ', 'El juego no cargo: ') +
                (gameError
                  ? gameError.message
                  : L('still loading, try again', 'todavia cargando, proba de nuevo'))
              return
            }
            try {
              play({ begin: { name: typed, realm, slot } })
            } catch (failure) {
              // Que se vea por que no arranca (en el celular no hay consola).
              error.textContent = L('Could not start: ', 'No pudo empezar: ') + failure.message
              showFailure(failure)
            }
          })
          box.append(form)
          done()
        })
      }

      // Copia una partida de la terminal a la misma ranura de la pagina.
      async function importTerminal(saved) {
        const mine = slotsOf()[saved.slot - 1]
        if (mine && !mine.empty) {
          const sure = confirm(
            L(
              `Slot ${saved.slot} of this page has ${mine.name}. Replace it with the terminal copy?`,
              `La ranura ${saved.slot} de esta pagina tiene a ${mine.name}. Reemplazarla con la copia de la terminal?`
            )
          )
          if (!sure) return
        }
        try {
          const response = await fetch('saves/slot-' + saved.slot + '.json', { cache: 'no-store' })
          if (!response.ok) throw httpError('la partida', response)
          juego.importSave(saved.slot, await response.text())
          play({ load: saved.slot })
        } catch (error) {
          say(L('Could not copy that save: ', 'No pude copiar esa partida: ') + error.message)
        }
      }
